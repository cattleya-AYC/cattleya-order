<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ケーキ解凍数 | Lounge Cattleya</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif; background: #fdf8f4; min-height: 100vh; }
  header { background: #3d2b1f; color: #fff; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  header .icon { font-size: 28px; }
  header h1 { font-size: 20px; font-weight: bold; letter-spacing: 2px; }
  header p { font-size: 12px; opacity: 0.7; margin-top: 2px; }
  .content { padding: 16px 12px; max-width: 700px; margin: 0 auto; }
  .loading { text-align: center; padding: 60px 20px; color: #999; font-size: 15px; }
  .date-label { text-align: center; color: #8b5e3c; font-size: 14px; margin-bottom: 16px; }

  .section-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: bold; color: #3d2b1f; margin: 22px 0 12px; }
  .section-title .badge { font-size: 12px; font-weight: normal; color: #999; background: #f0ece6; border-radius: 6px; padding: 3px 8px; }

  /* 今日の売れ残り（見るだけ） */
  .leftover-row { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 2px solid #e8ddd5; border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; }
  .leftover-row.low { border-color: #f39c12; background: #fffbf0; }
  .leftover-row.out { border-color: #e74c3c; background: #fff5f5; }
  .leftover-name { font-weight: bold; font-size: 16px; color: #3d2b1f; }
  .leftover-val { font-size: 20px; font-weight: bold; }
  .leftover-val.ok { color: #27ae60; }
  .leftover-val.low { color: #e67e22; }
  .leftover-val.out { color: #e74c3c; }
  .warn-icon { margin-left: 6px; }

  /* 明日の解凍数入力 */
  .thaw-card { background: #fff; border: 2px solid #e8ddd5; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .thaw-top { font-weight: bold; font-size: 16px; color: #3d2b1f; margin-bottom: 10px; }
  .thaw-bottom { display: flex; align-items: center; gap: 10px; }
  .thaw-col { text-align: center; flex: 1; }
  .thaw-label { font-size: 10px; color: #999; margin-bottom: 4px; }
  .thaw-val { font-size: 18px; font-weight: bold; border-radius: 8px; padding: 8px; background: #f0ece6; color: #3d2b1f; }
  .thaw-input { width: 100%; height: 46px; text-align: center; font-size: 20px; font-weight: bold; border: 2px solid #c9a882; border-radius: 8px; color: #3d2b1f; background: #fdf8f4; font-family: inherit; }
  .plus-sign, .eq-sign { color: #c9a882; font-size: 18px; font-weight: bold; }
  .thaw-total { font-size: 18px; font-weight: bold; border-radius: 8px; padding: 8px; background: #eafaf1; color: #27ae60; }

  .save-btn { width: 100%; padding: 18px 0; margin-top: 16px; background: #3d2b1f; color: #fff; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; letter-spacing: 1px; font-family: inherit; }
  .save-btn:disabled { background: #ccc; cursor: not-allowed; }
  .saved-msg { text-align: center; color: #27ae60; font-weight: bold; margin-top: 12px; font-size: 16px; }
</style>
</head>
<body>

<header>
  <div class="icon">🍰</div>
  <div>
    <h1>ケーキ 解凍数入力</h1>
    <p>Lounge Cattleya</p>
  </div>
</header>

<div class="content">
  <div class="loading" id="loading">読み込み中...</div>
  <div id="body" style="display:none"></div>
</div>

<script>
const SUPA_URL = 'https://zxdgiszrsmumjjxmvszb.supabase.co';
const SUPA_KEY = 'sb_publishable_LLIkeICkSI-IS-2xMKO9_A_I8MAo2IT';

// 解凍作業が必要な商品のみ（フォンダンショコラ・紅茶のシフォンは冷凍庫から直行のため対象外）
const ITEMS = ['ミルクレープ','ガトーショコラ','チーズケーキ','栗のモンブラン','コーヒーゼリー'];
const ITEMS_SET = new Set(ITEMS);

function itemKey(item) { return 'w' + ITEMS.indexOf(item); }

function toJST() { return new Date(Date.now() + 9*60*60*1000).toISOString().slice(0,10); }
const TODAY = toJST();

function prevDate(d) { const dt = new Date(d); dt.setDate(dt.getDate()-1); return dt.toISOString().slice(0,10); }
function nextDate(d) { const dt = new Date(d); dt.setDate(dt.getDate()+1); return dt.toISOString().slice(0,10); }

const YESTERDAY = prevDate(TODAY);
const TOMORROW = nextDate(TODAY);

async function supaFetch(path) {
  const res = await fetch(SUPA_URL + path, {
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
  });
  return res.json();
}

let remainMap = {};      // 今日の売れ残り（見るだけ）
let tomorrowMap = {};    // 明日の解凍数入力

async function load() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('body').style.display = 'none';

  const [ystockRaw, todayStockRaw, salesRaw, tomorrowStockRaw, yesterdaySalesRaw] = await Promise.all([
    supaFetch('/rest/v1/cake_stock?select=item_name,thawed,sold&date=eq.' + YESTERDAY),
    supaFetch('/rest/v1/cake_stock?select=item_name,thawed&date=eq.' + TODAY),
    supaFetch('/rest/v1/order_items?select=item_name,qty&sale_date=eq.' + TODAY + '&limit=1000'),
    supaFetch('/rest/v1/cake_stock?select=item_name,thawed&date=eq.' + TOMORROW),
    supaFetch('/rest/v1/order_items?select=item_name,qty&sale_date=eq.' + YESTERDAY + '&limit=1000'),
  ]);

  const leftoverFromYesterday = {};
  ITEMS.forEach(item => leftoverFromYesterday[item] = 0);
  (ystockRaw||[]).forEach(r => {
    if (ITEMS_SET.has(r.item_name)) leftoverFromYesterday[r.item_name] = r.thawed || 0;
  });
  const soldYesterday = {};
  ITEMS.forEach(item => soldYesterday[item] = 0);
  (yesterdaySalesRaw||[]).forEach(r => {
    if (ITEMS_SET.has(r.item_name)) soldYesterday[r.item_name] += (r.qty||1);
  });
  ITEMS.forEach(item => {
    leftoverFromYesterday[item] = Math.max(0, leftoverFromYesterday[item] - soldYesterday[item]);
  });

  const todayAdded = {};
  ITEMS.forEach(item => todayAdded[item] = 0);
  (todayStockRaw||[]).forEach(r => {
    if (ITEMS_SET.has(r.item_name)) todayAdded[r.item_name] = r.thawed || 0;
  });

  const soldToday = {};
  ITEMS.forEach(item => soldToday[item] = 0);
  (salesRaw||[]).forEach(r => {
    if (ITEMS_SET.has(r.item_name)) soldToday[r.item_name] += (r.qty||1);
  });

  remainMap = {};
  ITEMS.forEach(item => {
    const total = leftoverFromYesterday[item] + todayAdded[item];
    remainMap[item] = Math.max(0, total - soldToday[item]);
  });

  tomorrowMap = {};
  ITEMS.forEach(item => tomorrowMap[item] = '');
  (tomorrowStockRaw||[]).forEach(r => {
    if (ITEMS_SET.has(r.item_name) && r.thawed) tomorrowMap[r.item_name] = String(r.thawed);
  });

  render();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('body').style.display = 'block';
}

function render() {
  let html = '<div class="date-label">📅 ' + TODAY.replace(/-/g,'/') + '</div>';

  // ① 今日の売れ残り（見るだけ）
  html += '<div class="section-title">📋 今日の売れ残り <span class="badge">見るだけ</span></div>';
  ITEMS.forEach(item => {
    const remain = remainMap[item] || 0;
    const cls = remain <= 0 ? 'out' : remain <= 2 ? 'low' : 'ok';
    const rowCls = remain <= 0 ? 'out' : remain <= 2 ? 'low' : '';
    html += `
      <div class="leftover-row ${rowCls}">
        <div class="leftover-name">${item}</div>
        <div>
          <span class="leftover-val ${cls}">残り ${remain}個</span>
          ${remain <= 0 ? '<span class="warn-icon">⚠️</span>' : ''}
        </div>
      </div>`;
  });

  // ② 明日の解凍数を入力
  html += '<div class="section-title">🧊 明日の解凍数を入力</div>';
  ITEMS.forEach(item => {
    const key = itemKey(item);
    const remain = remainMap[item] || 0;
    const val = tomorrowMap[item];
    html += `
      <div class="thaw-card">
        <div class="thaw-top">${item}</div>
        <div class="thaw-bottom">
          <div class="thaw-col">
            <div class="thaw-label">今日の残り</div>
            <div class="thaw-val">${remain}</div>
          </div>
          <div class="plus-sign">+</div>
          <div class="thaw-col">
            <div class="thaw-label">解凍数</div>
            <input class="thaw-input" type="number" min="0" placeholder="0" value="${val}" data-item="${item}" id="tinput-${key}" onkeydown="if(event.key==='-')event.preventDefault()" />
          </div>
          <div class="eq-sign">=</div>
          <div class="thaw-col">
            <div class="thaw-label">明日の準備数</div>
            <div class="thaw-total" id="ttotal-${key}">${remain + (parseInt(val)||0)}</div>
          </div>
        </div>
      </div>`;
  });

  html += '<button class="save-btn" id="save-btn">💾 保存</button>';
  html += '<div class="saved-msg" id="saved-msg" style="display:none">保存しました ✓</div>';

  document.getElementById('body').innerHTML = html;

  document.querySelectorAll('.thaw-input').forEach(inp => {
    inp.addEventListener('input', e => {
      const item = e.target.dataset.item;
      const key = itemKey(item);
      tomorrowMap[item] = e.target.value;
      const remain = remainMap[item] || 0;
      const total = remain + (parseInt(e.target.value)||0);
      document.getElementById('ttotal-'+key).textContent = total;
    });
  });

  document.getElementById('save-btn').addEventListener('click', async () => {
    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = '保存中...';

    const upserts = ITEMS.map(item => ({
      date: TOMORROW,
      item_name: item,
      thawed: Math.max(0, parseInt(tomorrowMap[item]) || 0),
      sold: 0
    }));

    await fetch(SUPA_URL + '/rest/v1/cake_stock', {
      method: 'POST',
      headers: {
        'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY,
        'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify(upserts)
    });

    btn.disabled = false; btn.textContent = '💾 保存';
    const msg = document.getElementById('saved-msg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 2500);
  });
}

load();
</script>
</body>
</html>
