<script>
const { createClient } = supabase;
const sb = createClient(
  'https://zxdgiszrsmumjjxmvszb.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4ZGdpc3pyc211bWpqeG12c3piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2ODM2MTksImV4cCI6MjA5NTI1OTYxOX0.vNndS7JEzIUsa007EPO2zRoYhUr-z01LM32BKIhMSz4'
);

const PAYROLL_URL = 'https://timecard-payroll.vercel.app/';

let salesData = [];

async function loadData() {
  const year = document.getElementById('yearPicker').value;
  const month = document.getElementById('monthPicker').value;
  document.getElementById('mainContent').innerHTML = '<div class="loading">読み込み中...</div>';
  
  const startDate = year + '-' + month + '-01';
  const lastDay = new Date(parseInt(year), parseInt(month), 0).getDate();
  const endDate = year + '-' + month + '-' + String(lastDay).padStart(2,'0');

  try {
    const { data, error } = await sb.from('sales').select('*')
      .gte('sale_date', startDate)
      .lte('sale_date', endDate)
      .order('sale_date', { ascending: true })
      .order('sale_time', { ascending: true });
    
    if (error) {
      document.getElementById('mainContent').innerHTML = '<div class="error">エラー: ' + error.message + '</div>';
      return;
    }
    salesData = data || [];
    render(year, parseInt(month));
  } catch(e) {
    document.getElementById('mainContent').innerHTML = '<div class="error">接続エラー: ' + e.message + '</div>';
  }
}

function render(year, month) {
  if (salesData.length === 0) {
    document.getElementById('mainContent').innerHTML = '<div class="loading">データなし</div>';
    return;
  }

  const cashSales = salesData.filter(s => s.pay_method === '現金');
  const paySales = salesData.filter(s => s.pay_method === 'ペイキャス');
  const cashTotal = cashSales.reduce((a,s) => a+s.amount, 0);
  const payTotal = paySales.reduce((a,s) => a+s.amount, 0);
  const grandTotal = salesData.reduce((a,s) => a+s.amount, 0);
  const totalCount = salesData.length;
  const totalPeople = salesData.reduce((a,s) => a+(s.people_count||0), 0);

  const byDate = {};
  salesData.forEach(s => {
    const d = s.sale_date;
    if (!byDate[d]) byDate[d] = { cash:0, pay:0, total:0, count:0, people:0, cashMorning:0, cashEvening:0 };
    byDate[d].total += s.amount;
    byDate[d].count++;
    byDate[d].people += s.people_count||0;
    if (s.pay_method === '現金') {
      byDate[d].cash += s.amount;
      if ((s.sale_time||'') < '15:00') byDate[d].cashMorning += s.amount;
      else byDate[d].cashEvening += s.amount;
    } else byDate[d].pay += s.amount;
  });

  let html = '<div class="card"><div class="card-title">' + year + '年' + month + '月　月間合計</div>';
  html += '<div class="total">¥' + grandTotal.toLocaleString() + '</div>';
  html += '<div class="row"><span class="rl">現金合計</span><span class="rv">¥' + cashTotal.toLocaleString() + '</span></div>';
  html += '<div class="row"><span class="rl">ペイキャス合計</span><span class="rv">¥' + payTotal.toLocaleString() + '</span></div>';
  html += '<div class="row"><span class="rl">来客組数</span><span class="rv">' + totalCount + '組</span></div>';
  html += '<div class="row"><span class="rl">来客人数</span><span class="rv">' + totalPeople + '名</span></div></div>';

  let totalCut = 0;
  html += '<div class="card"><div class="card-title">日別売上</div>';
  Object.entries(byDate).sort().forEach(([date, d]) => {
    const day = parseInt(date.split('-')[2]);
    const morningFloor = Math.floor(d.cashMorning / 1000) * 1000;
    const eveningFloor = Math.floor(d.cashEvening / 1000) * 1000;
    const morningCut = d.cashMorning - morningFloor;
    const eveningCut = d.cashEvening - eveningFloor;
    totalCut += morningCut + eveningCut;
    html += '<div class="day-row">';
    html += '<div class="day-title"><span class="day-date">' + day + '日</span><span class="day-total">¥' + d.total.toLocaleString() + '</span></div>';
    html += '<div class="day-detail2">';
    html += '<div class="detail-row"><span class="dl">〜15時現金</span><span class="dv">¥' + d.cashMorning.toLocaleString() + '</span><span class="darrow">→</span><span class="dfloor">入金 ¥' + morningFloor.toLocaleString() + '</span><span class="dcut">(-¥' + morningCut.toLocaleString() + ')</span></div>';
    html += '<div class="detail-row"><span class="dl">15時〜現金</span><span class="dv">¥' + d.cashEvening.toLocaleString() + '</span><span class="darrow">→</span><span class="dfloor">入金 ¥' + eveningFloor.toLocaleString() + '</span><span class="dcut">(-¥' + eveningCut.toLocaleString() + ')</span></div>';
    html += '<div class="detail-row"><span class="dl">ペイキャス</span><span class="dv">¥' + d.pay.toLocaleString() + '</span></div>';
    html += '<div class="detail-row"><span class="dl">来客</span><span class="dv">' + d.count + '組　' + d.people + '名</span></div>';
    html += '</div></div>';
  });
  html += '<div style="margin-top:14px;padding:12px;background:#1a0a0a;border-radius:8px;border:1px solid #c95a5a;text-align:center">';
  html += '<div style="color:#8a7050;font-size:12px;margin-bottom:4px">月間切り捨て合計</div>';
  html += '<div style="color:#c95a5a;font-size:24px;font-weight:900">¥' + totalCut.toLocaleString() + '</div>';
  html += '</div>';
  html += '</div>';

  document.getElementById('mainContent').innerHTML = html;
}
