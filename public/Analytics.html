<script>

const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4ZGdpc3pyc211bWpqeG12c3piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2ODM2MTksImV4cCI6MjA5NTI1OTYxOX0.vNndS7JEzIUsa007EPO2zRoYhUr-z01LM32BKIhMSz4";

function switchTab(tab) {

  document.getElementById('content-visit').style.display = tab === 'visit' ? '' : 'none';
  document.getElementById('content-summary').style.display = tab === 'summary' ? '' : 'none';
  document.getElementById('content-monthly').style.display = tab === 'monthly' ? '' : 'none';
  document.getElementById('content-tax').style.display = tab === 'tax' ? '' : 'none';

async function loadAll() {
  selectedDate = document.getElementById('dateInput').value;
  document.getElementById('headerDate').textContent = selectedDate;

  document.getElementById('content-paycas').innerHTML = '<div class="loading">読み込み中...</div>';
  document.getElementById('content-visit').innerHTML = '<div class="loading">読み込み中...</div>';
  document.getElementById('content-summary').innerHTML = '<div class="loading">読み込み中...</div>';
  document.getElementById('content-monthly').innerHTML = '<div class="loading">読み込み中...</div>';

  const [{ data: sales }, { data: items }] = await Promise.all([
    sb.from("sales").select("*").eq("sale_date", selectedDate).order("sale_time", { ascending: true }),
    sb.from("order_items").select("*").eq("sale_date", selectedDate).order("sale_time", { ascending: true }),
  ]);

  salesData = sales || [];
  orderItemsData = items || [];

  renderPaycas();
  renderVisit();
  renderSummary();
  if (currentTab === 'monthly') loadPaycasMonthly();
  if (currentTab === 'tax') loadTaxSummary();
}

function renderPaycas() {
  const paycasSales = salesData.filter(s => s.pay_method === 'ペイキャス');
  const paycasTotal = paycasSales.reduce((a, s) => a + s.amount, 0);
  const cashTotal = salesData.filter(s => s.pay_method === '現金').reduce((a, s) => a + s.amount, 0);
  const grandTotal = salesData.reduce((a, s) => a + s.amount, 0);

  let html = '';

  html += `
  <div class="paycas-adjust">
    <div class="adj-title">🔧 ペイキャス精算（閉店時）</div>
    <input type="number" id="actualPaycas" placeholder="端末の実際の金額" oninput="calcDiff()">
    <div class="adj-info"><span class="al">システム上のペイキャス</span><span class="av">¥${paycasTotal.toLocaleString()}</span></div>
    <div class="adj-info" id="diffRow" style="display:none">
      <span class="al">差額</span><span class="av" id="diffVal"></span>
    </div>
    <button class="btn-adjust" id="btnAdjust" disabled onclick="doAdjust()">調整実行</button>
    <div id="adjustMsg" style="color:#4aaa5a;font-size:13px;margin-top:8px;text-align:center;"></div>
  </div>`;

  html += `
  <div class="summary-card">
    <div class="label">本日ペイキャス合計</div>
    <div class="amount">¥${paycasTotal.toLocaleString()}</div>
    <div style="margin-top:12px">
      <div class="summary-row"><span class="slabel">現金合計</span><span class="sval">¥${cashTotal.toLocaleString()}</span></div>
      <div class="summary-row"><span class="slabel">総売上</span><span class="sval">¥${grandTotal.toLocaleString()}</span></div>
      <div class="summary-row"><span class="slabel">ペイキャス件数</span><span class="sval">${paycasSales.length}件</span></div>
    </div>
  </div>`;

  if (paycasSales.length === 0) {
    html += '<div class="empty">ペイキャス取引なし</div>';
  } else {
    html += `<div style="color:#8a7050;font-size:12px;margin-bottom:8px">取引一覧</div>`;
    paycasSales.forEach(s => {
      html += `
      <div class="pay-item">
        <div>
          <div class="time">${s.sale_time || '-'}</div>
          <div class="table">テーブル ${s.table_no}</div>
        </div>

function openIcQrModal(date, currentIc, currentQr) {
  icqrEditingDate = date;
  document.getElementById('icqrModalDate').textContent = '📅 ' + date.replace(/-/g,'/') + ' の照合';
  document.getElementById('icqrIcInput').value = currentIc || '';
  document.getElementById('icqrQrInput').value = currentQr || '';

}

function closeIcQrModal() {
  document.getElementById('icqrModalOverlay').style.display = 'none';
  icqrEditingDate = null;
}

async function saveIcQrModal() {
  if (!icqrEditingDate) return;
  const ic = parseInt(document.getElementById('icqrIcInput').value) || 0;
  const qr = parseInt(document.getElementById('icqrQrInput').value) || 0;

  await sb.from('paycas_daily').upsert(
    { sale_date: icqrEditingDate, ic_amount: ic, qr_amount: qr },
    { onConflict: 'sale_date' }
  );

  closeIcQrModal();
  loadPaycasMonthly();
}

// ========== 端末CSVから一括登録 ==========
const IC_METHODS = new Set(['交通系電子マネー(確報)', '楽天Edy電子マネー(確報)', 'WAON(確報)', 'nanaco(確報)', 'QUICPay(確報)', 'iD(確報)']);
const QR_METHODS = new Set(['PayPay（コード決済）','楽天ペイ（コード決済）','d払い（コード決済）','au PAY（コード決済）','メルペイ（コード決済）','JKOPAY（コード決済）','WeChat Pay（コード決済）','J-Coin Pay（コード決済）','Alipay+（コード決済）','UnionPay（コード決済）']);

function parseCsvLine(line) {
  // ダブルクォート区切りのCSVを分割（フィールド内にカンマがある場合を考慮）
  const result = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQuotes = !inQuotes; }
    else if (c === ',' && !inQuotes) { result.push(cur); cur = ''; }
    else { cur += c; }
  }
  result.push(cur);
  return result;
}

function parseAmount(s) {
  if (!s) return 0;
  return parseInt(s.replace(/[\\¥,]/g, '')) || 0;
}

function handleCsvImport(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function(e) {
    const text = e.target.result;
    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length < 2) { alert('CSVの中身が読み取れませんでした'); return; }

    const headers = parseCsvLine(lines[0]);
    const idxDate = headers.indexOf('売上日');
    const idxMethod = headers.indexOf('決済手段');
    const idxAmount = headers.indexOf('売上金額');

    if (idxDate === -1 || idxMethod === -1 || idxAmount === -1) {
      alert('CSVの形式が想定と違うようです（列名を確認してください）');
      return;
    }

    const byDate = {};
    for (let i = 1; i < lines.length; i++) {
      const cols = parseCsvLine(lines[i]);
      const dateRaw = cols[idxDate];
      if (!dateRaw) continue;
      const date = dateRaw.replace(/\//g, '-'); // 2026/06/16 -> 2026-06-16
      const method = cols[idxMethod];
      const amount = parseAmount(cols[idxAmount]);
      if (!byDate[date]) byDate[date] = { ic: 0, qr: 0 };
      if (IC_METHODS.has(method)) byDate[date].ic += amount;
      else if (QR_METHODS.has(method)) byDate[date].qr += amount;
    }

    const upserts = Object.entries(byDate).map(([date, v]) => ({
      sale_date: date, ic_amount: v.ic, qr_amount: v.qr
    }));

    if (upserts.length === 0) { alert('登録できるデータが見つかりませんでした'); return; }

    await sb.from('paycas_daily').upsert(upserts, { onConflict: 'sale_date' });

    event.target.value = '';
    alert(`✅ ${upserts.length}日分を登録しました`);
    loadPaycasMonthly();
  };
  reader.readAsText(file, 'shift_jis');
}

// ========== 🧾 消費税集計 ==========
async function loadTaxSummary() {
  document.getElementById('content-tax').innerHTML = '<div class="loading">読み込み中...</div>';

  const dateVal = document.getElementById('dateInput').value;
  const ym = dateVal ? dateVal.substring(0, 7) : new Date().toISOString().substring(0, 7);
  const [year, month] = ym.split('-');
  const startDate = `${year}-${month}-01`;
  const lastDay = new Date(Number(year), Number(month), 0).getDate();
  const endDate = `${year}-${month}-${String(lastDay).padStart(2,'0')}`;

  const { data: salesMonth } = await sb.from('sales')
    .select('amount, takeout, sale_date')
    .gte('sale_date', startDate).lte('sale_date', endDate)
    .limit(5000);

  const rows = salesMonth || [];

  let dineInGross = 0, dineInTax = 0, dineInCount = 0;
  let takeoutGross = 0, takeoutTax = 0, takeoutCount = 0;

  rows.forEach(s => {
    if (s.takeout) {
      takeoutGross += s.amount;
      takeoutTax += Math.round(s.amount * 8 / 108);
      takeoutCount += 1;
    } else {
      dineInGross += s.amount;
      dineInTax += Math.round(s.amount / 11);
      dineInCount += 1;
    }
  });

  const totalGross = dineInGross + takeoutGross;
  const totalTax = dineInTax + takeoutTax;
  const dineInBase = dineInGross - dineInTax;
  const takeoutBase = takeoutGross - takeoutTax;
  const totalBase = dineInBase + takeoutBase;

  document.getElementById('content-tax').innerHTML = `
    <div style="color:#c9952a;font-size:15px;font-weight:700;margin-bottom:14px;letter-spacing:1px;">🧾 消費税集計 ${year}年${parseInt(month)}月</div>

    <div style="background:#181008;border:2px solid #c9952a;border-radius:12px;padding:16px;margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span style="color:#c9952a;font-size:14px;font-weight:700;">消費税合計</span>
        <span style="color:#c9952a;font-family:serif;font-size:26px;font-weight:900;">¥${totalTax.toLocaleString()}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:#8a7050;">
        <span>税込売上合計 ¥${totalGross.toLocaleString()}</span>
        <span>税抜売上合計 ¥${totalBase.toLocaleString()}</span>
      </div>
    </div>

    <div style="background:#181008;border:1px solid #3d2c14;border-radius:10px;padding:16px;margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span style="color:#f0e6d0;font-size:14px;font-weight:700;">🍽 店内飲食（10%）</span>
        <span style="color:#8a7050;font-size:12px;">${dineInCount}件</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
        <span style="color:#8a7050;font-size:12px;">税込売上</span>
        <span style="color:#f0e6d0;font-size:13px;">¥${dineInGross.toLocaleString()}</span>
      </div>

async function loadPaycasMonthly() {
  document.getElementById('content-monthly').innerHTML = '<div class="loading">読み込み中...</div>';

  const dateVal = document.getElementById('dateInput').value;
  const ym = dateVal ? dateVal.substring(0, 7) : new Date().toISOString().substring(0, 7);
  const [year, month] = ym.split('-');
  const startDate = `${year}-${month}-01`;
  const lastDay = new Date(Number(year), Number(month), 0).getDate();
  const endDate = `${year}-${month}-${String(lastDay).padStart(2,'0')}`;

  const { data: paycasDaily } = await sb.from('paycas_daily')
    .select('*').gte('sale_date', startDate).lte('sale_date', endDate);

  const { data: salesMonth } = await sb.from('sales')
    .select('sale_date, amount, pay_method, table_no')
    .eq('pay_method', 'ペイキャス')
    .gte('sale_date', startDate).lte('sale_date', endDate);

  // 調整レコード判定用（table_no='調整'を含む全データ）
  const adjustDates = new Set((salesMonth || []).filter(s => s.table_no === '調整').map(s => s.sale_date));

  // DB合計は調整レコードを除外
  const salesByDate = {};
  (salesMonth || []).filter(s => s.table_no !== '調整').forEach(s => {
    salesByDate[s.sale_date] = (salesByDate[s.sale_date] || 0) + s.amount;
  });

  const dailyMap = {};
  (paycasDaily || []).forEach(d => { dailyMap[d.sale_date] = d; });

  const allDates = [...new Set([
    ...Object.keys(salesByDate),
    ...Object.keys(dailyMap)
  ])].sort().reverse();

  if (allDates.length === 0) {
    document.getElementById('content-monthly').innerHTML =
      '<div style="color:#8a7050;font-size:14px;text-align:center;padding:16px;">この月のデータはありません</div>';
    return;
  }

  let listHtml = '';
  allDates.forEach(date => {
    const dbTotal = salesByDate[date] || 0;
    const d = dailyMap[date];
    const icqrTotal = d ? (d.ic_amount || 0) + (d.qr_amount || 0) : null;
    const diff = icqrTotal !== null ? icqrTotal - dbTotal : null;
    const hasDiff = diff !== null && diff !== 0;
    const hasAdjust = adjustDates.has(date);
    const dateDisp = date.substring(5).replace('-', '/');

    listHtml += `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #3d2c1444;" onclick="openIcQrModal('${date}', ${d ? (d.ic_amount||0) : 0}, ${d ? (d.qr_amount||0) : 0})">
      <span style="color:${hasDiff ? '#c95a5a' : '#8a7050'};font-size:15px;min-width:50px;">${dateDisp}${hasAdjust ? ' 🔧' : ''}</span>
      <span style="color:#a0e0a0;font-size:14px;min-width:80px;text-align:right;">¥${dbTotal.toLocaleString()}</span>
      <span style="color:#8a7050;font-size:14px;min-width:80px;text-align:right;">${icqrTotal !== null ? '¥' + icqrTotal.toLocaleString() : '---'}</span>
      <span style="font-size:15px;font-weight:700;min-width:60px;text-align:right;color:${diff === null ? '#8a7050' : hasDiff ? '#c95a5a' : '#4aaa5a'};">
        ${diff === null ? '---' : diff === 0 ? '✅' : (diff > 0 ? '+' : '') + '¥' + diff.toLocaleString()}
      </span>
      <span style="color:#8a7050;font-size:13px;margin-left:8px;">✏️</span>
    </div>`;
  });

  document.getElementById('content-monthly').innerHTML = `
    <div style="color:#c9952a;font-size:15px;font-weight:700;margin-bottom:10px;letter-spacing:1px;">📊 ペイキャス差額 ${year}年${month}月</div>
    <button onclick="document.getElementById('csvImportInput').click()" style="width:100%;padding:12px;margin-bottom:10px;background:#1a2a10;border:2px solid #4a8a3a;border-radius:10px;color:#8ae08a;font-size:14px;font-weight:700;cursor:pointer;">
      📥 端末CSVから一括登録
    </button>
    <div id="csvImportMsg" style="display:none;"></div>
    <div style="color:#8a7050;font-size:11px;margin-bottom:10px;">💡 各行をタップするとIC+QR金額を個別に入力・修正できます</div>
    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #3d2c14;margin-bottom:4px;">
      <span style="color:#8a7050;font-size:12px;min-width:50px;">日付</span>
      <span style="color:#8a7050;font-size:12px;min-width:80px;text-align:right;">DB合計</span>
      <span style="color:#8a7050;font-size:12px;min-width:80px;text-align:right;">IC+QR</span>
      <span style="color:#8a7050;font-size:12px;min-width:80px;text-align:right;">差額</span>

function calcDiff() {
  const actual = parseInt(document.getElementById('actualPaycas').value) || 0;
  const paycasSales = salesData.filter(s => s.pay_method === 'ペイキャス');
  const systemTotal = paycasSales.reduce((a, s) => a + s.amount, 0);
  const diff = actual - systemTotal;

  const diffRow = document.getElementById('diffRow');
  const diffVal = document.getElementById('diffVal');
  const btn = document.getElementById('btnAdjust');

  if (!document.getElementById('actualPaycas').value) {
    diffRow.style.display = 'none';
    btn.disabled = true;
    return;
  }

  diffRow.style.display = '';
  if (diff === 0) {
    diffVal.innerHTML = '<span style="color:#4aaa5a">¥0（一致）</span>';
    btn.disabled = true;
  } else if (diff > 0) {
    diffVal.innerHTML = `<span class="adj-diff-pos">+¥${diff.toLocaleString()}（ペイキャス不足）</span>`;
    btn.disabled = false;
  } else {
    diffVal.innerHTML = `<span class="adj-diff-neg">-¥${Math.abs(diff).toLocaleString()}（ペイキャス超過）</span>`;
    btn.disabled = false;
  }
}

async function doAdjust() {
  const actual = parseInt(document.getElementById('actualPaycas').value) || 0;
  const paycasSales = salesData.filter(s => s.pay_method === 'ペイキャス');
  const systemTotal = paycasSales.reduce((a, s) => a + s.amount, 0);
  const diff = actual - systemTotal;

  if (diff === 0) return;

  const targetPay = [...paycasSales].sort((a, b) => b.amount - a.amount)[0];
  const cashSales = salesData.filter(s => s.pay_method === '現金');
  const targetCash = [...cashSales].sort((a, b) => b.amount - a.amount)[0];

  if (!targetPay || !targetCash) {
    document.getElementById('adjustMsg').textContent = 'エラー：調整対象が見つかりません';
    return;
  }

  document.getElementById('btnAdjust').disabled = true;
  document.getElementById('adjustMsg').textContent = '処理中...';

  await sb.from("sales").update({ amount: targetPay.amount + diff }).eq("id", targetPay.id);
  await sb.from("sales").update({ amount: targetCash.amount - diff }).eq("id", targetCash.id);

  document.getElementById('adjustMsg').textContent = `✅ 調整完了！ペイキャス¥${actual.toLocaleString()}に修正しました`;

  await loadAll();
}

function renderVisit() {
  if (salesData.length === 0) {

  const sorted = [...salesData].sort((a, b) => (a.sale_time || '').localeCompare(b.sale_time || ''));

  let html = `<div style="color:#8a7050;font-size:12px;margin-bottom:10px">${sorted.length}組 来店</div>`;

  sorted.forEach(sale => {
    const items = orderItemsData.filter(o =>
      String(o.table_no) === String(sale.table_no) && o.sale_time === sale.sale_time
    );
    const payColor = sale.pay_method === 'ペイキャス' ? '#5a8aca' : '#4aaa5a';

    html += `
    <div class="visit-card">
      <div class="visit-header">
        <div>
          <div class="vtable">テーブル ${sale.table_no}</div>
          <div class="vinfo">退店 ${sale.sale_time || '-'}　${sale.people_count || '-'}名</div>
        </div>
        <div class="vtotal">
          <div class="vtotal-amount">¥${sale.amount.toLocaleString()}</div>
          <div class="vtotal-pay" style="color:${payColor}">${sale.pay_method || '-'}</div>
        </div>
      </div>`;

    if (items.length > 0) {
      html += `<div class="visit-body">`;
      items.forEach(o => {
        const subtotal = o.price * o.qty;
        const isDiscount = o.price < 0;
        html += `
        <div class="order-row">
          <span class="order-name">${o.item_name}</span>
          <span class="order-qty">×${o.qty}</span>
          <span class="order-price ${isDiscount ? 'discount' : ''}">
            ${isDiscount ? '-' : ''}¥${Math.abs(subtotal).toLocaleString()}

      html += `</div>`;

      html += `<div class="visit-body"><div style="color:#3d2c14;font-size:12px">注文明細なし</div></div>`;
    }

    html += `</div>`;
  });

  document.getElementById('content-visit').innerHTML = html;
}
