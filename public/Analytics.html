<script>
const SUPABASE_URL = "https://zxdgiszrsmumjjxmvszb.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4ZGdpc3pyc211bWpqeG12c3piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2ODM2MTksImV4cCI6MjA5NTI1OTYxOX0.vNndS7JEzIUsa007EPO2zRoYhUr-z01LM32BKIhMSz4";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let icqrEditingDate = null;

let currentTab = 'paycas';
let salesData = [];
let orderItemsData = [];
let couponBySaleId = {};
let tobaccoData = [];
let retailDayData = []; // 物販（株式会社ライジンブリスの売上）。カトレアの売上ではないが、ペイキャス端末とレジ現金には一緒に入る
let voidBySaleId = {};     // 元の会計ID → 取消行
let voidByTobaccoId = {};
let auditBySaleId = {};    // 会計ID → 変更履歴
let selectedDate = '';

const today = new Date().toLocaleString("sv-SE", { timeZone: "Asia/Tokyo" }).split(" ")[0];
document.getElementById('dateInput').value = today;
document.getElementById('headerDate').textContent = today;

const TABS = ['paycas', 'visit', 'summary', 'monthly', 'tax', 'cashcheck', 'coupon', 'closing', 'retail'];
function switchTab(tab) {
  currentTab = tab;
  TABS.forEach(t => {
    document.getElementById('tab-' + t).className = 'tab' + (tab === t ? ' active' : '');
    document.getElementById('content-' + t).style.display = tab === t ? '' : 'none';
  });
  if (tab === 'monthly') loadPaycasMonthly();
  if (tab === 'tax') loadTaxSummary();
  if (tab === 'cashcheck') loadCashCheck();
  if (tab === 'coupon') loadCouponSummary();
  if (tab === 'closing') loadClosing();
  if (tab === 'retail') loadRetail();
}

// ========== 共通：1000件を超えても全部取ってくる ==========
async function fetchAll(table, build, orderCol = 'id') {
  const size = 1000;
  let all = [], from = 0;
  while (true) {
    const { data, error } = await build(sb.from(table).select('*')).order(orderCol, { ascending: true }).range(from, from + size - 1);
    if (error) throw error;
    all = all.concat(data || []);
    if (!data || data.length < size) break;
    from += size;
  }
  return all;
}

function monthRange() {
  const dateVal = document.getElementById('dateInput').value;
  const ym = dateVal ? dateVal.substring(0, 7) : today.substring(0, 7);
  const [year, month] = ym.split('-');
  const lastDay = new Date(Number(year), Number(month), 0).getDate();
  return { ym, year, month, startDate: `${year}-${month}-01`, endDate: `${year}-${month}-${String(lastDay).padStart(2, '0')}` };
}

// 組数：プラスの会計を数え、取消（赤伝）の分を引く。「調整」行は数えない（日計確定と同じ数え方）
function groupCount(rows) {
  const r = rows.filter(s => s.table_no !== '調整');
  return r.filter(s => s.amount > 0 && !s.void_of).length - r.filter(s => s.void_of && s.amount < 0).length;
}

// 会計に紐づく明細：会計IDがあればそれで、古いデータはテーブル＋時刻で
function itemsForSale(sale) {
  const byId = orderItemsData.filter(o => o.sales_id === sale.id);
  if (byId.length > 0) return byId;
  return orderItemsData.filter(o => o.sales_id == null && String(o.table_no) === String(sale.table_no) && o.sale_time === sale.sale_time);
}

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function jstDateTime(iso) {
  const t = new Date(iso).toLocaleString('sv-SE', { timeZone: 'Asia/Tokyo' });
  return t.substring(5, 16).replace('-', '/');
}

const FIELD_LABEL = { amount: '金額', pay_method: '支払方法', people_count: '人数', table_no: 'テーブル', sale_date: '日付', sale_time: '時刻', receipt_type: 'レシート', memo: 'メモ', takeout: '持ち帰り', price: '金額', qty: '数量', item_name: '商品' };
function describeChange(a) {
  if (a.action === 'DELETE') return '🗑 行が削除されました（削除前：' + Object.entries(a.old_data || {}).filter(([k]) => FIELD_LABEL[k]).map(([k, v]) => FIELD_LABEL[k] + ' ' + v).join('・') + '）';
  const o = a.old_data || {}, n = a.new_data || {};
  const parts = Object.keys(FIELD_LABEL).filter(k => k in n && JSON.stringify(o[k]) !== JSON.stringify(n[k]))
    .map(k => `${FIELD_LABEL[k]}：${o[k] == null ? '（なし）' : o[k]} → ${n[k] == null ? '（なし）' : n[k]}`);
  return parts.length ? '✏️ ' + parts.join('、') : '✏️ 変更（表示項目以外）';
}

async function loadAll() {
  selectedDate = document.getElementById('dateInput').value;
  document.getElementById('headerDate').textContent = selectedDate;

  document.getElementById('content-paycas').innerHTML = '<div class="loading">読み込み中...</div>';
  document.getElementById('content-visit').innerHTML = '<div class="loading">読み込み中...</div>';
  document.getElementById('content-summary').innerHTML = '<div class="loading">読み込み中...</div>';
  document.getElementById('content-monthly').innerHTML = '<div class="loading">読み込み中...</div>';

  const [{ data: sales }, { data: items }, { data: tobacco }, { data: retailDay }] = await Promise.all([
    sb.from("sales").select("*").eq("sale_date", selectedDate).order("sale_time", { ascending: true }),
    sb.from("order_items").select("*").eq("sale_date", selectedDate).order("sale_time", { ascending: true }),
    sb.from("tobacco_sales").select("*").eq("sale_date", selectedDate).order("id", { ascending: true }),
    sb.from("retail_sales").select("amount,pay_method").eq("sale_date", selectedDate),
  ]);
  retailDayData = retailDay || [];

  salesData = sales || [];
  orderItemsData = items || [];
  tobaccoData = tobacco || [];

  const saleIds = salesData.map(s => s.id).filter(id => id != null);
  const tobaccoIds = tobaccoData.map(t => t.id);
  voidBySaleId = {}; voidByTobaccoId = {}; auditBySaleId = {};
  if (saleIds.length > 0) {
    const [{ data: voids }, { data: audits }] = await Promise.all([
      sb.from("sales").select("id, void_of, sale_date, sale_time, memo").in("void_of", saleIds),
      sb.from("audit_log").select("*").eq("table_name", "sales").in("row_id", saleIds).order("changed_at", { ascending: true }),
    ]);
    (voids || []).forEach(v => { voidBySaleId[v.void_of] = v; });
    (audits || []).forEach(a => { (auditBySaleId[a.row_id] = auditBySaleId[a.row_id] || []).push(a); });
  }
  if (tobaccoIds.length > 0) {
    const { data: tv } = await sb.from("tobacco_sales").select("id, void_of, sale_date").in("void_of", tobaccoIds);
    (tv || []).forEach(v => { voidByTobaccoId[v.void_of] = v; });
  }
  couponBySaleId = {};
  if (saleIds.length > 0) {
    const { data: couponsForSales } = await sb.from("coupons")
      .select("used_sale_id, coupon_type, discount_amount")
      .in("used_sale_id", saleIds);
    (couponsForSales || []).forEach(c => { couponBySaleId[c.used_sale_id] = c; });
  }

  renderPaycas();
  renderVisit();
  renderSummary();
  if (currentTab === 'monthly') loadPaycasMonthly();
  if (currentTab === 'tax') loadTaxSummary();
  if (currentTab === 'coupon') loadCouponSummary();
  if (currentTab === 'closing') loadClosing();
  if (currentTab === 'retail') loadRetail();
}

// その日の物販ペイキャス（端末の合計には物販も入るので、照合のときに足す）
function retailPaycasOfDay() {
  return retailDayData.filter(r => r.pay_method === 'ペイキャス').reduce((a, r) => a + r.amount, 0);
}

function renderPaycas() {
  const paycasSales = salesData.filter(s => s.pay_method === 'ペイキャス');
  const paycasTotal = paycasSales.reduce((a, s) => a + s.amount, 0);
  const cashTotal = salesData.filter(s => s.pay_method === '現金').reduce((a, s) => a + s.amount, 0);
  const grandTotal = salesData.reduce((a, s) => a + s.amount, 0);

  let html = '';

  html += `
  <div class="paycas-adjust">

// ========== 端末CSVから一括登録 ==========
const IC_METHODS = new Set(['交通系電子マネー(確報)', '楽天Edy電子マネー(確報)', 'WAON(確報)', 'nanaco(確報)', 'QUICPay(確報)', 'iD(確報)']);
const QR_METHODS = new Set(['PayPay（コード決済）','楽天ペイ（コード決済）','d払い（コード決済）','au PAY（コード決済）','メルペイ（コード決済）','JKOPAY（コード決済）','WeChat Pay（コード決済）','J-Coin Pay（コード決済）','Alipay+（コード決済）','UnionPay（コード決済）']);

function parseCsvLine(line) {
  // ダブルクォート区切りのCSVを分割（フィールド内にカンマがある場合を考慮）
  const result = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQuotes = !inQuotes; }
    else if (c === ',' && !inQuotes) { result.push(cur); cur = ''; }
    else { cur += c; }
  }
  result.push(cur);
  return result;
}

function parseAmount(s) {
  if (!s) return 0;
  return parseInt(s.replace(/[\\¥,]/g, '')) || 0;
}

function handleCsvImport(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function(e) {
    const text = e.target.result;
    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length < 2) { alert('CSVの中身が読み取れませんでした'); return; }

    const headers = parseCsvLine(lines[0]);
    const idxDate = headers.indexOf('売上日');
    const idxMethod = headers.indexOf('決済手段');
    const idxAmount = headers.indexOf('売上金額');

    if (idxDate === -1 || idxMethod === -1 || idxAmount === -1) {
      alert('CSVの形式が想定と違うようです（列名を確認してください）');
      return;
    }

    const byDate = {};
    for (let i = 1; i < lines.length; i++) {
      const cols = parseCsvLine(lines[i]);
      const dateRaw = cols[idxDate];
      if (!dateRaw) continue;
      const date = dateRaw.replace(/\//g, '-'); // 2026/06/16 -> 2026-06-16
      const method = cols[idxMethod];
      const amount = parseAmount(cols[idxAmount]);
      if (!byDate[date]) byDate[date] = { ic: 0, qr: 0 };
      if (IC_METHODS.has(method)) byDate[date].ic += amount;
      else if (QR_METHODS.has(method)) byDate[date].qr += amount;
    }

    const upserts = Object.entries(byDate).map(([date, v]) => ({
      sale_date: date, ic_amount: v.ic, qr_amount: v.qr
    }));

    if (upserts.length === 0) { alert('登録できるデータが見つかりませんでした'); return; }

    await sb.from('paycas_daily').upsert(upserts, { onConflict: 'sale_date' });

    event.target.value = '';
    alert(`✅ ${upserts.length}日分を登録しました`);
    loadPaycasMonthly();
  };
  reader.readAsText(file, 'shift_jis');
}

function calcDiff() {
  const actual = parseInt(document.getElementById('actualPaycas').value) || 0;
  const paycasSales = salesData.filter(s => s.pay_method === 'ペイキャス');
  const systemTotal = paycasSales.reduce((a, s) => a + s.amount, 0) + retailPaycasOfDay(); // 端末には物販も入る
  const diff = actual - systemTotal;

  const diffRow = document.getElementById('diffRow');
  const diffVal = document.getElementById('diffVal');
  const btn = document.getElementById('btnAdjust');

  if (!document.getElementById('actualPaycas').value) {
    diffRow.style.display = 'none';
    btn.disabled = true;
    return;
  }

  diffRow.style.display = '';
  if (diff === 0) {
    diffVal.innerHTML = '<span style="color:#4aaa5a">¥0（一致）</span>';
    btn.disabled = true;
  } else if (diff > 0) {
    diffVal.innerHTML = `<span class="adj-diff-pos">+¥${diff.toLocaleString()}（ペイキャス不足）</span>`;
    btn.disabled = false;
  } else {
    diffVal.innerHTML = `<span class="adj-diff-neg">-¥${Math.abs(diff).toLocaleString()}（ペイキャス超過）</span>`;
    btn.disabled = false;
  }
}

async function doAdjust() {
  const actual = parseInt(document.getElementById('actualPaycas').value) || 0;
  const paycasSales = salesData.filter(s => s.pay_method === 'ペイキャス');
  const systemTotal = paycasSales.reduce((a, s) => a + s.amount, 0) + retailPaycasOfDay(); // 端末には物販も入る
  const diff = actual - systemTotal;

  if (diff === 0) return;

  // ★税務用：元の会計は書き換えず、「調整」の行を2行（ペイキャス＋／現金−）追加する
  const isPast = selectedDate !== today;
  const msg = (diff > 0
      ? `端末がシステムより¥${diff.toLocaleString()}多いです。\nペイキャスを¥${diff.toLocaleString()}増やし、現金を¥${diff.toLocaleString()}減らす「調整」行を追加します。`
      : `システムが端末より¥${Math.abs(diff).toLocaleString()}多いです。\nペイキャスを¥${Math.abs(diff).toLocaleString()}減らし、現金を¥${Math.abs(diff).toLocaleString()}増やす「調整」行を追加します。`)
    + (isPast ? `\n\n⚠️ ${selectedDate} は過去の日付です。確定済みの日は「確定後に変わった日」として記録されます。` : '')
    + '\n\nよろしいですか？';
  if (!confirm(msg)) return;

  document.getElementById('btnAdjust').disabled = true;
  document.getElementById('adjustMsg').textContent = '処理中...';

  const now = new Date().toLocaleTimeString('sv-SE', { timeZone: 'Asia/Tokyo' }).substring(0, 5);
  const memo = `ペイキャス精算調整（端末¥${actual.toLocaleString()}／システム¥${systemTotal.toLocaleString()}）`;
  const { error } = await sb.from('sales').insert([
    { table_no: '調整', amount: diff, pay_method: 'ペイキャス', sale_date: selectedDate, sale_time: now, people_count: 0, memo },
    { table_no: '調整', amount: -diff, pay_method: '現金', sale_date: selectedDate, sale_time: now, people_count: 0, memo },
  ]);
  if (error) {
    document.getElementById('adjustMsg').textContent = 'エラー：' + error.message;
    document.getElementById('btnAdjust').disabled = false;
    return;
  }

  document.getElementById('adjustMsg').textContent = `✅ 調整完了！ペイキャス¥${actual.toLocaleString()}に合わせました（調整行を追加）`;

  await loadAll();
}

// ========== 取消（赤伝）：元の記録は残し、マイナスの行を追加する ==========
async function voidSale(id) {
  const s = salesData.find(x => x.id === id);
  if (!s) return;
  const reason = prompt(`テーブル${s.table_no}　${s.sale_time}　¥${s.amount.toLocaleString()}（${s.pay_method}）を取り消します。\n\n理由を入力してください（例：テーブル間違いで再会計）`);
  if (reason === null) return;
  if (!reason.trim()) { alert('理由が空なので取り消していません'); return; }
  if (!confirm('本当に取り消しますか？\n\n元の記録はそのまま残り、マイナスの行が今日の日付で追加されます。\nこの操作は元に戻せません。')) return;
  const { data, error } = await sb.rpc('void_sale', { p_sale_id: id, p_reason: reason.trim() });
  if (error) { alert('取消できませんでした：' + error.message); return; }
  alert('✅ 取り消しました（取消行 ID ' + data + '）');
  loadAll();
}

async function voidTobacco(id) {
  const t = tobaccoData.find(x => x.id === id);
  if (!t) return;
  const reason = prompt(`タバコ ${t.item_name}　¥${t.price.toLocaleString()} を取り消します。\n\n理由を入力してください`);
  if (reason === null) return;
  if (!reason.trim()) { alert('理由が空なので取り消していません'); return; }
  if (!confirm('本当に取り消しますか？元の記録は残り、マイナスの行が追加されます。')) return;
  const { data, error } = await sb.rpc('void_tobacco_sale', { p_id: id, p_reason: reason.trim() });
  if (error) { alert('取消できませんでした：' + error.message); return; }
  alert('✅ 取り消しました（取消行 ID ' + data + '）');
  loadAll();
}

function visitListHtml(title, sales, items, tobacco) {
  const byId = {}, byKey = {};
  items.forEach(o => {
    if (o.sales_id != null) (byId[o.sales_id] = byId[o.sales_id] || []).push(o);
    else { const k = `${o.table_no}|${o.sale_date}|${o.sale_time}`; (byKey[k] = byKey[k] || []).push(o); }
  });
  const itemsOf = s => byId[s.id] || byKey[`${s.table_no}|${s.sale_date}|${s.sale_time}`] || [];
  const voided = new Set(sales.filter(s => s.void_of).map(s => s.void_of));
  const yen = n => (n < 0 ? '-' : '') + '¥' + Math.abs(n).toLocaleString();
  const dates = [...new Set([...sales.map(s => s.sale_date), ...tobacco.map(t => t.sale_date)])].sort();

  let monthSales = 0, monthTob = 0, monthGroups = 0;
  const days = dates.map(d => {
    const ds = sales.filter(s => s.sale_date === d).sort((a, b) => (a.sale_time || '').localeCompare(b.sale_time || '') || a.id - b.id);
    const dt = tobacco.filter(t => t.sale_date === d).sort((a, b) => (a.sale_time || '').localeCompare(b.sale_time || '') || a.id - b.id);
    const sum = ds.reduce((a, s) => a + s.amount, 0), tsum = dt.reduce((a, t) => a + t.price, 0), g = groupCount(ds);
    const cash = ds.filter(s => s.pay_method === '現金').reduce((a, s) => a + s.amount, 0);
    const paycas = ds.filter(s => s.pay_method === 'ペイキャス').reduce((a, s) => a + s.amount, 0);
    monthSales += sum; monthTob += tsum; monthGroups += g;
    const rows = ds.map(s => {
      const its = itemsOf(s).map(o => `${esc(o.item_name)} ×${o.qty} ${yen(o.price * o.qty)}`).join('<br>') || '<span style="color:#999">明細なし</span>';
      const note = [s.void_of ? `※取消（元ID ${s.void_of}）` : '', voided.has(s.id) ? '※取消済み' : '', s.takeout ? '持ち帰り(8%)' : '', s.memo ? 'メモ：' + esc(s.memo) : ''].filter(Boolean).join('<br>');
      return `<tr${s.void_of || s.table_no === '調整' ? ' class="sp"' : ''}><td>${s.sale_time || '-'}</td><td>${esc(s.table_no)}</td><td>${s.people_count || 0}</td><td>${esc(s.pay_method || '-')}</td><td class="r">${yen(s.amount)}</td><td>${its}${note ? '<div class="note">' + note + '</div>' : ''}</td><td class="id">${s.id}</td></tr>`;
    }).join('');
    const trows = dt.map(t => `<tr${t.void_of ? ' class="sp"' : ''}><td>${t.sale_time || '-'}</td><td colspan="3">${esc(t.item_name)}${t.void_of ? `　※取消（元ID ${t.void_of}）` : ''}${t.memo ? '<div class="note">' + esc(t.memo) + '</div>' : ''}</td><td class="r">${yen(t.price)}</td><td></td><td class="id">${t.id}</td></tr>`).join('');
    return `<section>
      <h3>${d.replace(/-/g, '/')}（${'日月火水木金土'[new Date(d + 'T00:00:00+09:00').getDay()]}）</h3>
      <div class="dsum">売上 ${yen(sum)}（現金 ${yen(cash)}／ペイキャス ${yen(paycas)}）　${g}組　${tobacco.length || dt.length ? 'タバコ ' + yen(tsum) : ''}</div>
      <table><thead><tr><th>時刻</th><th>テーブル</th><th>人数</th><th>支払</th><th>金額</th><th>注文明細</th><th>ID</th></tr></thead>
      <tbody>${rows}${trows ? `<tr class="tob"><td colspan="7">タバコ単体販売</td></tr>${trows}` : ''}</tbody></table>
    </section>`;
  }).join('');

  return `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>${esc(title)}</title><style>
    @page{size:A4 portrait;margin:12mm}
    body{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:10px;color:#000}
    h2{font-size:16px;text-align:center;margin:0 0 4px} .sub{text-align:center;font-size:10px;color:#555;margin-bottom:10px}
    h3{font-size:13px;margin:14px 0 2px;border-bottom:2px solid #333} .dsum{font-size:11px;margin-bottom:4px}
    table{width:100%;border-collapse:collapse} th{background:#333;color:#fff;padding:3px 4px;font-size:9px;text-align:left}
    td{padding:3px 4px;border-bottom:1px solid #ddd;vertical-align:top} td.r{text-align:right;white-space:nowrap} td.id{color:#999;font-size:8px}
    tr.sp td{background:#f6eaea} tr.tob td{background:#eee;font-weight:700} .note{color:#a33;font-size:9px;margin-top:2px}
    section{page-break-inside:auto} section+section{page-break-before:always}
    @media print{ html{ -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  </style></head><body>
    <h2>${esc(title)}</h2>
    <div class="sub">Lounge Cattleya（株式会社エー・ワイ・シー）　${dates.length}日分　売上合計 ${yen(monthSales)}　${monthGroups}組　タバコ ${yen(monthTob)}　出力 ${new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' })}</div>
    ${days || '<p>データがありません</p>'}
  </body></html>`;
}

// 印刷・PDF用の画面：同じ画面に表示し、上に「印刷・PDF保存」「戻る」ボタンを出す
// （ホーム画面のアプリから開いても戻れるように、新しいウインドウは使わない）
function openPrint(html, fileName) {
  const bar = `<div class="pbar" style="position:sticky;top:0;z-index:9999;display:flex;gap:8px;padding:10px;padding-top:max(10px, env(safe-area-inset-top));background:#222;">
      <button onclick="location.reload()" style="flex:1;padding:12px;font-size:16px;font-weight:700;border:none;border-radius:8px;background:#555;color:#fff;">← 戻る</button>
      <button onclick="window.print()" style="flex:2;padding:12px;font-size:16px;font-weight:700;border:none;border-radius:8px;background:#c9952a;color:#000;">🖨 印刷・PDF保存</button>
    </div>`;
  const css = '<style>@media print{.pbar{display:none !important}}</style><meta name="viewport" content="width=device-width, initial-scale=1.0">';
  let doc = html.replace(/<title>[^<]*<\/title>/, '');
  doc = doc.replace('</head>', (fileName ? `<title>${esc(fileName)}</title>` : '') + css + '</head>');
  doc = doc.replace(/<body([^>]*)>/, (m) => m + bar);
  document.open();
  document.write(doc);
  document.close();
  if (fileName) document.title = fileName; // PDF保存したときのファイル名になる
  setTimeout(() => { try { window.print(); } catch (e) {} }, 500);
}

// ========== 🔒 確定・履歴（税務用） ==========
let closingCache = null;

async function loadClosing() {
  const el = document.getElementById('content-closing');
  el.innerHTML = '<div class="loading">読み込み中...</div>';
  const { ym, year, month, startDate, endDate } = monthRange();
  const startISO = `${startDate}T00:00:00+09:00`;
  const nextYm = Number(month) === 12 ? `${Number(year) + 1}-01` : `${year}-${String(Number(month) + 1).padStart(2, '0')}`;
  const endISO = `${nextYm}-01T00:00:00+09:00`;

  try {
    const [closings, diffs, voids, tvoids, audits] = await Promise.all([
      fetchAll('daily_closings', q => q.gte('sale_date', startDate).lte('sale_date', endDate), 'sale_date'),
      fetchAll('daily_closing_diff', q => q.gte('sale_date', startDate).lte('sale_date', endDate), 'sale_date'),
      fetchAll('sales', q => q.not('void_of', 'is', null).gte('sale_date', startDate).lte('sale_date', endDate)),
      fetchAll('tobacco_sales', q => q.not('void_of', 'is', null).gte('sale_date', startDate).lte('sale_date', endDate)),
      fetchAll('audit_log', q => q.gte('changed_at', startISO).lt('changed_at', endISO)),
    ]);
    closingCache = { ym, year, month, closings, diffs, voids, tvoids, audits };
  } catch (e) {
    el.innerHTML = `<div class="empty">読み込みに失敗しました：${esc(e.message || e)}</div>`;
    return;
  }
  const { closings, diffs, voids, tvoids, audits } = closingCache;

  const sum = k => closings.reduce((a, c) => a + (c[k] || 0), 0);
  const diffMap = {}; diffs.forEach(d => { diffMap[d.sale_date] = d; });

  let html = `<div class="sec-title" style="margin-top:0">🔒 確定済みの売上 ${year}年${parseInt(month)}月</div>`;

  html += `
  <div class="summary-card">
    <div class="label">確定済み ${closings.length}日分の総売上（タバコ別）</div>
    <div class="amount">¥${sum('sales_total').toLocaleString()}</div>
    <div style="margin-top:12px">
      <div class="summary-row"><span class="slabel">現金</span><span class="sval">¥${sum('cash_total').toLocaleString()}</span></div>
      <div class="summary-row"><span class="slabel">ペイキャス</span><span class="sval">¥${sum('paycas_total').toLocaleString()}</span></div>
      ${sum('other_total') ? `<div class="summary-row"><span class="slabel">その他（未回収など）</span><span class="sval">¥${sum('other_total').toLocaleString()}</span></div>` : ''}
      <div class="summary-row"><span class="slabel">うち持ち帰り</span><span class="sval">¥${sum('takeout_total').toLocaleString()}</span></div>
      <div class="summary-row"><span class="slabel">タバコ売上</span><span class="sval">¥${sum('tobacco_total').toLocaleString()}</span></div>
      <div class="summary-row"><span class="slabel">組数・人数</span><span class="sval">${sum('group_count').toLocaleString()}組・${sum('people_count').toLocaleString()}名</span></div>
    </div>
  </div>
  <div style="color:#8a7050;font-size:11px;margin:-6px 0 14px;">毎晩23:55に自動で確定。確定した数字はあとから書き換えできません。</div>`;

  if (diffs.length > 0) {
    html += `<div class="warn-box">⚠️ 確定後に数字が変わった日があります<br>` +
      diffs.map(d => `${d.sale_date.substring(5).replace('-', '/')}　確定 ¥${Number(d.closed_total).toLocaleString()} → 今 ¥${Number(d.current_total).toLocaleString()}（${d.diff > 0 ? '+' : ''}¥${Number(d.diff).toLocaleString()}）`).join('<br>') +
      `<br><span style="font-size:11px;color:#c08080">下の「変更履歴」で何が変わったか確認できます</span></div>`;
  }

  if (closings.length === 0) {
    html += '<div class="empty">この月の確定データはまだありません</div>';
  } else {
    html += `<div class="cl-row head"><span>日付</span><span>総売上</span><span>現金</span><span>ペイキャス</span><span>組</span></div>`;
    [...closings].reverse().forEach(c => {
      const d = diffMap[c.sale_date];
      html += `<div class="cl-row" style="${d ? 'color:#e08a8a' : ''}">
        <span>${c.sale_date.substring(5).replace('-', '/')}${d ? ' ⚠️' : ''}</span>
        <span style="color:#c9952a;font-weight:700">¥${c.sales_total.toLocaleString()}</span>
        <span>¥${c.cash_total.toLocaleString()}</span>
        <span>¥${c.paycas_total.toLocaleString()}</span>
        <span>${c.group_count}</span>
      </div>`;
    });
  }

  html += `
  <button onclick="printClosing()" style="width:100%;margin-top:14px;padding:14px;background:#1a2a4a;border:2px solid #4a8aca;border-radius:10px;color:#8ac8ff;font-size:16px;font-weight:900;cursor:pointer;">📄 確定売上 PDF印刷</button>
  <button id="btnVisitMonth" onclick="printVisitMonth()" style="width:100%;margin-top:10px;padding:14px;background:#1a2a4a;border:2px solid #4a8aca;border-radius:10px;color:#8ac8ff;font-size:16px;font-weight:900;cursor:pointer;">📄 ${parseInt(month)}月の来店者一覧 PDF印刷（1日1ページ）</button>
  <button id="btnBackup" onclick="downloadMonthlyBackup()" style="width:100%;margin-top:10px;padding:14px;background:#1a2a10;border:2px solid #4a8a3a;border-radius:10px;color:#8ae08a;font-size:16px;font-weight:900;cursor:pointer;">💾 ${parseInt(month)}月のバックアップ（ZIP）</button>
  <div style="color:#8a7050;font-size:11px;margin-top:6px;text-align:center;">ダウンロードしたZIPは、Googleドライブの「カトレア税務バックアップ」フォルダへ。GitHubには置かないでください。</div>`;

  // 取消一覧
  const allVoids = [
    ...voids.map(v => ({ kind: '会計', when: `${v.sale_date} ${v.sale_time || ''}`, label: `テーブル${v.table_no}・${v.pay_method || ''}`, amount: v.amount, memo: v.memo })),
    ...tvoids.map(v => ({ kind: 'タバコ', when: `${v.sale_date} ${v.sale_time || ''}`, label: v.item_name, amount: v.price, memo: v.memo })),
  ].sort((a, b) => b.when.localeCompare(a.when));
  html += `<div class="sec-title">↩ 取消（赤伝） ${allVoids.length}件</div>`;
  if (allVoids.length === 0) html += '<div style="color:#5a4a30;font-size:13px;text-align:center;padding:10px">この月の取消はありません</div>';
  allVoids.forEach(v => {
    html += `<div class="log-item"><div class="lt">${v.when.substring(5).replace('-', '/')}　${v.kind}　${esc(v.label)}　<span style="color:#e08a8a">-¥${Math.abs(v.amount).toLocaleString()}</span></div><div class="lb">${esc(v.memo || '')}</div></div>`;
  });

  // 変更履歴
  html += `<div class="sec-title">✏️ 変更履歴 ${audits.length}件</div>`;
  if (audits.length === 0) html += '<div style="color:#5a4a30;font-size:13px;text-align:center;padding:10px">この月に変更・削除はありません</div>';
  const tLabel = { sales: '売上', order_items: '明細', tobacco_sales: 'タバコ' };
  [...audits].reverse().slice(0, 200).forEach(a => {
    const base = a.old_data || {};
    const what = a.table_name === 'sales' ? `テーブル${base.table_no}・${base.sale_date} ${base.sale_time || ''}`
      : a.table_name === 'order_items' ? `${base.item_name}（${base.sale_date}）`
      : `${base.item_name}（${base.sale_date}）`;
    html += `<div class="log-item"><div class="lt">${jstDateTime(a.changed_at)}　${tLabel[a.table_name] || a.table_name} ID ${a.row_id}　${esc(what)}</div><div class="lb">${esc(describeChange(a))}</div></div>`;
  });
  if (audits.length > 200) html += '<div style="color:#8a7050;font-size:11px;text-align:center">※画面には新しい200件まで。全件はバックアップZIPに入っています</div>';

  el.innerHTML = html;
}

function printClosing() {
  if (!closingCache) return;
  const { year, month, closings, diffs, voids, tvoids } = closingCache;
  const sum = k => closings.reduce((a, c) => a + (c[k] || 0), 0);

function toCsv(rows) {
  if (!rows.length) return '\uFEFF（データなし）\r\n';
  const cols = [...new Set(rows.flatMap(r => Object.keys(r)))];
  const cell = v => {
    if (v == null) return '';
    const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return '\uFEFF' + [cols.join(','), ...rows.map(r => cols.map(c => cell(r[c])).join(','))].join('\r\n') + '\r\n';
}

function bankListHtml(year, month, sales) {
  const m = parseInt(month);
  const byDate = {};
  sales.forEach(s => {
    const d = s.sale_date;
    if (!byDate[d]) byDate[d] = { cashMorning: 0, cashEvening: 0 };
    if (s.pay_method === '現金') {
      if ((s.sale_time || '') < '15:00') byDate[d].cashMorning += s.amount;
      else byDate[d].cashEvening += s.amount;
    }
  });
  const y = n => '¥' + n.toLocaleString();
  let tM = 0, tE = 0, tC = 0;
  const rows = Object.entries(byDate).sort().map(([date, d]) => {
    const mF = Math.floor(d.cashMorning / 1000) * 1000;
    const eF = Math.floor(d.cashEvening / 1000) * 1000;
    const coin = (d.cashMorning - mF) + (d.cashEvening - eF);
    tM += mF; tE += eF; tC += coin;
    return `<tr><td>${parseInt(date.split('-')[2])}日</td><td>${y(d.cashMorning)}</td><td class="dep">${y(mF)}</td><td>${y(d.cashEvening)}</td><td class="dep">${y(eF)}</td><td>${y(coin)}</td></tr>`;

  const title = `カトレア_${year}年${String(m).padStart(2, '0')}月_銀行入金額`;
  return `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>${title}</title>

  body { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 10px; color: #000; }

</style></head><body>

    </div>
  </div>`;

  const names = Object.keys(byItem);
  if (names.length) {
    html += `<div class="summary-card"><div class="label" style="margin-bottom:8px">商品別</div>` +
      names.sort().map(n => `<div class="summary-row"><span class="slabel">${esc(n)}　${byItem[n].qty}個</span><span class="sval">¥${byItem[n].amount.toLocaleString()}</span></div>`).join('') + `</div>`;
  }

  if (!sales.length) {

    [...sales].sort((a, b) => (b.sale_date + (b.sale_time || '')).localeCompare(a.sale_date + (a.sale_time || '')) || b.id - a.id).forEach(r => {
      const isRev = !!r.void_of, isVoided = voided.has(r.id);

async function voidRetail(id) {
  const r = retailCache && retailCache.sales.find(x => x.id === id);
  if (!r) return;
  const reason = prompt(`物販 RB${String(id).padStart(6, '0')}　¥${r.amount.toLocaleString()}（${r.pay_method}）を取り消します。\n\n理由を入力してください`);
  if (reason === null) return;
  if (!reason.trim()) { alert('理由が空なので取り消していません'); return; }
  if (!confirm('本当に取り消しますか？\n\n元の記録は残り、マイナスの行が今日の日付で追加されます。在庫の販売数も戻ります。')) return;
  const { data, error } = await sb.rpc('void_retail_sale', { p_id: id, p_reason: reason.trim() });
  if (error) { alert('取消できませんでした：' + error.message); return; }
  alert('✅ 取り消しました（取消行 RB' + String(data).padStart(6, '0') + '）');
  loadRetail();
}

    <table><tr><th>日付</th><th>売上</th><th>現金</th><th>ペイキャス</th></tr>${dayRows || '<tr><td colspan="4">販売なし</td></tr>'}
    <tr class="t"><td>合計</td><td>${yen(cash + paycas)}</td><td>${yen(cash)}</td><td>${yen(paycas)}</td></tr></table>
    <h3>販売の明細</h3>
    <table><tr><th>日時</th><th>番号</th><th>商品</th><th>支払</th><th>金額</th></tr>${detailRows || '<tr><td colspan="5">販売なし</td></tr>'}</table>
  </body></html>`;
  openPrint(html, `ライジンブリス_物販売上_${ym}`);
}

// ---- 現金チェック記録（Cash.htmlから移設） ----
let cashCheckRows = [];

async function loadCashCheck() {
  document.getElementById('content-cashcheck').innerHTML = '<div class="loading">読み込み中...</div>';

  const [{ data: data1, error: err1 }, { data: data2, error: err2 }] = await Promise.all([
    sb.from("cash_counts").select("*").order("counted_at", { ascending: false }).limit(30),
    sb.from("cashcheck_logs").select("*").order("checked_at", { ascending: false }).limit(30),
  ]);

  if (err1 && err2) {
    document.getElementById('content-cashcheck').innerHTML = '<div class="empty">テーブルが未作成です</div>';
    return;
  }

  const rows1 = (data1 || []).map(r => ({
    counted_at: r.counted_at,
    count_date: r.count_date,
    count_time: r.count_time,
    staff: r.staff,
    total_amount: r.total_amount,
    diff_amount: r.diff_amount,
    chips: [
      r.v10000 && `1万×${r.v10000}`,
      r.v5000  && `5千×${r.v5000}`,
      r.v1000  && `千×${r.v1000}`,
      r.v500   && `500×${r.v500}`,
      r.v100   && `100×${r.v100}`,
      r.v50    && `50×${r.v50}`,
      r.v10    && `10×${r.v10}`,
      r.v5     && `5×${r.v5}`,
      r.v1     && `1×${r.v1}`,
    ].filter(Boolean),
  }));

  const existingKeys = new Set(rows1.map(r => r.counted_at));
  const rows2 = (data2 || [])
    .filter(r => !existingKeys.has(r.checked_at))
    .map(r => {
      const jst = new Date(r.checked_at).toLocaleString("sv-SE", { timeZone: "Asia/Tokyo" });
      return {
        counted_at: r.checked_at,
        count_date: jst.split(" ")[0],
        count_time: jst.split(" ")[1].slice(0,5),
        staff: r.staff,
        total_amount: null,
        diff_amount: r.diff,
        chips: [],
      };
    });

  const allRows = [...rows1, ...rows2].sort((a, b) => new Date(b.counted_at) - new Date(a.counted_at)).slice(0, 40);
  cashCheckRows = allRows;

  if (allRows.length === 0) {
    document.getElementById('content-cashcheck').innerHTML = '<div class="empty">記録なし</div>';
    return;
  }

  let html = `<button onclick="printCashCheck()" style="width:100%;margin-bottom:14px;padding:14px;background:#1a2a4a;border:2px solid #4a8aca;border-radius:10px;color:#8ac8ff;font-size:16px;font-weight:900;cursor:pointer;">🖨️ PDF印刷（白黒）</button>`;

  allRows.forEach(r => {
    let diffHtml = '';
    if (r.diff_amount !== null) {
      if (r.diff_amount === 0) diffHtml = '<span style="color:#4aaa5a;font-size:12px">　✅ 一致</span>';
      else if (r.diff_amount > 0) diffHtml = `<span style="color:#5a8aca;font-size:12px">　+¥${r.diff_amount.toLocaleString()}</span>`;
      else diffHtml = `<span style="color:#c95a5a;font-size:12px">　-¥${Math.abs(r.diff_amount).toLocaleString()}</span>`;
    }

    const totalHtml = r.total_amount !== null
      ? `<div class="history-total">¥${r.total_amount.toLocaleString()}</div>`
      : `<div class="history-total" style="color:#8a7050;font-size:16px">—</div>`;

    html += `
    <div class="history-card">
      <div class="history-header">
        <div>
          <div class="history-time">${r.count_date} ${r.count_time}${r.staff ? "　" + r.staff : ""}</div>
          ${diffHtml}
        </div>
        ${totalHtml}
      </div>
      <div class="history-detail">
        ${r.chips.map(c => `<div class="history-chip">${c}</div>`).join('')}
      </div>
    </div>`;
  });

  document.getElementById('content-cashcheck').innerHTML = html;
}

function printCashCheck() {
  if (!cashCheckRows.length) return;

  const rowsHtml = cashCheckRows.map(r => {
    const diffText = r.diff_amount === null ? '—'
      : r.diff_amount === 0 ? '¥0（一致）'
      : r.diff_amount > 0 ? `+¥${r.diff_amount.toLocaleString()}`
      : `-¥${Math.abs(r.diff_amount).toLocaleString()}`;
    const totalText = r.total_amount !== null ? `¥${r.total_amount.toLocaleString()}` : '—';
    const chipsText = r.chips.length ? r.chips.join('　') : '—';
    return `<tr>
      <td>${r.count_date} ${r.count_time}</td>
      <td>${r.staff || '—'}</td>
      <td>${totalText}</td>
      <td>${diffText}</td>
      <td style="font-size:11px;">${chipsText}</td>
    </tr>`;
  }).join('');

  const html = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><style>
    body{font-family:'Hiragino Mincho ProN',serif;padding:20px;color:#000;background:#fff;}
    h2{text-align:center;margin-bottom:4px;}
    p.sub{text-align:center;color:#555;font-size:12px;margin-bottom:20px;}
    table{width:100%;border-collapse:collapse;font-size:12px;}
    th,td{border:1px solid #999;padding:6px 8px;}
    th{background:#f0f0f0;text-align:center;}
    td:nth-child(3),td:nth-child(4){text-align:right;white-space:nowrap;}
    @media print{ html{ -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  </style></head><body>
    <h2>現金チェック記録</h2>
    <p class="sub">出力日時: ${new Date().toLocaleString('ja-JP')}</p>
    <table>
      <tr><th>日時</th><th>担当</th><th>合計</th><th>差額</th><th>内訳</th></tr>
      ${rowsHtml}
    </table>
  </body></html>`;

  openPrint(html, `カトレア_現金チェック_${today}`);
}

loadAll();
