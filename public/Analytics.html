<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cattleya 詳細</title>
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/cattleya-AYC/cattleya-order/main/Analytics.PNG">
<link rel="icon" href="https://raw.githubusercontent.com/cattleya-AYC/cattleya-order/main/Analytics.PNG">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0905;
    color: #f0e6d0;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    min-height: 100vh;
  }

  /* ヘッダー */
  .header {
    background: #181008;
    border-bottom: 1px solid #3d2c14;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-title {
    font-size: 18px;
    color: #c9952a;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .header-date {
    font-size: 12px;
    color: #8a7050;
  }

  /* 日付選択 */
  .date-bar {
    background: #181008;
    padding: 10px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid #3d2c14;
  }
  .date-bar input[type="date"] {
    background: #251a0a;
    border: 1px solid #3d2c14;
    border-radius: 8px;
    color: #f0e6d0;
    padding: 8px 12px;
    font-size: 14px;
    flex: 1;
  }
  .btn-reload {
    background: #c9952a;
    border: none;
    border-radius: 8px;
    color: #0d0905;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  /* タブ */
  .tabs {
    display: flex;
    background: #181008;
    border-bottom: 2px solid #3d2c14;
  }
  .tab {
    flex: 1;
    padding: 14px 8px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: #8a7050;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
  }
  .tab.active {
    color: #c9952a;
    border-bottom: 3px solid #c9952a;
    background: #1a1008;
  }

  /* コンテンツ */
  .content { padding: 14px 12px; }

  /* サマリーカード */
  .summary-card {
    background: #181008;
    border: 1px solid #3d2c14;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .summary-card .label {
    font-size: 12px;
    color: #8a7050;
    margin-bottom: 4px;
  }
  .summary-card .amount {
    font-size: 32px;
    font-weight: 900;
    color: #c9952a;
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid #3d2c1433;
    font-size: 13px;
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .slabel { color: #8a7050; }
  .summary-row .sval { color: #c9952a; font-weight: 700; }

  /* ペイキャス取引リスト */
  .pay-item {
    background: #181008;
    border: 1px solid #3d2c14;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pay-item .time { color: #8a7050; font-size: 13px; }
  .pay-item .table { color: #f0e6d0; font-size: 15px; font-weight: 700; margin-top: 2px; }
  .pay-item .pamount { color: #c9952a; font-size: 20px; font-weight: 900; }

  /* 来店者カード */
  .visit-card {
    background: #181008;
    border: 1px solid #3d2c14;
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .visit-header {
    background: #251a0a;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .visit-header .vtable {
    font-size: 20px;
    font-weight: 900;
    color: #c9952a;
  }
  .visit-header .vinfo {
    font-size: 12px;
    color: #8a7050;
    margin-top: 2px;
  }
  .visit-header .vtotal {
    text-align: right;
  }
  .visit-header .vtotal-amount {
    font-size: 22px;
    font-weight: 900;
    color: #c9952a;
  }
  .visit-header .vtotal-pay {
    font-size: 12px;
    color: #8a7050;
    margin-top: 2px;
  }
  .visit-body { padding: 10px 14px; }
  .order-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid #3d2c1422;
    font-size: 13px;
  }
  .order-row:last-child { border-bottom: none; }
  .order-name { color: #f0e6d0; flex: 1; }
  .order-qty { color: #8a7050; margin: 0 10px; }
  .order-price { color: #c9952a; }
  .order-price.discount { color: #4aaa5a; }

  /* ローディング・エラー */
  .loading {
    text-align: center;
    color: #8a7050;
    padding: 40px;
    font-size: 14px;
  }
  .empty {
    text-align: center;
    color: #3d2c14;
    padding: 40px;
    font-size: 14px;
  }

  /* ペイキャス精算ボタン */
  .paycas-adjust {
    background: #1a2510;
    border: 1px solid #2a6a3a;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .paycas-adjust .adj-title {
    color: #4aaa5a;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .paycas-adjust input {
    width: 100%;
    background: #0d1a0a;
    border: 1px solid #2a6a3a;
    border-radius: 8px;
    color: #f0e6d0;
    padding: 12px;
    font-size: 20px;
    font-weight: 700;
    text-align: right;
    margin-bottom: 10px;
  }
  .adj-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 8px;
  }
  .adj-info .al { color: #8a7050; }
  .adj-info .av { color: #f0e6d0; font-weight: 700; }
  .adj-diff-pos { color: #5a8aca; font-weight: 700; }
  .adj-diff-neg { color: #c95a5a; font-weight: 700; }
  .btn-adjust {
    width: 100%;
    padding: 14px;
    background: #2a6a3a;
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }
  .btn-adjust:disabled {
    background: #3d2c14;
    color: #8a7050;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">🌸 Cattleya 詳細</div>
  <div class="header-date" id="headerDate"></div>
</div>

<div class="date-bar">
  <input type="date" id="dateInput">
  <button class="btn-reload" onclick="loadAll()">表示</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('paycas')" id="tab-paycas">💳 ペイキャス</div>
  <div class="tab" onclick="switchTab('visit')" id="tab-visit">👥 来店者</div>
  <div class="tab" onclick="switchTab('summary')" id="tab-summary">📊 途中集計</div>
</div>

<div class="content" id="content-paycas">
  <div class="loading">読み込み中...</div>
</div>

<!-- ペイキャスIC/QR差額月別一覧 -->
<div class="content" id="paycas-monthly-wrap" style="display:none;">
  <div style="color:#c9952a;font-size:15px;font-weight:700;margin-bottom:10px;letter-spacing:1px;">📊 ペイキャス差額 月別一覧</div>
  <div id="paycas-monthly"><div class="loading">読み込み中...</div></div>
</div>

<div class="content" id="content-visit" style="display:none">
  <div class="loading">読み込み中...</div>
</div>

<div class="content" id="content-summary" style="display:none">
  <div class="loading">読み込み中...</div>
</div>

<script>
const SUPABASE_URL = "https://zxdgiszrsmumjjxmvszb.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4ZGdpc3pyc211bWpqeG12c3piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2ODM2MTksImV4cCI6MjA5NTI1OTYxOX0.vNndS7JEzIUsa007EPO2zRoYhUr-z01LM32BKIhMSz4";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentTab = 'paycas';
let salesData = [];
let orderItemsData = [];
let selectedDate = '';

// 今日の日付をセット
const today = new Date().toLocaleString("sv-SE", { timeZone: "Asia/Tokyo" }).split(" ")[0];
document.getElementById('dateInput').value = today;
document.getElementById('headerDate').textContent = today;

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-paycas').className = 'tab' + (tab === 'paycas' ? ' active' : '');
  document.getElementById('tab-visit').className = 'tab' + (tab === 'visit' ? ' active' : '');
  document.getElementById('tab-summary').className = 'tab' + (tab === 'summary' ? ' active' : '');
  document.getElementById('content-paycas').style.display = tab === 'paycas' ? '' : 'none';
  document.getElementById('paycas-monthly-wrap').style.display = tab === 'paycas' ? '' : 'none';
  document.getElementById('content-visit').style.display = tab === 'visit' ? '' : 'none';
  document.getElementById('content-summary').style.display = tab === 'summary' ? '' : 'none';
}

async function loadAll() {
  selectedDate = document.getElementById('dateInput').value;
  document.getElementById('headerDate').textContent = selectedDate;

  document.getElementById('content-paycas').innerHTML = '<div class="loading">読み込み中...</div>';
  document.getElementById('content-visit').innerHTML = '<div class="loading">読み込み中...</div>';
  document.getElementById('content-summary').innerHTML = '<div class="loading">読み込み中...</div>';

  const [{ data: sales }, { data: items }] = await Promise.all([
    sb.from("sales").select("*").eq("sale_date", selectedDate).order("sale_time", { ascending: true }),
    sb.from("order_items").select("*").eq("sale_date", selectedDate).order("sale_time", { ascending: true }),
  ]);

  salesData = sales || [];
  orderItemsData = items || [];

  renderPaycas();
  renderVisit();
  renderSummary();
}

function renderPaycas() {
  const paycasSales = salesData.filter(s => s.pay_method === 'ペイキャス');
  const paycasTotal = paycasSales.reduce((a, s) => a + s.amount, 0);
  const cashTotal = salesData.filter(s => s.pay_method === '現金').reduce((a, s) => a + s.amount, 0);
  const grandTotal = salesData.reduce((a, s) => a + s.amount, 0);

  let html = '';

  // ペイキャス精算ボタン
  html += `
  <div class="paycas-adjust">
    <div class="adj-title">🔧 ペイキャス精算（閉店時）</div>
    <input type="number" id="actualPaycas" placeholder="端末の実際の金額" oninput="calcDiff()">
    <div class="adj-info"><span class="al">システム上のペイキャス</span><span class="av">¥${paycasTotal.toLocaleString()}</span></div>
    <div class="adj-info" id="diffRow" style="display:none">
      <span class="al">差額</span><span class="av" id="diffVal"></span>
    </div>
    <button class="btn-adjust" id="btnAdjust" disabled onclick="doAdjust()">調整実行</button>
    <div id="adjustMsg" style="color:#4aaa5a;font-size:13px;margin-top:8px;text-align:center;"></div>
  </div>`;

  // サマリー
  html += `
  <div class="summary-card">
    <div class="label">本日ペイキャス合計</div>
    <div class="amount">¥${paycasTotal.toLocaleString()}</div>
    <div style="margin-top:12px">
      <div class="summary-row"><span class="slabel">現金合計</span><span class="sval">¥${cashTotal.toLocaleString()}</span></div>
      <div class="summary-row"><span class="slabel">総売上</span><span class="sval">¥${grandTotal.toLocaleString()}</span></div>
      <div class="summary-row"><span class="slabel">ペイキャス件数</span><span class="sval">${paycasSales.length}件</span></div>
    </div>
  </div>`;

  // ペイキャス取引一覧
  if (paycasSales.length === 0) {
    html += '<div class="empty">ペイキャス取引なし</div>';
  } else {
    html += `<div style="color:#8a7050;font-size:12px;margin-bottom:8px">取引一覧</div>`;
    paycasSales.forEach(s => {
      html += `
      <div class="pay-item">
        <div>
          <div class="time">${s.sale_time || '-'}</div>
          <div class="table">テーブル ${s.table_no}</div>
        </div>
        <div class="pamount">¥${s.amount.toLocaleString()}</div>
      </div>`;
    });
  }

  document.getElementById('content-paycas').innerHTML = html;

  // IC/QR差額月別一覧を読み込み
  loadPaycasMonthly();
}

async function loadPaycasMonthly() {
  // 表示中の月を取得
  const dateVal = document.getElementById('dateInput').value;
  const ym = dateVal ? dateVal.substring(0, 7) : new Date().toISOString().substring(0, 7);
  const [year, month] = ym.split('-');
  const startDate = `${year}-${month}-01`;
  const lastDay = new Date(Number(year), Number(month), 0).getDate();
  const endDate = `${year}-${month}-${String(lastDay).padStart(2,'0')}`;

  // paycas_dailyからIC/QRデータ取得
  const { data: paycasDaily } = await sb.from('paycas_daily')
    .select('*').gte('sale_date', startDate).lte('sale_date', endDate);

  // salesからペイキャス売上を日ごとに集計
  const { data: salesMonth } = await sb.from('sales')
    .select('sale_date, amount, pay_method')
    .eq('pay_method', 'ペイキャス')
    .gte('sale_date', startDate).lte('sale_date', endDate);

  // 日ごとのペイキャス売上合計
  const salesByDate = {};
  (salesMonth || []).forEach(s => {
    salesByDate[s.sale_date] = (salesByDate[s.sale_date] || 0) + s.amount;
  });

  // paycas_dailyのデータをマップ
  const dailyMap = {};
  (paycasDaily || []).forEach(d => { dailyMap[d.sale_date] = d; });

  // 全日付を結合
  const allDates = [...new Set([
    ...Object.keys(salesByDate),
    ...Object.keys(dailyMap)
  ])].sort().reverse(); // 新しい順

  if (allDates.length === 0) {
    document.getElementById('paycas-monthly').innerHTML =
      '<div style="color:#8a7050;font-size:14px;text-align:center;padding:16px;">この月のデータはありません</div>';
    return;
  }

  let listHtml = '';
  allDates.forEach(date => {
    const dbTotal = salesByDate[date] || 0;
    const d = dailyMap[date];
    const icqrTotal = d ? (d.ic_amount || 0) + (d.qr_amount || 0) : null;
    const diff = icqrTotal !== null ? icqrTotal - dbTotal : null;
    const hasDiff = diff !== null && diff !== 0;
    const dateDisp = date.substring(5).replace('-', '/'); // MM/DD

    listHtml += `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #3d2c1444;">
      <span style="color:${hasDiff ? '#c95a5a' : '#8a7050'};font-size:15px;min-width:50px;">${dateDisp}</span>
      <span style="color:#a0e0a0;font-size:14px;min-width:80px;text-align:right;">¥${dbTotal.toLocaleString()}</span>
      <span style="color:#8a7050;font-size:14px;min-width:80px;text-align:right;">${icqrTotal !== null ? '¥' + icqrTotal.toLocaleString() : '---'}</span>
      <span style="font-size:15px;font-weight:700;min-width:80px;text-align:right;color:${diff === null ? '#8a7050' : hasDiff ? '#c95a5a' : '#4aaa5a'};">
        ${diff === null ? '---' : diff === 0 ? '✅' : (diff > 0 ? '+' : '') + '¥' + diff.toLocaleString()}
      </span>
    </div>`;
  });

  document.getElementById('paycas-monthly').innerHTML = `
    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #3d2c14;margin-bottom:4px;">
      <span style="color:#8a7050;font-size:12px;min-width:50px;">日付</span>
      <span style="color:#8a7050;font-size:12px;min-width:80px;text-align:right;">DB合計</span>
      <span style="color:#8a7050;font-size:12px;min-width:80px;text-align:right;">IC+QR</span>
      <span style="color:#8a7050;font-size:12px;min-width:80px;text-align:right;">差額</span>
    </div>
    ${listHtml}
    <button onclick="printPaycasMonthly()" style="width:100%;margin-top:14px;padding:14px;background:#1a2a4a;border:2px solid #4a8aca;border-radius:10px;color:#8ac8ff;font-size:16px;font-weight:900;cursor:pointer;">
      📄 PDF印刷
    </button>`;
}

async function printPaycasMonthly() {
  const dateVal = document.getElementById('dateInput').value;
  const ym = dateVal ? dateVal.substring(0, 7) : new Date().toISOString().substring(0, 7);
  const [year, month] = ym.split('-');
  const startDate = `${year}-${month}-01`;
  const lastDay = new Date(Number(year), Number(month), 0).getDate();
  const endDate = `${year}-${month}-${String(lastDay).padStart(2,'0')}`;

  const { data: paycasDaily } = await sb.from('paycas_daily')
    .select('*').gte('sale_date', startDate).lte('sale_date', endDate);
  const { data: salesMonth } = await sb.from('sales')
    .select('sale_date, amount, pay_method')
    .eq('pay_method', 'ペイキャス')
    .gte('sale_date', startDate).lte('sale_date', endDate);

  const salesByDate = {};
  (salesMonth || []).forEach(s => {
    salesByDate[s.sale_date] = (salesByDate[s.sale_date] || 0) + s.amount;
  });
  const dailyMap = {};
  (paycasDaily || []).forEach(d => { dailyMap[d.sale_date] = d; });

  const allDates = [...new Set([...Object.keys(salesByDate), ...Object.keys(dailyMap)])].sort();

  let rows = '';
  allDates.forEach(date => {
    const dbTotal = salesByDate[date] || 0;
    const d = dailyMap[date];
    const icqrTotal = d ? (d.ic_amount || 0) + (d.qr_amount || 0) : null;
    const diff = icqrTotal !== null ? icqrTotal - dbTotal : null;
    const hasDiff = diff !== null && diff !== 0;
    rows += `<tr style="${hasDiff ? 'color:#cc3333;' : ''}">
      <td>${date.substring(5).replace('-', '/')}</td>
      <td style="text-align:right">¥${dbTotal.toLocaleString()}</td>
      <td style="text-align:right">${icqrTotal !== null ? '¥' + icqrTotal.toLocaleString() : '---'}</td>
      <td style="text-align:right">${diff === null ? '---' : diff === 0 ? '✅' : (diff > 0 ? '+' : '') + '¥' + diff.toLocaleString()}</td>
    </tr>`;
  });

  const html = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><style>
    body{font-family:'Hiragino Mincho ProN',serif;padding:16px;color:#000;}
    h2{text-align:center;margin-bottom:12px;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th,td{border:1px solid #ccc;padding:6px 8px;}
    th{background:#f5f5f5;text-align:center;}
    td:not(:first-child){text-align:right;}
    .diff{color:#cc3333;font-weight:700;}
  </style></head><body>
    <h2>ペイキャス差額一覧　${year}年${month}月</h2>
    <table>
      <tr><th>日付</th><th>DB合計</th><th>IC+QR</th><th>差額</th></tr>
      ${rows}
    </table>
  </body></html>`;

  const w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
  w.print();
}

function calcDiff() {
  const actual = parseInt(document.getElementById('actualPaycas').value) || 0;
  const paycasSales = salesData.filter(s => s.pay_method === 'ペイキャス');
  const systemTotal = paycasSales.reduce((a, s) => a + s.amount, 0);
  const diff = actual - systemTotal;

  const diffRow = document.getElementById('diffRow');
  const diffVal = document.getElementById('diffVal');
  const btn = document.getElementById('btnAdjust');

  if (!document.getElementById('actualPaycas').value) {
    diffRow.style.display = 'none';
    btn.disabled = true;
    return;
  }

  diffRow.style.display = '';
  if (diff === 0) {
    diffVal.innerHTML = '<span style="color:#4aaa5a">¥0（一致）</span>';
    btn.disabled = true;
  } else if (diff > 0) {
    diffVal.innerHTML = `<span class="adj-diff-pos">+¥${diff.toLocaleString()}（ペイキャス不足）</span>`;
    btn.disabled = false;
  } else {
    diffVal.innerHTML = `<span class="adj-diff-neg">-¥${Math.abs(diff).toLocaleString()}（ペイキャス超過）</span>`;
    btn.disabled = false;
  }
}

async function doAdjust() {
  const actual = parseInt(document.getElementById('actualPaycas').value) || 0;
  const paycasSales = salesData.filter(s => s.pay_method === 'ペイキャス');
  const systemTotal = paycasSales.reduce((a, s) => a + s.amount, 0);
  const diff = actual - systemTotal;

  if (diff === 0) return;

  // 一番金額の大きいペイキャスレコードを調整
  const targetPay = [...paycasSales].sort((a, b) => b.amount - a.amount)[0];
  // 一番金額の大きい現金レコードを調整
  const cashSales = salesData.filter(s => s.pay_method === '現金');
  const targetCash = [...cashSales].sort((a, b) => b.amount - a.amount)[0];

  if (!targetPay || !targetCash) {
    document.getElementById('adjustMsg').textContent = 'エラー：調整対象が見つかりません';
    return;
  }

  document.getElementById('btnAdjust').disabled = true;
  document.getElementById('adjustMsg').textContent = '処理中...';

  // ペイキャスにdiff加算
  await sb.from("sales").update({ amount: targetPay.amount + diff }).eq("id", targetPay.id);
  // 現金からdiff減算
  await sb.from("sales").update({ amount: targetCash.amount - diff }).eq("id", targetCash.id);

  document.getElementById('adjustMsg').textContent = `✅ 調整完了！ペイキャス¥${actual.toLocaleString()}に修正しました`;

  // 再読込
  await loadAll();
}

function renderVisit() {
  if (salesData.length === 0) {
    document.getElementById('content-visit').innerHTML = '<div class="empty">データなし</div>';
    return;
  }

  // テーブル×時間でグループ化（同じテーブルでも時間が違えば別客）
  // salesを来店順に並べる
  const sorted = [...salesData].sort((a, b) => (a.sale_time || '').localeCompare(b.sale_time || ''));

  let html = `
  <div style="margin-bottom:12px">
    <button onclick="printVisitPDF()" style="width:100%;padding:14px;background:#c9952a;border:none;border-radius:10px;color:#0d0905;font-size:16px;font-weight:900;cursor:pointer;">🖨 A4印刷（PDF）</button>
  </div>
  <div style="color:#8a7050;font-size:12px;margin-bottom:10px">${sorted.length}組 来店</div>`;

  sorted.forEach(sale => {
    // そのテーブルの注文をsale_timeで紐付け（同じ退店時間のもの）
    const items = orderItemsData.filter(o =>
      String(o.table_no) === String(sale.table_no) && o.sale_time === sale.sale_time
    );

    const payColor = sale.pay_method === 'ペイキャス' ? '#5a8aca' : '#4aaa5a';

    html += `
    <div class="visit-card">
      <div class="visit-header">
        <div>
          <div class="vtable">テーブル ${sale.table_no}</div>
          <div class="vinfo">退店 ${sale.sale_time || '-'}　${sale.people_count || '-'}名</div>
        </div>
        <div class="vtotal">
          <div class="vtotal-amount">¥${sale.amount.toLocaleString()}</div>
          <div class="vtotal-pay" style="color:${payColor}">${sale.pay_method || '-'}</div>
        </div>
      </div>`;

    if (items.length > 0) {
      html += `<div class="visit-body">`;
      items.forEach(o => {
        const subtotal = o.price * o.qty;
        const isDiscount = o.price < 0;
        html += `
        <div class="order-row">
          <span class="order-name">${o.item_name}</span>
          <span class="order-qty">×${o.qty}</span>
          <span class="order-price ${isDiscount ? 'discount' : ''}">
            ${isDiscount ? '-' : ''}¥${Math.abs(subtotal).toLocaleString()}
          </span>
        </div>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="visit-body"><div style="color:#3d2c14;font-size:12px">注文明細なし</div></div>`;
    }

    html += `</div>`;
  });

  document.getElementById('content-visit').innerHTML = html;
}


function printVisitPDF() {
  const sorted = [...salesData].sort((a, b) => (a.sale_time || '').localeCompare(b.sale_time || ''));
  
  const rows = sorted.map((sale, i) => {
    const items = orderItemsData.filter(o =>
      String(o.table_no) === String(sale.table_no) && o.sale_time === sale.sale_time
    );
    const itemStr = items.map(o => {
      const isDiscount = o.price < 0;
      return `${o.item_name}×${o.qty}${isDiscount ? '(-¥'+Math.abs(o.price*o.qty).toLocaleString()+')' : '(¥'+(o.price*o.qty).toLocaleString()+')'}`;
    }).join('　');

    const payMark = sale.pay_method === 'ペイキャス' ? '💳' : '💴';
    return `<tr>
      <td>${i+1}</td>
      <td>${sale.sale_time || '-'}</td>
      <td>T${sale.table_no}</td>
      <td style="text-align:center">${sale.people_count || '-'}</td>
      <td>${itemStr || '-'}</td>
      <td style="text-align:right">¥${sale.amount.toLocaleString()}</td>
      <td style="text-align:center">${payMark}</td>

<style>

  td { padding: 2px 3px; border-bottom: 1px solid #ddd; font-size: 8px; vertical-align: middle; word-break: break-all; }

</style></head><body>
<h2>Lounge Cattleya　来店者一覧</h2>
<div class="sub">${today}　${sorted.length}組</div>
<div class="summary">
  <div>総売上：<span>¥${grandTotal.toLocaleString()}</span></div>
  <div>現金：<span>¥${cashTotal.toLocaleString()}</span></div>
  <div>ペイキャス：<span>¥${payTotal.toLocaleString()}</span></div>
</div>
<table>
  <colgroup>
    <col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"><col class="c6"><col class="c7">
  </colgroup>
  <thead><tr>

function renderSummary() {
  const cashSales = salesData.filter(s => s.pay_method === '現金');
  const paycasSales = salesData.filter(s => s.pay_method === 'ペイキャス');
  const cashTotal = cashSales.reduce((a, s) => a + s.amount, 0);
  const paycasTotal = paycasSales.reduce((a, s) => a + s.amount, 0);
  const grandTotal = salesData.reduce((a, s) => a + s.amount, 0);
  const totalCount = salesData.length;
  const totalPeople = salesData.reduce((a, s) => a + (s.people_count || 0), 0);
  const cashCount = cashSales.length;
  const paycasCount = paycasSales.length;
  const cashMorning = cashSales.filter(s => (s.sale_time || '') < '15:00').reduce((a, s) => a + s.amount, 0);
  const cashEvening = cashSales.filter(s => (s.sale_time || '') >= '15:00').reduce((a, s) => a + s.amount, 0);

  // 時間帯別
  const groups = {};
  salesData.forEach(s => {
    const h = (s.sale_time || '').split(':')[0] || '不明';
    if (!groups[h]) groups[h] = { count: 0, amount: 0 };
    groups[h].count++;
    groups[h].amount += s.amount;
  });

  const now = new Date();
  const timeStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日　'
    + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

  let html = '';

  // 印刷ボタン
  html += `
  <div style="margin-bottom:14px">
    <button onclick="printSummary()" style="width:100%;padding:16px;background:#c9952a;border:none;border-radius:12px;color:#0d0905;font-size:18px;font-weight:900;cursor:pointer;">
      🖨 レシート印刷（PassPRNT）
    </button>
  </div>`;

  // サマリー
  html += `
  <div class="summary-card">
    <div class="label">集計時刻：${timeStr}</div>
    <div class="amount" style="margin-top:8px">¥${grandTotal.toLocaleString()}</div>
    <div style="margin-top:12px">
      <div class="summary-row"><span class="slabel">現金（${cashCount}件）</span><span class="sval">¥${cashTotal.toLocaleString()}</span></div>
      <div class="summary-row" style="padding-left:12px"><span class="slabel">　朝〜15時</span><span class="sval">¥${cashMorning.toLocaleString()}</span></div>
      <div class="summary-row" style="padding-left:12px"><span class="slabel">　15時〜閉店</span><span class="sval">¥${cashEvening.toLocaleString()}</span></div>
      <div class="summary-row"><span class="slabel">ペイキャス（${paycasCount}件）</span><span class="sval">¥${paycasTotal.toLocaleString()}</span></div>
      <div class="summary-row"><span class="slabel">来客組数</span><span class="sval">${totalCount}組</span></div>
      <div class="summary-row"><span class="slabel">来客人数</span><span class="sval">${totalPeople}名</span></div>
    </div>
  </div>`;

  // 時間帯別
  html += `<div class="summary-card"><div class="label" style="margin-bottom:10px">時間帯別売上</div>`;
  Object.entries(groups).sort().forEach(([h, g]) => {
    html += `<div class="summary-row">
      <span class="slabel">${h}:00〜${Number(h)+1}:00</span>
      <span style="color:#8a7050;font-size:12px">${g.count}件</span>
      <span class="sval">¥${g.amount.toLocaleString()}</span>
    </div>`;
  });
  html += '</div>';

  document.getElementById('content-summary').innerHTML = html;
}
