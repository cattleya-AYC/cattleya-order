<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0905;
    color: #f0e6d0;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    min-height: 100vh;
  }
  .header {
    background: #181008;
    border-bottom: 1px solid #3d2c14;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-title { font-size: 18px; color: #c9952a; font-weight: 700; }
  .header-time { font-size: 12px; color: #8a7050; }

  .content { padding: 14px 12px; }

  .summary-card {
    background: #181008;
    border: 1px solid #3d2c14;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 13px;
    color: #8a7050;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .total-amount {
    font-size: 64px;
    font-weight: 900;
    color: #c9952a;
    font-family: serif;
    margin-bottom: 14px;
    line-height: 1;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #3d2c1433;
    font-size: 26px;
  }
  .row:last-child { border-bottom: none; }
  .row .rl { color: #8a7050; }
  .row .rv { color: #f0e6d0; font-weight: 700; font-family: serif; }
  .row .rv.gold { color: #c9952a; }

  .hour-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid #3d2c1433;
    font-size: 26px;
  }
  .hour-row:last-child { border-bottom: none; }
  .hour-row .hl { color: #8a7050; }
  .hour-row .hc { color: #8a7050; font-size: 22px; }
  .hour-row .hr { color: #c9952a; font-weight: 700; }

  /* ペイキャスIC/QR確認カード */
  .paycas-check-card {
    background: #0d1a0d;
    border: 2px solid #2a5a2a;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .paycas-check-title {
    font-size: 15px;
    color: #5aaa5a;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .paycas-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #2a5a2a44;
  }
  .paycas-row:last-child { border-bottom: none; }
  .paycas-row label { color: #5aaa5a; font-size: 18px; }
  .paycas-row input {
    background: #0a120a;
    border: 1px solid #2a5a2a;
    border-radius: 8px;
    color: #a0e0a0;
    font-size: 22px;
    font-weight: 700;
    font-family: serif;
    padding: 8px 12px;
    width: 170px;
    text-align: right;
  }
  .paycas-diff {
    margin-top: 12px;
    padding: 10px;
    border-radius: 8px;
    font-size: 20px;
    font-weight: 700;
    text-align: center;
  }
  .paycas-diff.ok { background: #0d2a0d; color: #5aaa5a; border: 1px solid #2a5a2a; }
  .paycas-diff.ng { background: #2a0d0d; color: #e05a5a; border: 1px solid #5a2a2a; }
  .paycas-diff.neutral { background: #1a1a1a; color: #8a7050; border: 1px solid #3d2c14; }

  /* 不具合報告 */
  .btn-bug {
    display: block;
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    background: #2a1a0d;
    border: 1px solid #8a4a1a;
    border-radius: 12px;
    color: #c97a3a;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .bug-panel {
    display: none;
    background: #1a1008;
    border: 1px solid #8a4a1a;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .bug-panel textarea {
    width: 100%;
    min-height: 120px;
    background: #0d0905;
    border: 1px solid #3d2c14;
    border-radius: 8px;
    color: #f0e6d0;
    font-size: 16px;
    padding: 10px;
    margin-bottom: 10px;
    resize: vertical;
  }
  .btn-bug-send {
    width: 100%;
    padding: 12px;
    background: #8a4a1a;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-email {
    display: block;
    width: 100%;
    padding: 16px;
    margin-bottom: 10px;
    background: #1a2a4a;
    border: 2px solid #4a8aca;
    border-radius: 12px;
    color: #8ac8ff;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
  }
  .btn-print {
    width: 100%;
    padding: 18px 10px;
    background: #c9952a;
    border: none;
    border-radius: 12px;
    color: #0d0905;
    font-size: clamp(18px, 6vw, 28px);
    font-weight: 900;
    cursor: pointer;
    margin-bottom: 10px;
    white-space: nowrap;
    overflow: hidden;
  }
  @keyframes blink-reload {

function adjustPaycas(diff) {
  const absDiff = Math.abs(diff);
  const msg = diff > 0
    ? `機械集計がDBより¥${absDiff.toLocaleString()}多いです。\n現金を¥${absDiff.toLocaleString()}減らし、ペイキャスを¥${absDiff.toLocaleString()}増やします。\nよろしいですか？`
    : `DBのペイキャスが機械集計より¥${absDiff.toLocaleString()}多いです。\n現金を¥${absDiff.toLocaleString()}増やし、ペイキャスを¥${absDiff.toLocaleString()}減らします。\nよろしいですか？`;
  if (!confirm(msg)) return;
  const today = new Date().toLocaleDateString('sv-SE', {timeZone:'Asia/Tokyo'});
  const now = new Date().toLocaleTimeString('sv-SE', {timeZone:'Asia/Tokyo'}).substring(0,5);
  Promise.all([
    sb.from('sales').insert({ table_no: '調整', amount: diff > 0 ? absDiff : -absDiff, pay_method: 'ペイキャス', sale_date: today, sale_time: now, people_count: 0 }),
    sb.from('sales').insert({ table_no: '調整', amount: diff > 0 ? -absDiff : absDiff, pay_method: '現金', sale_date: today, sale_time: now, people_count: 0 })
  ]).then(() => {
    alert('✅ 調整完了しました！');
    loadData();
  });
}
