<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cattleya 集計</title>
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/cattleya-AYC/cattleya-order/main/public/shukei.PNG">
<link rel="icon" href="https://raw.githubusercontent.com/cattleya-AYC/cattleya-order/main/public/shukei.PNG">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0905;
    color: #f0e6d0;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    min-height: 100vh;
  }
  .header {
    background: #181008;
    border-bottom: 1px solid #3d2c14;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-title { font-size: 18px; color: #c9952a; font-weight: 700; }
  .header-time { font-size: 12px; color: #8a7050; }

  .content { padding: 14px 12px; }

  .summary-card {
    background: #181008;
    border: 1px solid #3d2c14;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 13px;
    color: #8a7050;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .total-amount {
    font-size: 48px;
    font-weight: 900;
    color: #c9952a;
    font-family: serif;
    margin-bottom: 14px;
    line-height: 1;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #3d2c1433;
    font-size: 15px;
  }
  .row:last-child { border-bottom: none; }
  .row .rl { color: #8a7050; }
  .row .rv { color: #f0e6d0; font-weight: 700; font-family: serif; }
  .row .rv.gold { color: #c9952a; }

  .hour-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid #3d2c1433;
    font-size: 14px;
  }
  .hour-row:last-child { border-bottom: none; }
  .hour-row .hl { color: #8a7050; }
  .hour-row .hc { color: #8a7050; font-size: 12px; }
  .hour-row .hr { color: #c9952a; font-weight: 700; }

  .btn-print {
    width: 100%;
    padding: 20px;
    background: #c9952a;
    border: none;
    border-radius: 12px;
    color: #0d0905;
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .btn-reload {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid #3d2c14;
    border-radius: 10px;
    color: #8a7050;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 20px;
  }
  .loading { text-align: center; color: #8a7050; padding: 60px; font-size: 16px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">🌸 Cattleya 集計</div>
  <div class="header-time" id="currentTime"></div>
</div>

<div class="content" id="mainContent">
  <div class="loading">読み込み中...</div>
</div>

<script>
const SUPABASE_URL = "https://zxdgiszrsmumjjxmvszb.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4ZGdpc3pyc211bWpqeG12c3piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2ODM2MTksImV4cCI6MjA5NTI1OTYxOX0.vNndS7JEzIUsa007EPO2zRoYhUr-z01LM32BKIhMSz4";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let salesData = [];

function updateTime() {
  const now = new Date();
  const t = now.getFullYear() + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + String(now.getDate()).padStart(2,'0')
    + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  document.getElementById('currentTime').textContent = t;
}
updateTime();
setInterval(updateTime, 10000);

async function loadData() {
  document.getElementById('mainContent').innerHTML = '<div class="loading">読み込み中...</div>';
  const today = new Date().toLocaleString("sv-SE", { timeZone: "Asia/Tokyo" }).split(" ")[0];
  const { data } = await sb.from("sales").select("*").eq("sale_date", today).order("sale_time", { ascending: true });
  salesData = data || [];
  render();
}

function render() {
  const cashSales = salesData.filter(s => s.pay_method === '現金');
  const paycasSales = salesData.filter(s => s.pay_method === 'ペイキャス');
  const cashTotal = cashSales.reduce((a, s) => a + s.amount, 0);
  const paycasTotal = paycasSales.reduce((a, s) => a + s.amount, 0);
  const grandTotal = salesData.reduce((a, s) => a + s.amount, 0);
  const totalCount = salesData.length;
  const totalPeople = salesData.reduce((a, s) => a + (s.people_count || 0), 0);
  const cashMorning = cashSales.filter(s => (s.sale_time || '') < '15:00').reduce((a, s) => a + s.amount, 0);
  const cashEvening = cashSales.filter(s => (s.sale_time || '') >= '15:00').reduce((a, s) => a + s.amount, 0);

  // 時間帯別
  const groups = {};
  salesData.forEach(s => {
    const h = (s.sale_time || '').split(':')[0] || '不明';
    if (!groups[h]) groups[h] = { count: 0, amount: 0 };
    groups[h].count++;
    groups[h].amount += s.amount;
  });

  const now = new Date();
  const timeStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日　'
    + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ' 現在';

  let html = '';

  // 印刷・更新ボタン
  html += `
  <button class="btn-print" onclick="printSummary()">🖨 レシート印刷</button>
  <button class="btn-reload" onclick="loadData()">🔄 最新データに更新</button>`;

  // メイン集計
  html += `
  <div class="summary-card">
    <div class="card-title">${timeStr}</div>
    <div class="total-amount">¥${grandTotal.toLocaleString()}</div>
    <div class="row"><span class="rl">現金合計</span><span class="rv gold">¥${cashTotal.toLocaleString()}</span></div>
    <div class="row" style="padding-left:12px"><span class="rl">　朝〜15時</span><span class="rv">¥${cashMorning.toLocaleString()}</span></div>
    <div class="row" style="padding-left:12px"><span class="rl">　15時〜閉店</span><span class="rv">¥${cashEvening.toLocaleString()}</span></div>
    <div class="row"><span class="rl">ペイキャス合計</span><span class="rv gold">¥${paycasTotal.toLocaleString()}</span></div>
    <div class="row"><span class="rl">来客組数</span><span class="rv">${totalCount}組</span></div>
    <div class="row"><span class="rl">来客人数</span><span class="rv">${totalPeople}名</span></div>
  </div>`;

  // 時間帯別
  html += `
  <div class="summary-card">
    <div class="card-title">時間帯別売上</div>`;
  if (Object.keys(groups).length === 0) {
    html += '<div style="color:#3d2c14;text-align:center;padding:20px">データなし</div>';
  } else {
    Object.entries(groups).sort().forEach(([h, g]) => {
      html += `
      <div class="hour-row">
        <span class="hl">${h}:00〜${Number(h)+1}:00</span>
        <span class="hc">${g.count}件</span>
        <span class="hr">¥${g.amount.toLocaleString()}</span>
      </div>`;
    });
  }
  html += '</div>';

  document.getElementById('mainContent').innerHTML = html;
}

function printSummary() {
  const cashSales = salesData.filter(s => s.pay_method === '現金');
  const paycasSales = salesData.filter(s => s.pay_method === 'ペイキャス');
  const cashTotal = cashSales.reduce((a, s) => a + s.amount, 0);
  const paycasTotal = paycasSales.reduce((a, s) => a + s.amount, 0);
  const grandTotal = salesData.reduce((a, s) => a + s.amount, 0);
  const totalCount = salesData.length;
  const totalPeople = salesData.reduce((a, s) => a + (s.people_count || 0), 0);
  const cashMorning = cashSales.filter(s => (s.sale_time || '') < '15:00').reduce((a, s) => a + s.amount, 0);
  const cashEvening = cashSales.filter(s => (s.sale_time || '') >= '15:00').reduce((a, s) => a + s.amount, 0);

  const groups = {};
  salesData.forEach(s => {
    const h = (s.sale_time || '').split(':')[0] || '不明';
    if (!groups[h]) groups[h] = { count: 0, amount: 0 };
    groups[h].count++;
    groups[h].amount += s.amount;
  });

  const now = new Date();
  const timeStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 '
    + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

  const hourRows = Object.entries(groups).sort().map(([h, g]) =>
    `<tr><td>${h}:00〜${Number(h)+1}:00</td><td style="text-align:right">${g.count}件</td><td style="text-align:right">¥${g.amount.toLocaleString()}</td></tr>`
  ).join('');

  const html = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><style>
    body{font-family:'Hiragino Mincho ProN',serif;width:384px;margin:0;padding:4px 6px;color:#000;}
    .title{text-align:center;font-size:26px;font-weight:900;margin:4px 0 2px;}
    .sub{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px;}
    .time{text-align:right;font-size:20px;margin-bottom:6px;}
    .hr{border:none;border-top:1px solid #000;margin:6px 0;}
    table{width:100%;border-collapse:collapse;}
    td{padding:5px 2px;font-size:24px;font-weight:700;}
    td.r{text-align:right;}
    .grand{font-size:32px;font-weight:900;}
    .sub-row td{font-size:20px;padding-left:16px;}
  </style></head><body>
    <div class="title">ラウンジ カトレア</div>
    <div class="sub">途中集計</div>
    <div class="time">${timeStr}</div>
    <hr class="hr"/>
    <table>${hourRows}</table>
    <hr class="hr"/>
    <table>
      <tr><td class="grand">総売上</td><td class="r grand">¥${grandTotal.toLocaleString()}</td></tr>
      <tr><td>現金合計</td><td class="r">¥${cashTotal.toLocaleString()}</td></tr>
      <tr class="sub-row"><td>朝〜15時</td><td class="r">¥${cashMorning.toLocaleString()}</td></tr>
      <tr class="sub-row"><td>15時〜閉店</td><td class="r">¥${cashEvening.toLocaleString()}</td></tr>
      <tr><td>ペイキャス</td><td class="r">¥${paycasTotal.toLocaleString()}</td></tr>
      <tr><td>来客組数</td><td class="r">${totalCount}組</td></tr>
      <tr><td>来客人数</td><td class="r">${totalPeople}名</td></tr>
    </table>
    <hr class="hr"/>
    <div style="text-align:center;font-size:22px;font-weight:700;">ありがとうございました</div>
  </body></html>`;

  const url = 'starpassprnt://v1/print/nopreview?back=' + encodeURIComponent(location.href) + '&html=' + encodeURIComponent(html);
  window.location.href = url;
}

loadData();
</script>
</body>
</html>
