<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cattleya 集計</title>
<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAYAAAA9zQYyAAAABGdBTUEAALGPC/xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAACXBIWXMAABs4AAAa+AF5uO1hAAAAHGlET1QAAAACAAAAAAAAAFoAAAAoAAAAWgAAAFoAAJl2zwxtHQAAQABJREFU">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0905;
    color: #f0e6d0;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    min-height: 100vh;
  }
  .header {
    background: #181008;
    border-bottom: 1px solid #3d2c14;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-title { font-size: 18px; color: #c9952a; font-weight: 700; }
  .header-time { font-size: 12px; color: #8a7050; }
  .content { padding: 14px 12px; }

  /* ── 集計カード ── */
  .summary-card {
    background: #181008;
    border: 1px solid #3d2c14;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 13px;
    color: #8a7050;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }

  /* 主要項目：2行レイアウト（ラベル行＋金額行） */
  .big-item {
    padding: 10px 0;
    border-bottom: 1px solid #3d2c1433;
  }
  .big-item:last-child { border-bottom: none; }
  .big-label {
    font-size: 22px;
    color: #8a7050;
    margin-bottom: 4px;
  }
  .big-value {
    font-size: 40px;
    font-weight: 900;
    color: #c9952a;
    font-family: serif;
    line-height: 1.1;
  }
  .big-value.white { color: #f0e6d0; }

  /* 小項目（15時まで等） */
  .sub-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0 7px 16px;
    border-bottom: 1px solid #3d2c1422;
  }
  .sub-item:last-child { border-bottom: none; }
  .sub-label { font-size: 20px; color: #6a5a3a; }
  .sub-value { font-size: 26px; font-weight: 700; color: #c0a060; font-family: serif; }

  /* 来客 */
  .count-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #3d2c1433;
    font-size: 26px;
  }
  .count-row:last-child { border-bottom: none; }
  .count-row .cl { color: #8a7050; }
  .count-row .cv { color: #f0e6d0; font-weight: 700; font-family: serif; }

  /* 時間帯別 */
  .hour-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid #3d2c1433;
    font-size: 22px;
  }
  .hour-row:last-child { border-bottom: none; }
  .hour-row .hl { color: #8a7050; }
  .hour-row .hc { color: #8a7050; font-size: 18px; }
  .hour-row .hr { color: #c9952a; font-weight: 700; font-family: serif; }

  /* ── ペイキャスIC/QR確認カード ── */
  .paycas-card {
    background: #0d1a0d;
    border: 2px solid #2a5a2a;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .paycas-card-title {
    font-size: 15px;
    color: #5aaa5a;
    margin-bottom: 14px;
    letter-spacing: 2px;
  }

  /* IC/QR入力行：2行レイアウト */
  .pc-input-block {
    padding: 10px 0;
    border-bottom: 1px solid #2a5a2a44;
  }
  .pc-input-block:last-of-type { border-bottom: none; }
  .pc-label {
    font-size: 20px;
    color: #5aaa5a;
    margin-bottom: 6px;
  }
  .pc-input {
    background: #0a120a;
    border: 1px solid #2a5a2a;
    border-radius: 8px;
    color: #a0e0a0;
    font-size: 34px;
    font-weight: 700;
    font-family: serif;
    padding: 8px 12px;
    width: 100%;
    text-align: right;
  }

  .pc-diff {
    margin-top: 12px;
    padding: 12px;
    border-radius: 8px;
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    line-height: 1.5;
  }
  .pc-diff.ok      { background: #0d2a0d; color: #5aaa5a; border: 1px solid #2a5a2a; }
  .pc-diff.ng      { background: #2a0d0d; color: #e05a5a; border: 1px solid #5a2a2a; }
  .pc-diff.neutral { background: #1a1a1a; color: #8a7050; border: 1px solid #3d2c14; }

  .btn-pc-save {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    background: #1a4a1a;
    border: 2px solid #2a8a2a;
    border-radius: 10px;
    color: #5aaa5a;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
  }
  .btn-pc-save:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .pc-saved-label {
    text-align: center;
    font-size: 16px;
    color: #5aaa5a;
    margin-top: 8px;
    min-height: 22px;
  }

  /* ── ボタン群 ── */
  .btn-print {
    width: 100%;
    padding: 18px 10px;
    background: #c9952a;
    border: none;
    border-radius: 12px;
    color: #0d0905;
    font-size: clamp(18px, 6vw, 26px);
    font-weight: 900;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .btn-reload {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid #3d2c14;
    border-radius: 10px;
    color: #8a7050;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .btn-email {
    display: block;
    width: 100%;
    padding: 16px;
    margin-bottom: 10px;
    background: #1a2a4a;
    border: 2px solid #4a8aca;
    border-radius: 12px;
    color: #8ac8ff;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
    text-align: center;
  }
  .btn-bug {
    display: block;
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    background: #2a1a0d;
    border: 1px solid #8a4a1a;
    border-radius: 12px;
    color: #c97a3a;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .bug-panel {
    display: none;
    background: #1a1008;
    border: 1px solid #8a4a1a;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .bug-panel textarea {
    width: 100%;
    min-height: 120px;
    background: #0d0905;
    border: 1px solid #3d2c14;
    border-radius: 8px;
    color: #f0e6d0;
    font-size: 16px;
    padding: 10px;
    margin-bottom: 10px;
    resize: vertical;
  }
  .btn-bug-send {
    width: 100%;
    padding: 12px;
    background: #8a4a1a;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .loading { text-align: center; color: #8a7050; padding: 60px; font-size: 16px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">🌸 Cattleya 集計</div>
  <div class="header-time" id="currentTime"></div>
</div>

<div class="content" id="mainContent">
  <div class="loading">読み込み中...</div>
</div>

<script>
const SUPABASE_URL = "https://zxdgiszrsmumjjxmvszb.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4ZGdpc3pyc211bWpqeG12c3piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2ODM2MTksImV4cCI6MjA5NTI1OTYxOX0.vNndS7JEzIUsa007EPO2zRoYhUr-z01LM32BKIhMSz4";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let salesData = [];
let savedIC = 0;
let savedQR = 0;

// ── 時刻表示 ──
function updateTime() {
  const now = new Date();
  document.getElementById('currentTime').textContent =
    now.getFullYear() + '/' +
    String(now.getMonth()+1).padStart(2,'0') + '/' +
    String(now.getDate()).padStart(2,'0') + ' ' +
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0');
}
updateTime();
setInterval(updateTime, 10000);

// ── 今日の日付(JST) ──
function todayJST() {
  return new Date().toLocaleString("sv-SE", { timeZone: "Asia/Tokyo" }).split(" ")[0];
}

// ── データ読み込み ──
async function loadData() {
  document.getElementById('mainContent').innerHTML = '<div class="loading">読み込み中...</div>';
  const today = todayJST();

  const [{ data: sales }, { data: pcData }] = await Promise.all([
    sb.from("sales").select("*").eq("sale_date", today).order("sale_time", { ascending: true }),
    sb.from("paycas_daily").select("*").eq("sale_date", today).single()
  ]);

  salesData = sales || [];
  savedIC  = pcData?.ic_amount  || 0;
  savedQR  = pcData?.qr_amount  || 0;
  render();
}

// ── 画面描画 ──
function render() {
  const cashSales   = salesData.filter(s => s.pay_method === '現金');
  const paycasSales = salesData.filter(s => s.pay_method === 'ペイキャス');
  const cashTotal   = cashSales.reduce((a, s) => a + s.amount, 0);
  const paycasTotal = paycasSales.reduce((a, s) => a + s.amount, 0);
  const grandTotal  = salesData.reduce((a, s) => a + s.amount, 0);
  const totalCount  = salesData.length;
  const totalPeople = salesData.reduce((a, s) => a + (s.people_count || 0), 0);
  const cashMorning = cashSales.filter(s => (s.sale_time || '') < '15:00').reduce((a, s) => a + s.amount, 0);
  const cashEvening = cashTotal - cashMorning;

  // 時間帯別
  const groups = {};
  salesData.forEach(s => {
    const h = (s.sale_time || '').split(':')[0] || '不明';
    if (!groups[h]) groups[h] = { count: 0, amount: 0 };
    groups[h].count++;
    groups[h].amount += s.amount;
  });

  const now = new Date();
  const timeStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日　'
    + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ' 現在';

  // IC/QR差額チェック
  const icqrTotal = savedIC + savedQR;
  let diffHtml = '';
  if (savedIC === 0 && savedQR === 0) {
    diffHtml = `<div class="pc-diff neutral">ペイキャスデータ合計 ¥${paycasTotal.toLocaleString()}<br>IC・QRを入力して登録してください</div>`;
  } else {
    const diff = icqrTotal - paycasTotal;
    if (diff === 0) {
      diffHtml = `<div class="pc-diff ok">✅ 一致！　IC+QR ¥${icqrTotal.toLocaleString()} ＝ データ ¥${paycasTotal.toLocaleString()}</div>`;
    } else {
      const sign = diff > 0 ? '+' : '';
      diffHtml = `<div class="pc-diff ng">⚠️ 差額 ${sign}¥${diff.toLocaleString()}<br>IC+QR ¥${icqrTotal.toLocaleString()} ／ データ ¥${paycasTotal.toLocaleString()}</div>`;
    }
  }

  const savedLabel = (savedIC > 0 || savedQR > 0)
    ? `✅ 登録済み：IC ¥${savedIC.toLocaleString()} ／ QR ¥${savedQR.toLocaleString()}`
    : '';

  // 時間帯別HTML
  let hourHtml = '';
  if (Object.keys(groups).length === 0) {
    hourHtml = '<div style="color:#3d2c14;text-align:center;padding:20px">データなし</div>';
  } else {
    Object.entries(groups).sort().forEach(([h, g]) => {
      hourHtml += `
      <div class="hour-row">
        <span class="hl">${h}:00〜${Number(h)+1}:00</span>
        <span class="hc">${g.count}件</span>
        <span class="hr">¥${g.amount.toLocaleString()}</span>
      </div>`;
    });
  }

  const html = `
  <!-- ペイキャスIC/QR確認カード -->
  <div class="paycas-card">
    <div class="paycas-card-title">💳 ペイキャス機械集計（IC・QR）</div>

    <div class="pc-input-block">
      <div class="pc-label">IC 利用金額</div>
      <input class="pc-input" type="number" id="paycas-ic" value="${savedIC || ''}" placeholder="0" oninput="onPCInput()" />
    </div>

    <div class="pc-input-block">
      <div class="pc-label">QR 利用金額</div>
      <input class="pc-input" type="number" id="paycas-qr" value="${savedQR || ''}" placeholder="0" oninput="onPCInput()" />
    </div>

    ${diffHtml}

    <button class="btn-pc-save" id="btn-pc-save" onclick="savePaycas()">💾 IC・QRを登録する</button>
    <div class="pc-saved-label" id="pc-saved-label">${savedLabel}</div>
  </div>

  <!-- 印刷・更新・メール・不具合 -->
  <button class="btn-print" onclick="printSummary()">🖨 レシート印刷</button>
  <button class="btn-reload" onclick="loadData()">🔄 最新データに更新</button>
  <button class="btn-email" onclick="sendEmail()">✉️ メール送信</button>
  <button class="btn-bug" onclick="toggleBug()">🐛 不具合報告</button>
  <div class="bug-panel" id="bug-panel">
    <div style="color:#c97a3a;font-size:15px;margin-bottom:10px;">具体的に詳細を書いてください</div>
    <textarea id="bug-text" placeholder="例：○○時頃、○○の操作をしたら△△になった"></textarea>
    <button class="btn-bug-send" onclick="sendBugReport()">📧 不具合を報告する</button>
  </div>

  <!-- メイン集計 -->
  <div class="summary-card">
    <div class="card-title">${timeStr}</div>

    <div class="big-item">
      <div class="big-label">現金合計</div>
      <div class="big-value">¥${cashTotal.toLocaleString()}</div>
    </div>
    <div class="sub-item">
      <span class="sub-label">朝〜15時まで</span>
      <span class="sub-value">¥${cashMorning.toLocaleString()}</span>
    </div>
    <div class="sub-item">
      <span class="sub-label">15時から閉店</span>
      <span class="sub-value">¥${cashEvening.toLocaleString()}</span>
    </div>

    <div class="big-item">
      <div class="big-label">ペイキャス合計</div>
      <div class="big-value">¥${paycasTotal.toLocaleString()}</div>
    </div>
    ${(savedIC > 0 || savedQR > 0) ? `
    <div class="sub-item">
      <span class="sub-label">　IC</span>
      <span class="sub-value">¥${savedIC.toLocaleString()}</span>
    </div>
    <div class="sub-item">
      <span class="sub-label">　QR</span>
      <span class="sub-value">¥${savedQR.toLocaleString()}</span>
    </div>` : ''}

    <div class="big-item">
      <div class="big-label">総売上</div>
      <div class="big-value">¥${grandTotal.toLocaleString()}</div>
    </div>

    <div class="count-row"><span class="cl">来客組数</span><span class="cv">${totalCount}組</span></div>
    <div class="count-row"><span class="cl">来客人数</span><span class="cv">${totalPeople}名</span></div>
  </div>

  <!-- 時間帯別 -->
  <div class="summary-card">
    <div class="card-title">時間帯別売上</div>
    ${hourHtml}
  </div>`;

  document.getElementById('mainContent').innerHTML = html;
}

// ── IC/QR入力時の差額リアルタイム表示 ──
function onPCInput() {
  const ic = parseInt(document.getElementById('paycas-ic').value) || 0;
  const qr = parseInt(document.getElementById('paycas-qr').value) || 0;
  const inputTotal = ic + qr;
  const paycasTotal = salesData.filter(s => s.pay_method === 'ペイキャス').reduce((a, s) => a + s.amount, 0);
  const diff = inputTotal - paycasTotal;
  const el = document.getElementById('paycas-diff') || (() => {
    // 差額表示エリアがまだなければ作成しない（renderで作成済み）
    return null;
  })();
  // diffエリアは render() 生成済みなのでidで取得
  const diffEl = document.querySelector('.pc-diff');
  if (!diffEl) return;
  if (ic === 0 && qr === 0) {
    diffEl.className = 'pc-diff neutral';
    diffEl.innerHTML = `ペイキャスデータ合計 ¥${paycasTotal.toLocaleString()}<br>IC・QRを入力して登録してください`;
  } else if (diff === 0) {
    diffEl.className = 'pc-diff ok';
    diffEl.innerHTML = `✅ 一致！　IC+QR ¥${inputTotal.toLocaleString()} ＝ データ ¥${paycasTotal.toLocaleString()}`;
  } else {
    diffEl.className = 'pc-diff ng';
    const sign = diff > 0 ? '+' : '';
    diffEl.innerHTML = `⚠️ 差額 ${sign}¥${diff.toLocaleString()}<br>IC+QR ¥${inputTotal.toLocaleString()} ／ データ ¥${paycasTotal.toLocaleString()}`;
  }
}

// ── IC/QR登録 ──
async function savePaycas() {
  const ic = parseInt(document.getElementById('paycas-ic').value) || 0;
  const qr = parseInt(document.getElementById('paycas-qr').value) || 0;
  const btn = document.getElementById('btn-pc-save');
  const label = document.getElementById('pc-saved-label');
  btn.disabled = true;
  btn.textContent = '登録中…';
  const today = todayJST();
  const { error } = await sb.from("paycas_daily").upsert({
    sale_date: today,
    ic_amount: ic,
    qr_amount: qr,
    updated_at: new Date().toISOString()
  }, { onConflict: 'sale_date' });
  if (error) {
    alert('保存に失敗しました：' + error.message);
    btn.disabled = false;
    btn.textContent = '💾 IC・QRを登録する';
    return;
  }
  savedIC = ic;
  savedQR = qr;
  btn.disabled = false;
  btn.textContent = '💾 IC・QRを登録する';
  label.textContent = `✅ 登録済み：IC ¥${ic.toLocaleString()} ／ QR ¥${qr.toLocaleString()}`;
}

// ── 不具合報告 ──
function toggleBug() {
  const panel = document.getElementById('bug-panel');
  if (!panel) return;
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
}
function sendBugReport() {
  const text = (document.getElementById('bug-text').value || '').trim();
  if (!text) { alert('内容を入力してください'); return; }
  const now = new Date();
  const dateStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const subject = encodeURIComponent(`[カトレア不具合報告] ${dateStr}`);
  const body = encodeURIComponent(`【不具合報告】\n日時：${dateStr}\n\n${text}\n\n---\nSummary.html より送信`);
  window.location.href = `mailto:mari247k@gmail.com?subject=${subject}&body=${body}`;
}

// ── メール送信 ──
function sendEmail() {
  const cashSales   = salesData.filter(s => s.pay_method === '現金');
  const paycasSales = salesData.filter(s => s.pay_method === 'ペイキャス');
  const cashTotal   = cashSales.reduce((a, s) => a + s.amount, 0);
  const paycasTotal = paycasSales.reduce((a, s) => a + s.amount, 0);
  const grandTotal  = salesData.reduce((a, s) => a + s.amount, 0);
  const totalCount  = salesData.length;
  const totalPeople = salesData.reduce((a, s) => a + (s.people_count || 0), 0);
  const cashMorning = cashSales.filter(s => (s.sale_time || '') < '15:00').reduce((a, s) => a + s.amount, 0);
  const cashEvening = cashTotal - cashMorning;

  const groups = {};
  salesData.forEach(s => {
    const h = (s.sale_time || '').split(':')[0] || '不明';
    if (!groups[h]) groups[h] = { count: 0, amount: 0 };
    groups[h].count++;
    groups[h].amount += s.amount;
  });

  const now = new Date();
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  const hourLines = Object.entries(groups).sort()
    .map(([h, g]) => `${h}:00〜${Number(h)+1}:00  ${g.count}件  ¥${g.amount.toLocaleString()}`)
    .join('\n');

  const pcLine = (savedIC > 0 || savedQR > 0)
    ? `\n  IC　　¥${savedIC.toLocaleString()}\n  QR　　¥${savedQR.toLocaleString()}`
    : '';

  const body =
`Lounge Cattleya 日計レポート
${dateStr} ${timeStr} 現在
━━━━━━━━━━━━━━━━
総売上　　¥${grandTotal.toLocaleString()}

現金　　　¥${cashTotal.toLocaleString()}（${cashSales.length}件）
　朝〜15時　¥${cashMorning.toLocaleString()}
　15時〜閉店　¥${cashEvening.toLocaleString()}
ペイキャス　¥${paycasTotal.toLocaleString()}（${paycasSales.length}件）${pcLine}

来客　${totalCount}組　${totalPeople}名
━━━━━━━━━━━━━━━━

function printSummary() {
  const cashSales   = salesData.filter(s => s.pay_method === '現金');

  const cashTotal   = cashSales.reduce((a, s) => a + s.amount, 0);
  const paycasTotal = paycasSales.reduce((a, s) => a + s.amount, 0);
  const grandTotal  = salesData.reduce((a, s) => a + s.amount, 0);
  const totalCount  = salesData.length;
  const totalPeople = salesData.reduce((a, s) => a + (s.people_count || 0), 0);
  const cashMorning = cashSales.filter(s => (s.sale_time || '') < '15:00').reduce((a, s) => a + s.amount, 0);
  const cashEvening = cashSales.filter(s => (s.sale_time || '') >= '15:00').reduce((a, s) => a + s.amount, 0);

  const groups = {};
  salesData.forEach(s => {
    const h = (s.sale_time || '').split(':')[0] || '不明';
    if (!groups[h]) groups[h] = { count: 0, amount: 0 };
    groups[h].count++;
    groups[h].amount += s.amount;
  });

  const now = new Date();
  const timeStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 '

      <td style="text-align:right">¥${g.amount.toLocaleString()}</td>

  ` : '';

      <tr><td>現金合計</td><td class="r">¥${cashTotal.toLocaleString()}</td></tr>

  const url = 'starpassprnt://v1/print/nopreview?back=' + encodeURIComponent(location.href) + '&html=' + encodeURIComponent(html);

}
