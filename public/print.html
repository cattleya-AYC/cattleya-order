<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>印刷通知</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0a05;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      padding: 24px;
      gap: 20px;
    }
    h1 {
      color: #c9952a;
      font-size: 22px;
      font-family: serif;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      max-width: 320px;
      padding: 36px 20px;
      border-radius: 20px;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      line-height: 1.6;
      border-width: 3px;
      border-style: solid;
    }
    .btn:active { opacity: 0.7; }
    .btn-print {
      background: #1a0a00;
      border-color: #ff6600;
      color: #ff9944;
    }
    .btn-call {
      background: #000d1a;
      border-color: #3399ff;
      color: #66bbff;
    }
    #msg {
      font-size: 20px;
      font-weight: 900;
      color: #4aaa5a;
      min-height: 32px;
      text-align: center;
    }
    .divider {
      width: 100%;
      max-width: 320px;
      border-top: 1px solid #3d2c14;
      margin: 10px 0;
    }
    .section-title {
      color: #8a7050;
      font-size: 14px;
      text-align: center;
      margin-bottom: 4px;
    }
    .text-input {
      width: 100%;
      max-width: 320px;
      padding: 14px 12px;
      border-radius: 10px;
      border: 2px solid #3d2c14;
      background: #1c1208;
      color: #f0e6d0;
      font-size: 18px;
      font-family: inherit;
    }
    .text-input:focus { outline: none; border-color: #c9952a; }
    textarea.text-input { resize: none; height: 96px; line-height: 1.5; }
    .char-count {
      color: #8a7050;
      font-size: 12px;
      text-align: right;
      width: 100%;
      max-width: 320px;
    }
    .char-count.over { color: #ff6666; }
    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 320px;
    }
    .btn-announce {
      flex: 2;
      padding: 18px 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      border: 2px solid #c9952a;
      background: #1c1208;
      color: #c9952a;
    }
    .btn-kitchen {
      border-color: #33aa66;
      color: #55cc88;
      background: #06140c;
    }
    .btn-clear {
      flex: 1;
      padding: 18px 0;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      border: 2px solid #3d2c14;
      background: transparent;
      color: #8a7050;
    }
    .btn-announce:active, .btn-clear:active { opacity: 0.7; }
    .result-msg {
      font-size: 14px;
      font-weight: 900;
      color: #4aaa5a;
      min-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>📲 スタッフへの通知</h1>
  <button class="btn btn-print" onclick="sendNotif('🖨️ 印刷のお知らせ', 'プリンターに印刷が届きました。ショートカットボタンから印刷してください。')">
    📄 印刷物を送りました<br/>スタッフに通知する
  </button>
  <button class="btn btn-call" onclick="sendNotif('📞 店長への連絡', '店長に電話するよう、オーナーから伝言があります。')">
    📞 店長に電話するよう<br/>伝えてください
  </button>
  <div id="msg"></div>

  <div class="divider"></div>

  <div class="section-title">📢 お知らせを流す（テーブル画面上部に10分表示）</div>
  <input id="announceText" class="text-input" type="text" maxlength="20" placeholder="例：15時までに片付けお願いします" />
  <div id="charCount" class="char-count">0 / 20</div>
  <div class="btn-row">
    <button class="btn-clear" onclick="clearAnnouncement()">消す</button>
    <button class="btn-announce" onclick="sendAnnouncement()">送信する（10分表示）</button>
  </div>
  <div id="announceMsg" class="result-msg"></div>

  <div class="divider"></div>

  <div class="section-title">🍳 厨房にメッセージ<br/>（閉店時 20時〜翌10時だけ流れる・10時で自動で消える）</div>
  <textarea id="kitchenText" class="text-input" maxlength="50" placeholder="例：明日はケーキ解凍を多めにお願いします"></textarea>
  <div id="kitchenCount" class="char-count">0 / 50</div>
  <div class="btn-row">
    <button class="btn-clear" onclick="clearKitchenMessage()">消す</button>
    <button class="btn-announce btn-kitchen" onclick="sendKitchenMessage()">厨房に送る</button>
  </div>
  <div id="kitchenMsg" class="result-msg"></div>

  <script>
    const { createClient } = supabase;
    const sb = createClient(
      "https://zxdgiszrsmumjjxmvszb.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4ZGdpc3pyc211bWpqeG12c3piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2ODM2MTksImV4cCI6MjA5NTI1OTYxOX0.vNndS7JEzIUsa007EPO2zRoYhUr-z01LM32BKIhMSz4"
    );

    // 厨房メッセージは announcements テーブルの id=2 を使う（id=1 はホール用）
    const KITCHEN_ANNOUNCE_ID = 2;

    async function sendNotif(title, message) {
      const btns = document.querySelectorAll(".btn");
      const msg = document.getElementById("msg");
      btns.forEach(b => { b.disabled = true; b.style.opacity = "0.5"; });
      msg.textContent = "送信中…";
      msg.style.color = "#aaa";

      const { error } = await sb.from("print_notifications").insert({
        sent_at: new Date().toISOString(),
        message: JSON.stringify({ title, message })
      });

      if (error) {
        msg.textContent = "❌ エラーが発生しました";
      } else {
        msg.textContent = "✅ 通知を送りました！";
        msg.style.color = "#4aaa5a";
        setTimeout(() => {
          msg.textContent = "";
          btns.forEach(b => { b.disabled = false; b.style.opacity = "1"; });
        }, 3000);
      }
    }

    function bindCounter(inputId, countId, max) {
      const input = document.getElementById(inputId);
      const count = document.getElementById(countId);
      input.addEventListener("input", () => {
        const len = input.value.length;
        count.textContent = `${len} / ${max}`;
        count.classList.toggle("over", len >= max);
      });
    }
    bindCounter("announceText", "charCount", 20);
    bindCounter("kitchenText", "kitchenCount", 50);

    function showResult(el, text, ok, ms) {
      el.textContent = text;
      el.style.color = ok === null ? "#aaa" : (ok ? "#4aaa5a" : "#ff6666");
      if (ms) setTimeout(() => { el.textContent = ""; }, ms);
    }

    // ===== ホール用お知らせ（10分） =====
    async function sendAnnouncement() {
      const input = document.getElementById("announceText");
      const text = input.value.trim();
      const out = document.getElementById("announceMsg");
      if (!text) { showResult(out, "❌ テキストを入力してください", false); return; }
      const expiresAt = new Date(Date.now() + 10 * 60 * 1000).toISOString();
      showResult(out, "送信中…", null);

      const { error } = await sb.from("announcements").upsert(
        { id: 1, text, expires_at: expiresAt, updated_at: new Date().toISOString() },
        { onConflict: "id" }
      );

      if (error) {
        showResult(out, "❌ エラーが発生しました", false);
      } else {
        showResult(out, "✅ お知らせを送りました（10分間表示）", true, 3000);
        input.value = "";
        document.getElementById("charCount").textContent = "0 / 20";
        document.getElementById("charCount").classList.remove("over");
      }
    }

    async function clearAnnouncement() {
      const out = document.getElementById("announceMsg");
      showResult(out, "消去中…", null);
      const { error } = await sb.from("announcements").upsert(
        { id: 1, text: "", expires_at: null, updated_at: new Date().toISOString() },
        { onConflict: "id" }
      );
      if (error) showResult(out, "❌ エラーが発生しました", false);
      else showResult(out, "✅ お知らせを消しました", true, 2000);
    }

    // ===== 厨房メッセージ（次の朝10時まで・表示は20時〜10時だけ） =====
    function next10amJST() {
      const jst = new Date(Date.now() + 9 * 3600 * 1000);
      let d = jst.getUTCDate();
      if (jst.getUTCHours() >= 10) d += 1;
      // JST 10:00 = UTC 01:00
      return new Date(Date.UTC(jst.getUTCFullYear(), jst.getUTCMonth(), d, 1, 0, 0)).toISOString();
    }

    async function sendKitchenMessage() {
      const input = document.getElementById("kitchenText");
      const text = input.value.trim();
      const out = document.getElementById("kitchenMsg");
      if (!text) { showResult(out, "❌ テキストを入力してください", false); return; }
      showResult(out, "送信中…", null);

      const { error } = await sb.from("announcements").upsert(
        { id: KITCHEN_ANNOUNCE_ID, text, expires_at: next10amJST(), updated_at: new Date().toISOString() },
        { onConflict: "id" }
      );

      if (error) {
        showResult(out, "❌ エラーが発生しました", false);
      } else {
        showResult(out, "✅ 厨房に送りました（翌朝10時まで）", true, 3000);
        input.value = "";
        document.getElementById("kitchenCount").textContent = "0 / 50";
        document.getElementById("kitchenCount").classList.remove("over");
      }
    }

    async function clearKitchenMessage() {
      const out = document.getElementById("kitchenMsg");
      showResult(out, "消去中…", null);
      const { error } = await sb.from("announcements").upsert(
        { id: KITCHEN_ANNOUNCE_ID, text: "", expires_at: null, updated_at: new Date().toISOString() },
        { onConflict: "id" }
      );
      if (error) showResult(out, "❌ エラーが発生しました", false);
      else showResult(out, "✅ 厨房メッセージを消しました", true, 2000);
    }
  </script>
</body>
</html>
