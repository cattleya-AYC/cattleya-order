<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>印刷通知</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0a05;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
      padding: 24px;
      gap: 20px;
    }
    h1 {
      color: #c9952a;
      font-size: 22px;
      font-family: serif;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      max-width: 320px;
      padding: 36px 20px;
      border-radius: 20px;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      line-height: 1.6;
      border-width: 3px;
      border-style: solid;
    }
    .btn:active { opacity: 0.7; }
    .btn-print {
      background: #1a0a00;
      border-color: #ff6600;
      color: #ff9944;
    }
    .btn-call {
      background: #000d1a;
      border-color: #3399ff;
      color: #66bbff;
    }
    #msg {
      font-size: 20px;
      font-weight: 900;
      color: #4aaa5a;
      min-height: 32px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>📲 スタッフへの通知</h1>
  <button class="btn btn-print" onclick="sendNotif('🖨️ 印刷のお知らせ', 'プリンターに印刷が届きました。ショートカットボタンから印刷してください。')">
    📄 印刷物を送りました<br/>スタッフに通知する
  </button>
  <button class="btn btn-call" onclick="sendNotif('📞 店長への連絡', '店長に電話するよう、オーナーから伝言があります。')">
    📞 店長に電話するよう<br/>伝えてください
  </button>
  <div id="msg"></div>

  <script>
    const { createClient } = supabase;
    const sb = createClient(
      "https://zxdgiszrsmumjjxmvszb.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4ZGdpc3pyc211bWpqeG12c3piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2ODM2MTksImV4cCI6MjA5NTI1OTYxOX0.vNndS7JEzIUsa007EPO2zRoYhUr-z01LM32BKIhMSz4"
    );

    async function sendNotif(title, message) {
      const btns = document.querySelectorAll(".btn");
      const msg = document.getElementById("msg");
      btns.forEach(b => { b.disabled = true; b.style.opacity = "0.5"; });
      msg.textContent = "送信中…";
      msg.style.color = "#aaa";

      const { error } = await sb.from("print_notifications").insert({
        sent_at: new Date().toISOString(),
        message: JSON.stringify({ title, message })
      });

      if (error) {
        msg.textContent = "❌ エラーが発生しました";
      } else {
        msg.textContent = "✅ 通知を送りました！";
        msg.style.color = "#4aaa5a";
        setTimeout(() => {
          msg.textContent = "";
          btns.forEach(b => { b.disabled = false; b.style.opacity = "1"; });
        }, 3000);
      }
    }
  </script>
</body>
</html>
