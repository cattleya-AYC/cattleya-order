<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スイーツ管理【管理者用】| Lounge Cattleya</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif; background: #fdf8f4; min-height: 100vh; }
  header { background: #3d2b1f; color: #fff; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  header .icon { font-size: 28px; }
  header h1 { font-size: 20px; font-weight: bold; letter-spacing: 2px; }
  header p { font-size: 12px; opacity: 0.7; margin-top: 2px; }
  .tabs { display: flex; background: #fff; border-bottom: 2px solid #e8ddd5; }
  .tab { flex: 1; padding: 13px 0; border: none; cursor: pointer; font-size: 14px; font-weight: bold; background: #fff; color: #999; border-bottom: 3px solid transparent; transition: all 0.2s; font-family: inherit; }
  .tab.active { background: #fdf8f4; color: #3d2b1f; border-bottom-color: #8b5e3c; }
  .content { padding: 16px 12px; max-width: 700px; margin: 0 auto; }
  .loading { text-align: center; padding: 60px 20px; color: #999; font-size: 15px; }

  /* 今日タブ */
  .date-label { text-align: center; color: #8b5e3c; font-size: 14px; margin-bottom: 16px; }
  .notice-box { background: #fff3e0; border: 2px solid #f0c987; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #8b5e3c; margin-bottom: 14px; line-height: 1.5; }
  .pattern-group-title { font-size: 15px; font-weight: bold; color: #3d2b1f; margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
  .item-card { background: #fff; border: 2px solid #e8ddd5; border-radius: 12px; margin-bottom: 10px; padding: 14px 16px; }
  .item-card.low { border-color: #f39c12; background: #fffbf0; }
  .item-card.out { border-color: #e74c3c; background: #fff5f5; }
  .item-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .item-name { font-weight: bold; font-size: 16px; color: #3d2b1f; flex: 1; }
  .item-sold { font-size: 13px; color: #888; }

  .item-bottom { display: flex; align-items: center; gap: 8px; }
  .col { text-align: center; flex: 1; }
  .col-label { font-size: 10px; color: #999; margin-bottom: 4px; }
  .col-val { font-size: 20px; font-weight: bold; border-radius: 8px; padding: 6px 8px; }
  .col-stock { color: #3d2b1f; background: #f0ece6; }
  .col-input { width: 100%; height: 44px; text-align: center; font-size: 20px; font-weight: bold; border: 2px solid #c9a882; border-radius: 8px; color: #3d2b1f; background: #fdf8f4; font-family: inherit; }
  .col-sold { color: #888; background: #f5f5f5; }
  .col-remain-ok { color: #27ae60; background: #eafaf1; }
  .col-remain-low { color: #e67e22; background: #fef9e7; }
  .col-remain-out { color: #e74c3c; background: #fde8e8; }
  .col-remain-none { color: #ccc; background: #f5f5f5; }

  .plus-sign { color: #c9a882; font-size: 18px; font-weight: bold; }
  .eq-sign { color: #c9a882; font-size: 18px; font-weight: bold; }
  .minus-sign { color: #c9a882; font-size: 18px; font-weight: bold; }

  .save-btn { width: 100%; padding: 16px 0; margin-top: 8px; background: #3d2b1f; color: #fff; border: none; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer; letter-spacing: 1px; font-family: inherit; }
  .save-btn:disabled { background: #ccc; cursor: not-allowed; }
  .saved-msg { text-align: center; color: #27ae60; font-weight: bold; margin-top: 10px; font-size: 16px; }

  /* 月次・日別共通 */
  .month-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .month-btn { background: #3d2b1f; border: none; color: #fff; width: 34px; height: 34px; border-radius: 7px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .month-label { flex: 1; text-align: center; font-size: 16px; font-weight: bold; color: #3d2b1f; background: #fff; border: 2px solid #c9a882; border-radius: 8px; padding: 8px; }
  .pdf-btn { background: #3d2b1f; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 14px; font-weight: bold; cursor: pointer; font-family: inherit; white-space: nowrap; }

  .month-cards { background: #fff; border: 2px solid #e8ddd5; border-radius: 12px; padding: 14px 16px; }
  .month-cards-title { font-size: 13px; font-weight: bold; color: #8b5e3c; margin-bottom: 10px; }
  .month-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .month-card { background: #fdf8f4; border: 1px solid #e8ddd5; border-radius: 8px; padding: 8px 12px; text-align: center; min-width: 88px; }
  .month-card-name { font-size: 11px; color: #999; margin-bottom: 3px; }
  .month-card-val { font-size: 22px; font-weight: bold; color: #3d2b1f; }
  .month-card-unit { font-size: 10px; color: #aaa; }

  .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid #e8ddd5; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
  thead th { background: #3d2b1f; color: #fff; padding: 10px 6px; text-align: center; font-size: 12px; white-space: nowrap; }
  tbody tr:nth-child(even) { background: #fdf8f4; }
  tbody td { padding: 9px 5px; text-align: center; color: #ccc; white-space: nowrap; }
  tbody td:first-child { font-weight: bold; color: #3d2b1f; }
  tbody td.has-val { color: #27ae60; font-weight: bold; }
  tfoot td { background: #fff3e0; font-weight: bold; color: #3d2b1f; padding: 10px 5px; text-align: center; border-top: 2px solid #e8ddd5; }
  tfoot td.total-val { color: #27ae60; }
</style>

<script>
const SUPA_URL = 'https://zxdgiszrsmumjjxmvszb.supabase.co';
const SUPA_KEY = 'sb_publishable_LLIkeICkSI-IS-2xMKO9_A_I8MAo2IT';

const ITEMS = ['ミルクレープ','ガトーショコラ','フォンダンショコラ','チーズケーキ','紅茶のシフォン','栗のモンブラン','コーヒーゼリー'];
const ITEMS_SET = new Set(ITEMS);
let lastCarryoverDebug = {}; // 持ち越し計算の内訳（今日タブに表示用）

// 冷凍庫在庫チェック用（毎週金曜・紙の在庫確認表と同じ10品目）
const FROZEN_CAKE_ITEMS = ['ミルクレープ','ガトーショコラ','フォンダンショコラ','チーズケーキ','紅茶のシフォン','栗のモンブラン'];
const FROZEN_DRINK_ITEMS = ['カルピス濃縮ボトル20杯用','カルピス濃縮ボトル9杯用','グアバジュース','コーヒーゼリー','バドワイザー'];
const FROZEN_ITEMS = FROZEN_CAKE_ITEMS.concat(FROZEN_DRINK_ITEMS);
// ドリンクは「1本(個)＝何杯分か」。レジの商品名（order_itemsのitem_name）も対応させる
const FROZEN_DRINK_RATIO = { 'カルピス濃縮ボトル20杯用': 20, 'カルピス濃縮ボトル9杯用': 9, 'グアバジュース': 1, 'コーヒーゼリー': 1, 'バドワイザー': 1 };
const FROZEN_DRINK_SALES_NAME = { 'カルピス濃縮ボトル20杯用': 'カルピス', 'カルピス濃縮ボトル9杯用': 'カルピス', 'グアバジュース': 'グアバジュース', 'コーヒーゼリー': 'コーヒーゼリー', 'バドワイザー': 'バドワイザー' };

function itemKey(item) {
  const i = ITEMS.indexOf(item);
  if (i !== -1) return 'i' + i;
  const f = FROZEN_ITEMS.indexOf(item);
  return 'f' + (f !== -1 ? f : item.length);
}

function toJST() {
  return new Date(Date.now() + 9*60*60*1000).toISOString().slice(0,10);
}
const TODAY = toJST();

function pad(n) { return String(n).padStart(2,'0'); }

function prevDate(d) {
  const dt = new Date(d);
  dt.setDate(dt.getDate()-1);
  return dt.toISOString().slice(0,10);
}

function nextDate(d) {
  const dt = new Date(d);
  dt.setDate(dt.getDate()+1);
  return dt.toISOString().slice(0,10);
}

// ウエイトレスが解凍数を入力する対象商品（冷凍庫から直行の2品を除く）
const WAITRESS_ITEMS = ITEMS.filter(item => item !== 'フォンダンショコラ' && item !== '紅茶のシフォン');

// ========== 定休日・休日前の自動判定 ==========
// 定休日：土・日・祝日
let holidaySetCache = null;
async function getHolidaySet() {
  if (holidaySetCache) return holidaySetCache;
  try {
    const res = await fetch('https://holidays-jp.github.io/api/v1/date.json');
    const data = await res.json();
    holidaySetCache = new Set(Object.keys(data));
  } catch (e) {
    holidaySetCache = new Set(); // 取得失敗時は祝日なし扱い（土日だけで判定）
  }
  return holidaySetCache;
}
function isClosedDay(dateStr, hset) {
  const dow = new Date(dateStr + 'T00:00:00Z').getUTCDay();
  return dow === 0 || dow === 6 || hset.has(dateStr);
}
// 「休日前」＝その日は営業日だが、翌日が定休日
async function getPatternForDate(dateStr) {
  const hset = await getHolidaySet();
  if (isClosedDay(dateStr, hset)) return 'normal'; // 念のため（本来は表示不要な日）
  return isClosedDay(nextDate(dateStr), hset) ? 'preholiday' : 'normal';
}

// ========== 推奨数パターン（通常／休日前）の共通データ ==========
let patternQty = { normal: {}, preholiday: {} };
let patternDataLoaded = false;

async function ensurePatternDataLoaded() {
  if (patternDataLoaded) return;
  const rows = await supaFetch('/rest/v1/cake_recommended_patterns?select=pattern,item_name,quantity');
  patternQty = { normal: {}, preholiday: {} };
  WAITRESS_ITEMS.forEach(item => { patternQty.normal[item] = 0; patternQty.preholiday[item] = 0; });
  (rows||[]).forEach(r => {
    if (patternQty[r.pattern] && patternQty[r.pattern][r.item_name] !== undefined) {
      patternQty[r.pattern][r.item_name] = r.quantity || 0;
    }
  });
  patternDataLoaded = true;
}

async function supaFetch(path) {
  const res = await fetch(SUPA_URL + path, {
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
  });
  return res.json();
}

// 指定日より前で、最後に保存された残数(remain)を商品ごとに1件だけ取得し、
// 保存日を含めて指定日の前日までに実際に売れた数（order_items＝レジの記録）のうち、
// 保存時点でまだ引かれていなかった分を追加で差し引く。
// 「解凍数を足し算し続ける」処理は一切しないので暴走リスクはない。
async function getCarryover(beforeDate, items) {
  const result = {};
  const debug = {};
  items.forEach(item => result[item] = 0);

  const remainRows = await supaFetch('/rest/v1/cake_stock?select=item_name,remain,sold,date&date=lt.' + beforeDate + '&remain=not.is.null&order=date.desc&limit=200');
  const lastRemain = {}, lastDate = {}, lastSoldAtSave = {};
  items.forEach(item => { lastRemain[item] = 0; lastDate[item] = null; lastSoldAtSave[item] = 0; });
  const seen = new Set();
  (remainRows||[]).forEach(r => {
    if (items.indexOf(r.item_name) !== -1 && !seen.has(r.item_name)) {
      lastRemain[r.item_name] = r.remain || 0;
      lastDate[r.item_name] = r.date;
      lastSoldAtSave[r.item_name] = r.sold || 0;
      seen.add(r.item_name);
    }
  });

  let earliestDate = null;
  items.forEach(item => {
    if (lastDate[item] && (!earliestDate || lastDate[item] < earliestDate)) earliestDate = lastDate[item];
  });

  const soldTotal = {};
  items.forEach(item => soldTotal[item] = 0);
  if (earliestDate) {
    const salesRows = await supaFetch('/rest/v1/order_items?select=item_name,qty,sale_date&sale_date=gte.' + earliestDate + '&sale_date=lt.' + beforeDate + '&limit=5000');
    (salesRows||[]).forEach(r => {
      if (items.indexOf(r.item_name) !== -1 && lastDate[r.item_name] && r.sale_date >= lastDate[r.item_name]) {
        soldTotal[r.item_name] += (r.qty||1);
      }
    });
  }

  items.forEach(item => {
    const adjustment = Math.max(0, soldTotal[item] - lastSoldAtSave[item]);
    result[item] = Math.max(0, lastRemain[item] - adjustment);
    debug[item] = {
      lastDate: lastDate[item],
      lastRemain: lastRemain[item],
      soldSinceIncludingSaveDay: soldTotal[item],
      adjustment: adjustment,
      result: result[item]
    };
  });
  lastCarryoverDebug = debug;
  return result;
}

function monthLabel(ym) { return ym.slice(0,4) + '年' + parseInt(ym.slice(5,7)) + '月'; }
function prevMonth(ym) { const d = new Date(ym+'-01'); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,7); }
function nextMonth(ym) { const d = new Date(ym+'-01'); d.setMonth(d.getMonth()+1); return d.toISOString().slice(0,7); }
function lastDay(ym) { return new Date(parseInt(ym.slice(0,4)), parseInt(ym.slice(5,7)), 0).getDate(); }

let currentMonth = TODAY.slice(0,7);
let dailyMonth = TODAY.slice(0,7);
let dailyData = [];
let monthSoldTotals = {};
let thawHistoryMonth = TODAY.slice(0,7);
let thawHistoryData = [];

// タブ切替
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ['today','month','daily','thawhistory','frozen','tomorrow','patterns'].forEach(t => {
      document.getElementById(t+'-content').style.display = t === tab ? 'block' : 'none';
    });
    if (tab === 'month') loadMonth();
    if (tab === 'daily') loadDaily();
    if (tab === 'thawhistory') loadThawHistory();
    if (tab === 'frozen') loadFrozen();
    if (tab === 'tomorrow') loadTomorrow();
    if (tab === 'patterns') loadPatterns();
  });
});

// ========== 今日タブ ==========
let stockMap = {};   // 前日残数（在庫）
let addMap = {};     // 解凍追加数
let soldMap = {};    // 販売数
let todayStockSaved = {}; // すでに保存されてる解凍追加数
let selectedDate = TODAY; // 表示・編集中の日付（過去日も選べる）

const todayDateInput = document.getElementById('today-date-input');
todayDateInput.value = selectedDate;
todayDateInput.max = TODAY; // 未来日は選べないようにする
todayDateInput.addEventListener('change', () => {
  if (!todayDateInput.value) { todayDateInput.value = selectedDate; return; }
  selectedDate = todayDateInput.value;
  loadToday();
});
document.getElementById('today-prev').addEventListener('click', () => {
  selectedDate = prevDate(selectedDate);
  todayDateInput.value = selectedDate;
  loadToday();
});
document.getElementById('today-next').addEventListener('click', () => {
  if (selectedDate >= TODAY) return; // 未来日には進めない
  selectedDate = nextDate(selectedDate);
  todayDateInput.value = selectedDate;
  loadToday();
});
document.getElementById('today-back-today-link').addEventListener('click', (e) => {
  e.preventDefault();
  selectedDate = TODAY;
  todayDateInput.value = selectedDate;
  loadToday();
});

async function loadToday() {
  document.getElementById('today-loading').style.display = 'block';
  document.getElementById('today-body').style.display = 'none';
  document.getElementById('today-back-today').style.display = selectedDate === TODAY ? 'none' : 'block';

  const YESTERDAY = prevDate(selectedDate);

  const [todayStockRaw, salesRaw] = await Promise.all([
    supaFetch('/rest/v1/cake_stock?select=item_name,thawed,sold&date=eq.' + selectedDate),
    supaFetch('/rest/v1/order_items?select=item_name,qty&sale_date=eq.' + selectedDate + '&limit=1000'),
  ]);

  // 直近に保存された残数（remain）を持ち越し在庫として使う（何日空いても1回の参照で正しく取れる）
  stockMap = await getCarryover(selectedDate, ITEMS);

  // 今日すでに保存されてる解凍追加数
  todayStockSaved = {};
  ITEMS.forEach(item => todayStockSaved[item] = 0);
  (todayStockRaw||[]).forEach(r => {
    todayStockSaved[r.item_name] = r.thawed||0;
  });

  // 今日の販売数
  soldMap = {};
  ITEMS.forEach(item => soldMap[item] = 0);
  (salesRaw||[]).forEach(r => {
    if (ITEMS_SET.has(r.item_name)) soldMap[r.item_name] += (r.qty||1);
  });

  // 解凍追加入力の初期値
  addMap = {};
  ITEMS.forEach(item => addMap[item] = todayStockSaved[item] > 0 ? todayStockSaved[item] : '');

  renderToday();
  document.getElementById('today-loading').style.display = 'none';
  document.getElementById('today-body').style.display = 'block';
}

function calcRemain(item) {
  const stock = stockMap[item] || 0;
  const add = parseInt(addMap[item]) || 0;
  const sold = soldMap[item] || 0;
  return stock + add - sold;
}

function renderToday() {
  const isPast = selectedDate !== TODAY;
  let html = '<div class="date-label">📅 ' + selectedDate.replace(/-/g,'/') + (isPast ? '（過去の日付を編集中）' : '') + '</div>';
  if (isPast) {
    html += '<div class="notice-box">⚠️ 今日ではない日付を表示・編集しています。保存すると、この日付のデータが上書きされます。</div>';
  }

  html += '<details style="margin-bottom:14px;background:#faf6ee;border:1px solid #e0d2b0;border-radius:10px;padding:10px 14px;font-size:13px;color:#7a6a4a;">';
  html += '<summary style="cursor:pointer;font-weight:700;">🔍 在庫の計算内訳を見る</summary>';
  html += '<table style="width:100%;margin-top:10px;border-collapse:collapse;font-size:12px;">';
  html += '<tr style="text-align:left;color:#a08858;"><th>商品</th><th>前回保存日</th><th>その日の残数</th><th>それ以降の販売</th><th>今日の持ち越し</th></tr>';
  ITEMS.forEach(item => {
    const d = lastCarryoverDebug[item] || {};
    html += '<tr><td>' + item + '</td><td>' + (d.lastDate ? d.lastDate.replace(/-/g,'/') : '記録なし') + '</td><td>' + (d.lastRemain ?? '-') + '</td><td>' + (d.adjustment ?? '-') + '</td><td><strong>' + (d.result ?? 0) + '</strong></td></tr>';
  });
  html += '</table></details>';

  ITEMS.forEach(item => {
    const stock = stockMap[item] || 0;
    const add = parseInt(addMap[item]) || 0;
    const sold = soldMap[item] || 0;
    const remain = stock + add - sold;
    const total = stock + add;
    const isOut = total > 0 && remain <= 0;
    const isLow = total > 0 && remain === 1;
    const cardClass = isOut ? 'out' : isLow ? 'low' : '';

    let remClass = 'col-remain-none';
    let remVal = '-';
    if (total > 0) {
      remVal = remain;
      remClass = isOut ? 'col-remain-out' : isLow ? 'col-remain-low' : 'col-remain-ok';
    }

    const key = itemKey(item);

    html += `
      <div class="item-card ${cardClass}" id="card-${key}">
        <div class="item-top">
          <div class="item-name">${item}</div>
          <div class="item-sold">販売済み: <strong>${sold}</strong> 個</div>
        </div>
        <div class="item-bottom">
          <div class="col">
            <div class="col-label">在庫</div>
            <div class="col-val col-stock">${stock}</div>
          </div>
          <div class="plus-sign">+</div>
          <div class="col">
            <div class="col-label">解凍追加</div>
            <input class="col-input" type="number" min="0" value="${addMap[item]}" data-item="${item}" onkeydown="if(event.key==='-')event.preventDefault()" />
          </div>
          <div class="minus-sign">−</div>
          <div class="col">
            <div class="col-label">販売</div>
            <div class="col-val col-sold">${sold}</div>
          </div>
          <div class="eq-sign">=</div>
          <div class="col">
            <div class="col-label">残数</div>
            <div class="col-val ${remClass}" id="rem-${key}">${remVal}</div>
          </div>
        </div>
      </div>`;
  });

  html += '<button class="save-btn" id="save-btn">💾 保存</button>';
  html += '<div class="saved-msg" id="saved-msg" style="display:none">保存しました ✓</div>';
  document.getElementById('today-body').innerHTML = html;

  // 入力イベント
  document.querySelectorAll('.col-input').forEach(inp => {
    inp.addEventListener('input', e => {
      const item = e.target.dataset.item;
      addMap[item] = e.target.value;
      updateRemain(item);
    });
  });

  // 保存ボタン
  document.getElementById('save-btn').addEventListener('click', async () => {
    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = '保存中...';

    const upserts = ITEMS.map(item => {
      const add = Math.max(0, parseInt(addMap[item]) || 0);
      const sold = soldMap[item] || 0;
      const stock = stockMap[item] || 0;
      return {
        date: selectedDate,
        item_name: item,
        thawed: add,
        sold: sold,
        remain: Math.max(0, stock + add - sold),
        saved_at: new Date().toISOString()
      };
    });

    try {
      const res = await fetch(SUPA_URL + '/rest/v1/cake_stock?on_conflict=date,item_name', {
        method: 'POST',
        headers: {
          'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY,
          'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'
        },
        body: JSON.stringify(upserts)
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error('保存に失敗しました (' + res.status + ') ' + errText);
      }

      const msg = document.getElementById('saved-msg');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 2500);
    } catch (err) {
      alert('保存できませんでした。通信状況を確認してもう一度試してください。\n\n' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = '💾 保存';
    }
  });
}

function updateRemain(item) {
  const key = itemKey(item);
  const stock = stockMap[item] || 0;
  const add = parseInt(addMap[item]) || 0;
  const sold = soldMap[item] || 0;
  const total = stock + add;
  const remain = total - sold;
  const isOut = total > 0 && remain <= 0;
  const isLow = total > 0 && remain === 1;
  const remClass = total === 0 ? 'col-remain-none' : isOut ? 'col-remain-out' : isLow ? 'col-remain-low' : 'col-remain-ok';
  const remVal = total > 0 ? remain : '-';
  const el = document.getElementById('rem-'+key);
  if (el) { el.className = 'col-val ' + remClass; el.textContent = remVal; }
  const card = document.getElementById('card-'+key);
  if (card) { card.className = 'item-card ' + (isOut ? 'out' : isLow ? 'low' : ''); }
}

  document.getElementById('thawhistory-body').style.display = 'none';

  const byDateItem = {};
  (data||[]).forEach(r => {
    if (!ITEMS_SET.has(r.item_name)) return;
    byDateItem[r.date + '__' + r.item_name] = { thawed: r.thawed||0, sold: r.sold||0, remain: r.remain, savedAt: r.saved_at };

  }

  let thead = '<thead><tr><th>日付</th>';

  thead += '</tr></thead>';

      let timeText = '';
      if (v.savedAt) {
        const dt = new Date(v.savedAt);
        const jst = new Date(dt.getTime() + 9*60*60*1000);
        const hh = String(jst.getUTCHours()).padStart(2,'0');
        const mm = String(jst.getUTCMinutes()).padStart(2,'0');

  document.getElementById('thawhistory-loading').style.display = 'none';
  document.getElementById('thawhistory-body').style.display = 'block';
}

async function loadDaily() {
  document.getElementById('daily-label').textContent = monthLabel(dailyMonth);
  document.getElementById('daily-loading').style.display = 'block';
  document.getElementById('daily-body').style.display = 'none';

  const from = dailyMonth + '-01';
  const last = lastDay(dailyMonth);
  const to = dailyMonth + '-' + pad(last);
  const data = await supaFetch('/rest/v1/order_items?select=item_name,qty,sale_date&sale_date=gte.' + from + '&sale_date=lte.' + to + '&limit=5000');

  const byDateItem = {};
  monthSoldTotals = {};
  ITEMS.forEach(item => monthSoldTotals[item] = 0);

  (data||[]).forEach(r => {
    if (!ITEMS_SET.has(r.item_name)) return;
    const key = r.sale_date + '__' + r.item_name;
    byDateItem[key] = (byDateItem[key]||0) + (r.qty||1);
    monthSoldTotals[r.item_name] += (r.qty||1);
  });

  dailyData = [];
  for (let d = 1; d <= last; d++) {
    const date = dailyMonth + '-' + pad(d);
    const sold = {};
    ITEMS.forEach(item => sold[item] = byDateItem[date+'__'+item]||0);
    dailyData.push({ date, sold });
  }

  let thead = '<thead><tr><th>日付</th>';
  ITEMS.forEach(item => thead += '<th>' + item + '</th>');
  thead += '<th>合計</th></tr></thead>';

  let tbody = '<tbody>';
  dailyData.forEach(row => {
    const total = ITEMS.reduce((s,item) => s + row.sold[item], 0);
    tbody += '<tr><td>' + row.date.slice(5) + '</td>';
    ITEMS.forEach(item => {
      const v = row.sold[item];
      tbody += '<td class="' + (v>0?'has-val':'') + '">' + (v>0?v:'-') + '</td>';
    });
    tbody += '<td class="' + (total>0?'has-val':'') + '">' + (total>0?total:'-') + '</td></tr>';
  });
  tbody += '</tbody>';

  const grandTotal = ITEMS.reduce((s,item) => s+monthSoldTotals[item], 0);
  let tfoot = '<tfoot><tr><td>合計</td>';
  ITEMS.forEach(item => tfoot += '<td class="total-val">' + monthSoldTotals[item] + '</td>');
  tfoot += '<td class="total-val">' + grandTotal + '</td></tr></tfoot>';

  document.getElementById('daily-body').innerHTML = '<div class="table-wrap"><table>' + thead + tbody + tfoot + '</table></div>';
  document.getElementById('daily-loading').style.display = 'none';
  document.getElementById('daily-body').style.display = 'block';
}

function printDaily() {

// ========== 冷凍在庫タブ ==========
let frozenQty = {};
let frozenUpdated = {};
let frozenSoldSince = {};

async function loadFrozen() {
  document.getElementById('frozen-loading').style.display = 'block';
  document.getElementById('frozen-body').style.display = 'none';

  const stockRaw = await supaFetch('/rest/v1/cake_frozen_stock?select=item_name,quantity,updated_date');

  frozenQty = {}; frozenUpdated = {};
  FROZEN_ITEMS.forEach(item => { frozenQty[item] = 0; frozenUpdated[item] = TODAY; });
  (stockRaw||[]).forEach(r => {
    if (FROZEN_ITEMS.indexOf(r.item_name) !== -1) {
      frozenQty[r.item_name] = r.quantity || 0;
      frozenUpdated[r.item_name] = r.updated_date;
    }
  });

  const earliestDate = FROZEN_ITEMS.reduce((min, item) => frozenUpdated[item] < min ? frozenUpdated[item] : min, TODAY);

  // ケーキ：冷凍庫→日々の解凍（cake_stock.thawed）で減る
  const thawRaw = await supaFetch('/rest/v1/cake_stock?select=item_name,thawed,date&date=gt.' + earliestDate + '&date=lte.' + TODAY);
  // ドリンク：レジの実売上（order_items）で減る
  const salesRaw = await supaFetch('/rest/v1/order_items?select=item_name,qty,sale_date&sale_date=gt.' + earliestDate + '&sale_date=lte.' + TODAY + '&limit=5000');

  frozenSoldSince = {}; // ケーキ＝解凍された数、ドリンク＝売れた杯数（名前は既存のまま流用）
  FROZEN_ITEMS.forEach(item => frozenSoldSince[item] = 0);
  (thawRaw||[]).forEach(r => {
    if (FROZEN_CAKE_ITEMS.indexOf(r.item_name) !== -1 && r.date > frozenUpdated[r.item_name]) {
      frozenSoldSince[r.item_name] += (r.thawed||0);
    }
  });
  (salesRaw||[]).forEach(r => {
    FROZEN_DRINK_ITEMS.forEach(item => {
      if (r.item_name === FROZEN_DRINK_SALES_NAME[item] && r.sale_date > frozenUpdated[item]) frozenSoldSince[item] += (r.qty||1);
    });
  });

  renderFrozen();
  document.getElementById('frozen-loading').style.display = 'none';
  document.getElementById('frozen-body').style.display = 'block';
}

function renderFrozen() {
  let html = '<div class="date-label">🧊 冷凍庫・ドリンク在庫（毎週金曜の棚卸し）</div>';

  html += '<div style="font-weight:700;color:#8b5e3c;margin:16px 0 8px;">🍰 ケーキ（棚卸し数から、それ以降に解凍した数を自動で差し引き）</div>';
  FROZEN_CAKE_ITEMS.forEach((item) => {
    const qty = frozenQty[item] || 0;
    const thawed = frozenSoldSince[item] || 0;
    const current = qty - thawed;
    const key = itemKey(item);
    const dispClass = current <= 0 ? 'col-remain-out' : current <= 3 ? 'col-remain-low' : 'col-remain-ok';
    html += `
      <div class="item-card" id="fcard-${key}">
        <div class="item-top">
          <div class="item-name">${item}</div>
          <div class="item-sold">最終棚卸し: ${frozenUpdated[item].replace(/-/g,'/')}</div>
        </div>
        <div class="item-bottom">
          <div class="col">
            <div class="col-label">棚卸し数</div>
            <div class="col-val col-stock">${qty}</div>
          </div>
          <div class="minus-sign">−</div>
          <div class="col">
            <div class="col-label">それ以降の解凍数</div>
            <div class="col-val col-sold">${thawed}</div>
          </div>
          <div class="eq-sign">=</div>
          <div class="col">
            <div class="col-label">現在の冷凍庫在庫</div>
            <div class="col-val ${dispClass}">${current}</div>
          </div>
        </div>
        <div style="margin-top:10px;display:flex;gap:8px;align-items:center;">
          <input class="col-input" style="flex:1" type="number" min="0" placeholder="実際に数えた数" id="finput-${key}" />
          <button class="save-btn" style="width:auto;padding:10px 16px;margin-top:0;font-size:14px;" onclick="recountFrozen('${item}')">✅ 再設定</button>
        </div>
      </div>`;
  });

  html += '<div style="font-weight:700;color:#8b5e3c;margin:20px 0 8px;">🥤 ドリンク（売上と比べて減りすぎていないかチェック）</div>';

  // --- カルピス（20杯用・9杯用の合体カード） ---
  const calpisSold = frozenSoldSince['カルピス濃縮ボトル20杯用'] || 0; // 両方に同じ売上数が入っている
  const calpis20Qty = frozenQty['カルピス濃縮ボトル20杯用'] || 0;
  const calpis9Qty = frozenQty['カルピス濃縮ボトル9杯用'] || 0;
  const calpisTotalCupsLast = calpis20Qty * 20 + calpis9Qty * 9;
  const calpisExpectedCupsNow = calpisTotalCupsLast - calpisSold;
  html += `
    <div class="item-card" id="fcard-calpis">
      <div class="item-top">
        <div class="item-name">カルピス濃縮ボトル</div>
        <div class="item-sold">最終棚卸し: ${frozenUpdated['カルピス濃縮ボトル20杯用'].replace(/-/g,'/')}（20杯用${calpis20Qty}本／9杯用${calpis9Qty}本＝残り約${calpisTotalCupsLast}杯分）</div>
      </div>
      <div class="item-bottom">
        <div class="col">
          <div class="col-label">前回からの売上</div>
          <div class="col-val col-sold">${calpisSold}杯</div>
        </div>
      </div>
      <div style="margin-top:12px;font-size:13px;color:#7a6a4a;">今回数えた本数</div>
      <div style="margin-top:6px;display:flex;gap:8px;align-items:center;">
        <input class="col-input" style="flex:1" type="number" min="0" placeholder="20杯用（本）" id="finput-calpis20" />
        <input class="col-input" style="flex:1" type="number" min="0" placeholder="9杯用（本）" id="finput-calpis9" />
        <button class="save-btn" style="width:auto;padding:10px 16px;margin-top:0;font-size:14px;" onclick="recountCalpis()">✅ 記録する</button>
      </div>
      <div id="fcheck-calpis" style="margin-top:8px;font-size:13px;"></div>
    </div>`;

  // --- その他ドリンク（1本(個)＝1杯扱い） ---
  ['グアバジュース','コーヒーゼリー','バドワイザー'].forEach((item) => {
    const qty = frozenQty[item] || 0;
    const soldCups = frozenSoldSince[item] || 0;
    const key = itemKey(item);
    html += `
      <div class="item-card" id="fcard-${key}">
        <div class="item-top">
          <div class="item-name">${item}</div>
          <div class="item-sold">最終棚卸し: ${frozenUpdated[item].replace(/-/g,'/')}（残り約${qty}杯分）</div>
        </div>
        <div class="item-bottom">
          <div class="col">
            <div class="col-label">前回からの売上</div>
            <div class="col-val col-sold">${soldCups}杯</div>
          </div>
        </div>
        <div style="margin-top:10px;display:flex;gap:8px;align-items:center;">
          <input class="col-input" style="flex:1" type="number" min="0" placeholder="今回数えた実際の数" id="finput-${key}" />
          <button class="save-btn" style="width:auto;padding:10px 16px;margin-top:0;font-size:14px;" onclick="recountFrozen('${item}')">✅ 記録する</button>
        </div>
        <div id="fcheck-${key}" style="margin-top:8px;font-size:13px;"></div>
      </div>`;
  });

  document.getElementById('frozen-body').innerHTML = html;

  // カルピス合体カードの異常チェック
  (function() {
    const input20 = document.getElementById('finput-calpis20');
    const input9 = document.getElementById('finput-calpis9');
    const checkBox = document.getElementById('fcheck-calpis');
    const check = () => {
      const v20 = parseInt(input20.value);
      const v9 = parseInt(input9.value);
      if (isNaN(v20) && isNaN(v9)) { checkBox.innerHTML = ''; return; }
      const newCups = (isNaN(v20)?0:v20)*20 + (isNaN(v9)?0:v9)*9;
      const diff = calpisExpectedCupsNow - newCups;
      if (diff > 5) {
        checkBox.innerHTML = '<span style="color:#c0392b;font-weight:700;">⚠️ 売上換算では約' + calpisExpectedCupsNow.toFixed(0) + '杯分残るはずが、今回は約' + newCups + '杯分。約' + diff.toFixed(0) + '杯分、説明のつかない減りがあります。</span>';
      } else {
        checkBox.innerHTML = '<span style="color:#4a8f4a;">✅ 売上換算の範囲内です（予想: 約' + calpisExpectedCupsNow.toFixed(0) + '杯分）</span>';
      }
    };
    input20.addEventListener('input', check);
    input9.addEventListener('input', check);
  })();

  // その他ドリンクの異常チェック
  ['グアバジュース','コーヒーゼリー','バドワイザー'].forEach((item) => {
    const key = itemKey(item);
    const input = document.getElementById('finput-'+key);
    const checkBox = document.getElementById('fcheck-'+key);
    input.addEventListener('input', () => {
      const newVal = parseInt(input.value);
      if (isNaN(newVal)) { checkBox.innerHTML = ''; return; }
      const soldCups = frozenSoldSince[item] || 0;
      const expectedNow = (frozenQty[item] || 0) - soldCups;
      const diff = expectedNow - newVal;
      if (diff > 0.5) {
        checkBox.innerHTML = '<span style="color:#c0392b;font-weight:700;">⚠️ 売上換算では約' + expectedNow + '個残るはずが、' + newVal + '個。約' + diff + '個分、説明のつかない減りがあります。</span>';
      } else {
        checkBox.innerHTML = '<span style="color:#4a8f4a;">✅ 売上換算の範囲内です（予想: 約' + expectedNow + '個）</span>';
      }
    });
  });
}

async function recountCalpis() {

  const v9 = parseInt(document.getElementById('finput-calpis9').value);

  if (!isNaN(v20) && v20 >= 0) rows.push({ item_name: 'カルピス濃縮ボトル20杯用', quantity: v20, updated_date: TODAY });
  if (!isNaN(v9) && v9 >= 0) rows.push({ item_name: 'カルピス濃縮ボトル9杯用', quantity: v9, updated_date: TODAY });

  try {
    const res = await fetch(SUPA_URL + '/rest/v1/cake_frozen_stock?on_conflict=item_name', {
      method: 'POST',

        'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY,

// 初期ロード
// ========== 明日の予定タブ（ウエイトレスが入力した内容を見る＋推奨準備数を入力） ==========
let recommendedMap = {};   // 推奨準備数（個別に上書きした場合のみ値が入る）
let tomorrowDateForRec = '';
let tomorrowAutoPattern = 'normal';
let tomorrowAutoQty = {};

async function loadTomorrow() {
  document.getElementById('tomorrow-loading').style.display = 'block';
  document.getElementById('tomorrow-body').style.display = 'none';

  const YESTERDAY_T = prevDate(TODAY);
  const TOMORROW_T = nextDate(TODAY);
  tomorrowDateForRec = TOMORROW_T;

  const [todayStockRaw, todaySalesRaw, tomorrowStockRaw] = await Promise.all([
    supaFetch('/rest/v1/cake_stock?select=item_name,thawed&date=eq.' + TODAY),
    supaFetch('/rest/v1/order_items?select=item_name,qty&sale_date=eq.' + TODAY + '&limit=1000'),
    supaFetch('/rest/v1/cake_stock?select=item_name,thawed,recommended&date=eq.' + TOMORROW_T),
  ]);

  await ensurePatternDataLoaded();
  tomorrowAutoPattern = await getPatternForDate(TOMORROW_T);
  tomorrowAutoQty = patternQty[tomorrowAutoPattern] || {};

  const todayAdded = {}, soldToday = {}, tomorrowThawed = {};
  WAITRESS_ITEMS.forEach(item => {
    todayAdded[item] = 0; soldToday[item] = 0; tomorrowThawed[item] = 0;
  });
  recommendedMap = {};
  WAITRESS_ITEMS.forEach(item => recommendedMap[item] = '');
  (todayStockRaw||[]).forEach(r => { if (todayAdded[r.item_name] !== undefined) todayAdded[r.item_name] = r.thawed || 0; });
  (todaySalesRaw||[]).forEach(r => { if (soldToday[r.item_name] !== undefined) soldToday[r.item_name] += (r.qty||1); });
  (tomorrowStockRaw||[]).forEach(r => {
    if (tomorrowThawed[r.item_name] !== undefined) tomorrowThawed[r.item_name] = r.thawed || 0;
    if (recommendedMap[r.item_name] !== undefined && r.recommended) recommendedMap[r.item_name] = String(r.recommended);
  });

  // 直近に保存された残数（remain）を持ち越し在庫として使う
  const leftoverFromYesterday = await getCarryover(TODAY, WAITRESS_ITEMS);

  const remainToday = {};
  WAITRESS_ITEMS.forEach(item => {
    const total = leftoverFromYesterday[item] + todayAdded[item];
    remainToday[item] = Math.max(0, total - soldToday[item]);
  });

  renderTomorrow(remainToday, tomorrowThawed, TOMORROW_T);
  document.getElementById('tomorrow-loading').style.display = 'none';
  document.getElementById('tomorrow-body').style.display = 'block';
}

function renderTomorrow(remainToday, tomorrowThawed, TOMORROW_T) {
  const patternLabel = tomorrowAutoPattern === 'preholiday' ? '🌙 休日前パターン' : '☀️ 通常パターン';
  let html = '<div class="date-label">🌙 ' + TOMORROW_T.replace(/-/g,'/') + ' の準備予定</div>';
  html += '<div class="notice-box">自動判定: <strong>' + patternLabel + '</strong> が適用されます。個別に変えたい時だけ下の「推奨準備数」に数字を入れてね（入れなければ自動の数字がそのまま使われます）</div>';
  WAITRESS_ITEMS.forEach(item => {
    const remain = remainToday[item];
    const thaw = tomorrowThawed[item];
    const prep = remain + thaw;
    const key = itemKey(item);
    const autoQty = tomorrowAutoQty[item] || 0;
    html += `
      <div class="item-card">
        <div class="item-top">
          <div class="item-name">${item}</div>
          <div class="item-sold">ウエイトレス入力・見るだけ</div>
        </div>
        <div class="item-bottom">
          <div class="col">
            <div class="col-label">今日の残り</div>
            <div class="col-val col-stock">${remain}</div>
          </div>
          <div class="plus-sign">+</div>
          <div class="col">
            <div class="col-label">${item === 'コーヒーゼリー' ? '作った数' : '解凍数'}</div>
            <div class="col-val col-stock">${thaw}</div>
          </div>
          <div class="eq-sign">=</div>
          <div class="col">
            <div class="col-label">明日の準備数</div>
            <div class="col-val col-remain-ok">${prep}</div>
          </div>
        </div>
        <div style="margin-top:10px;display:flex;gap:8px;align-items:center;">
          <div class="col-label" style="flex:0 0 auto;white-space:nowrap;">👍 推奨準備数</div>
          <input class="col-input" style="flex:1" type="number" min="0" placeholder="自動:${autoQty}個（変える時だけ入力）" value="${recommendedMap[item]}" data-item="${item}" id="rec-input-${key}" onkeydown="if(event.key==='-')event.preventDefault()" />
        </div>
      </div>`;
  });

  html += '<button class="save-btn" id="rec-save-btn">💾 推奨準備数を保存</button>';
  html += '<div class="saved-msg" id="rec-saved-msg" style="display:none">保存しました ✓</div>';

  document.getElementById('tomorrow-body').innerHTML = html;

  document.querySelectorAll('[id^="rec-input-"]').forEach(inp => {
    inp.addEventListener('input', e => {
      recommendedMap[e.target.dataset.item] = e.target.value;
    });
  });

  document.getElementById('rec-save-btn').addEventListener('click', async () => {
    const btn = document.getElementById('rec-save-btn');
    btn.disabled = true; btn.textContent = '保存中...';

    const upserts = WAITRESS_ITEMS.map(item => ({
      date: tomorrowDateForRec,
      item_name: item,
      recommended: Math.max(0, parseInt(recommendedMap[item]) || 0)
    }));

    try {
      const res = await fetch(SUPA_URL + '/rest/v1/cake_stock?on_conflict=date,item_name', {
        method: 'POST',
        headers: {
          'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY,
          'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'
        },
        body: JSON.stringify(upserts)
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error('保存に失敗しました (' + res.status + ') ' + errText);
      }

      const msg = document.getElementById('rec-saved-msg');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 2500);
    } catch (err) {
      alert('保存できませんでした。通信状況を確認してもう一度試してください。\n\n' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = '💾 推奨準備数を保存';
    }
  });
}

// PWA/ブラウザをバックグラウンドに長時間置いた後に開き直すと、日付の認識がズレたまま
// 動き続けてしまうことがあるため、5分以上非表示だった後に復帰したら自動で作り直す
let hiddenSince = null;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    hiddenSince = Date.now();
  } else if (hiddenSince && Date.now() - hiddenSince > 5 * 60 * 1000) {
    location.reload();
  }
});

// ========== 推奨数パターン設定タブ ==========
const PATTERN_DEFS = [
  { key: 'normal', label: '☀️ 通常パターン' },
  { key: 'preholiday', label: '🌙 休日前パターン（翌日が定休日の日）' }
];

async function loadPatterns() {
  document.getElementById('patterns-loading').style.display = 'block';
  document.getElementById('patterns-body').style.display = 'none';

  patternDataLoaded = false; // タブを開くたびに最新を取得
  await ensurePatternDataLoaded();

  renderPatterns();
  document.getElementById('patterns-loading').style.display = 'none';
  document.getElementById('patterns-body').style.display = 'block';
}

function renderPatterns() {
  let html = '<div class="notice-box">ここで登録した数字が、毎日自動でウエイトレス用アプリの「推奨準備数」に反映されます（明日が土日祝の前日なら休日前パターン、それ以外は通常パターン）。定休日：土・日・祝日</div>';

  PATTERN_DEFS.forEach(pd => {
    html += `<div class="pattern-group-title">${pd.label}</div>`;
    WAITRESS_ITEMS.forEach(item => {
      const key = 'p-' + pd.key + '-' + itemKey(item);
      const val = patternQty[pd.key][item] || 0;
      html += `
        <div class="item-card">
          <div class="item-top">
            <div class="item-name">${item}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="col-label" style="flex:0 0 auto;">推奨数</div>
            <input class="col-input" style="flex:1" type="number" min="0" value="${val}" data-pattern="${pd.key}" data-item="${item}" id="${key}" onkeydown="if(event.key==='-')event.preventDefault()" />
          </div>
        </div>`;
    });
  });

  html += '<button class="save-btn" id="patterns-save-btn">💾 パターンを保存</button>';
  html += '<div class="saved-msg" id="patterns-saved-msg" style="display:none">保存しました ✓</div>';

  document.getElementById('patterns-body').innerHTML = html;

  document.querySelectorAll('[id^="p-normal-"], [id^="p-preholiday-"]').forEach(inp => {
    inp.addEventListener('input', e => {
      patternQty[e.target.dataset.pattern][e.target.dataset.item] = e.target.value;
    });
  });

  document.getElementById('patterns-save-btn').addEventListener('click', async () => {
    const btn = document.getElementById('patterns-save-btn');
    btn.disabled = true; btn.textContent = '保存中...';

    const upserts = [];
    PATTERN_DEFS.forEach(pd => {
      WAITRESS_ITEMS.forEach(item => {
        upserts.push({
          pattern: pd.key,
          item_name: item,
          quantity: Math.max(0, parseInt(patternQty[pd.key][item]) || 0)
        });
      });
    });

    try {
      const res = await fetch(SUPA_URL + '/rest/v1/cake_recommended_patterns?on_conflict=pattern,item_name', {
        method: 'POST',
        headers: {
          'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY,
          'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'
        },
        body: JSON.stringify(upserts)
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error('保存に失敗しました (' + res.status + ') ' + errText);
      }

      patternDataLoaded = false; // 次回「明日の予定」タブを開いた時に最新を反映
      const msg = document.getElementById('patterns-saved-msg');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 2500);
    } catch (err) {
      alert('保存できませんでした。通信状況を確認してもう一度試してください。\n\n' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = '💾 パターンを保存';
    }
  });
}
