<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cattleya 経営管理</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0905; color: #f0e6d0; font-family: 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const supabase = window.supabase.createClient(
      "https://zxdgiszrsmumjjxmvszb.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4ZGdpc3pyc211bWpqeG12c3piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2ODM2MTksImV4cCI6MjA5NTI1OTYxOX0.vNndS7JEzIUsa007EPO2zRoYhUr-z01LM32BKIhMSz4"
    );

    const PASSWORD = "0329";
    const TOBACCO = [
      { name: "ピースライト ボックス", price: 600 },
      { name: "セブンスター ボックス", price: 600 },
      { name: "メビウス 1mg", price: 580 },
      { name: "メビウス 3mg", price: 580 },
      { name: "メビウス 6mg", price: 580 },
    ];

    function App() {
      const [authed, setAuthed] = useState(false);
      const [pw, setPw] = useState("");
      const [pwError, setPwError] = useState(false);
      const [tab, setTab] = useState("monthly");

      if (!authed) return (
        <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ background: "#181008", border: "1px solid #3d2c14", borderRadius: 16, padding: 32, width: "100%", maxWidth: 360 }}>
            <div style={{ fontFamily: "serif", color: "#c9952a", fontSize: 22, textAlign: "center", marginBottom: 8 }}>Lounge Cattleya</div>
            <div style={{ color: "#8a7050", fontSize: 12, textAlign: "center", marginBottom: 24 }}>経営管理画面</div>
            <input type="password" value={pw} onChange={e => setPw(e.target.value)}
              placeholder="パスワードを入力"
              style={{ width: "100%", padding: "12px 16px", background: "#251a0a", border: `1px solid ${pwError ? "#c95a5a" : "#3d2c14"}`, borderRadius: 8, color: "#f0e6d0", fontSize: 16, marginBottom: 12 }} />
            {pwError && <div style={{ color: "#c95a5a", fontSize: 12, marginBottom: 8 }}>パスワードが違います</div>}
            <button onClick={() => { if (pw === PASSWORD) { setAuthed(true); setPwError(false); } else setPwError(true); }}
              style={{ width: "100%", padding: 14, background: "#c9952a", border: "none", borderRadius: 8, color: "#0d0905", fontSize: 16, fontWeight: 700, cursor: "pointer" }}>
              ログイン
            </button>
          </div>
        </div>
      );

      return (
        <div style={{ minHeight: "100vh" }}>
          <div style={{ background: "#181008", borderBottom: "1px solid #3d2c14", padding: "12px 20px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ fontFamily: "serif", color: "#c9952a", fontSize: 16 }}>Cattleya 経営管理</div>
            <button onClick={() => setAuthed(false)} style={{ padding: "4px 12px", background: "transparent", border: "1px solid #3d2c14", borderRadius: 6, color: "#8a7050", fontSize: 11, cursor: "pointer" }}>ログアウト</button>
          </div>
          <div style={{ display: "flex", gap: 8, padding: "12px 16px", borderBottom: "1px solid #3d2c14", background: "#181008", overflowX: "auto" }}>
            {[["monthly", "📅 月次"], ["plu", "📋 PLU"], ["tobacco", "🚬 タバコ"]].map(([key, label]) => (
              <button key={key} onClick={() => setTab(key)}
                style={{ padding: "8px 16px", background: tab === key ? "#c9952a" : "transparent", border: `1px solid ${tab === key ? "#c9952a" : "#3d2c14"}`, borderRadius: 8, color: tab === key ? "#0d0905" : "#8a7050", fontSize: 13, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>
                {label}
              </button>
            ))}
          </div>
          <div style={{ padding: 16 }}>
            {tab === "monthly" && <MonthlyTab />}
            {tab === "plu" && <PLUTab />}
            {tab === "tobacco" && <TobaccoTab />}
          </div>
        </div>
      );
    }

    function MonthlyTab() {
      const [sales, setSales] = useState([]);
      const [tobaccoSales, setTobaccoSales] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedMonth, setSelectedMonth] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      });

      useEffect(() => { fetchAll(); }, [selectedMonth]);

      const fetchAll = async () => {
        setLoading(true);
        const [year, month] = selectedMonth.split('-');
        const startDate = `${year}-${month}-01`;
        const endDate = new Date(year, month, 0).toISOString().split('T')[0];
        const [{ data: s }, { data: t }] = await Promise.all([
          supabase.from("sales").select("*").gte("sale_date", startDate).lte("sale_date", endDate).order("sale_date"),
          supabase.from("tobacco_sales").select("*").gte("sale_date", startDate).lte("sale_date", endDate),
        ]);
        setSales(s || []);
        setTobaccoSales(t || []);
        setLoading(false);
      };

      const downloadCSV = () => {
        const rows = [["日付", "現金", "ペイキャス", "合計", "組数", "人数"]];
        Object.entries(byDate).sort().forEach(([date, d]) => {
          rows.push([date, d.cash, d.pay, d.total, d.count, d.people]);
        });
        rows.push([]);
        rows.push(["合計", totalCash, totalPay, totalAmount, totalCount, totalPeople]);
        rows.push([]);
        rows.push(["ペイキャス前半(1-15日)", firstHalfPay]);
        rows.push(["ペイキャス後半(16-末)", secondHalfPay]);
        rows.push([]);
        rows.push(["タバコ売上合計", tobaccoTotal]);
        TOBACCO.forEach(t => {
          rows.push([t.name, tobaccoByItem[t.name]?.count || 0, tobaccoByItem[t.name]?.total || 0]);
        });
        const csv = rows.map(r => r.join(",")).join("\n");
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `カトレア月次_${selectedMonth}.csv`;
        a.click();
      };

      const byDate = {};
      sales.forEach(s => {
        const d = s.sale_date;
        if (!byDate[d]) byDate[d] = { cash: 0, pay: 0, total: 0, count: 0, people: 0 };
        byDate[d].total += s.amount;
        byDate[d].count += 1;
        byDate[d].people += s.people_count || 0;
        if (s.pay_method === "現金") byDate[d].cash += s.amount;
        else byDate[d].pay += s.amount;
      });
      const totalCash = sales.filter(s => s.pay_method === "現金").reduce((a, s) => a + s.amount, 0);
      const totalPay = sales.filter(s => s.pay_method === "ペイキャス").reduce((a, s) => a + s.amount, 0);
      const totalAmount = sales.reduce((a, s) => a + s.amount, 0);
      const totalCount = sales.length;
      const totalPeople = sales.reduce((a, s) => a + (s.people_count || 0), 0);
      const firstHalfPay = sales.filter(s => s.pay_method === "ペイキャス" && parseInt(s.sale_date.split('-')[2]) <= 15).reduce((a, s) => a + s.amount, 0);
      const secondHalfPay = sales.filter(s => s.pay_method === "ペイキャス" && parseInt(s.sale_date.split('-')[2]) > 15).reduce((a, s) => a + s.amount, 0);
      const tobaccoTotal = tobaccoSales.reduce((a, s) => a + s.price, 0);
      const tobaccoByItem = {};
      TOBACCO.forEach(t => { tobaccoByItem[t.name] = { count: 0, total: 0 }; });
      tobaccoSales.forEach(s => {
        if (tobaccoByItem[s.item_name]) { tobaccoByItem[s.item_name].count += 1; tobaccoByItem[s.item_name].total += s.price; }
      });

      return (
        <div>
          <div style={{ display: "flex", gap: 8, marginBottom: 16, alignItems: "center" }}>
            <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)}
              style={{ flex: 1, padding: "10px 12px", background: "#251a0a", border: "1px solid #3d2c14", borderRadius: 8, color: "#f0e6d0", fontSize: 14 }} />
            <button onClick={downloadCSV} style={{ padding: "10px 16px", background: "#2a6a3a", border: "none", borderRadius: 8, color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
              CSV↓
            </button>
          </div>
          {loading ? <div style={{ textAlign: "center", color: "#8a7050", paddingTop: 40 }}>読み込み中...</div> : (
            <>
              <div style={{ background: "#181008", borderRadius: 10, padding: 16, marginBottom: 12 }}>
                <div style={{ fontFamily: "serif", color: "#c9952a", fontSize: 14, marginBottom: 10 }}>月間合計</div>
                {[["現金合計", `¥${totalCash.toLocaleString()}`], ["ペイキャス合計", `¥${totalPay.toLocaleString()}`]].map(([k, v]) => (
                  <div key={k} style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                    <span style={{ color: "#8a7050", fontSize: 12 }}>{k}</span>
                    <span style={{ color: "#c9952a" }}>{v}</span>
                  </div>
                ))}
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6, borderTop: "1px solid #3d2c14", paddingTop: 6 }}>
                  <span style={{ color: "#f0e6d0", fontWeight: 700 }}>総売上</span>
                  <span style={{ color: "#c9952a", fontFamily: "serif", fontSize: 18, fontWeight: 700 }}>¥{totalAmount.toLocaleString()}</span>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                  <span style={{ color: "#8a7050", fontSize: 12 }}>総組数</span>
                  <span style={{ color: "#c9952a" }}>{totalCount}組</span>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <span style={{ color: "#8a7050", fontSize: 12 }}>総人数</span>
                  <span style={{ color: "#c9952a" }}>{totalPeople}名</span>
                </div>
              </div>
              <div style={{ background: "#181008", borderRadius: 10, padding: 16, marginBottom: 12 }}>
                <div style={{ fontFamily: "serif", color: "#c9952a", fontSize: 14, marginBottom: 10 }}>ペイキャス内訳</div>
                {[["1日〜15日", firstHalfPay], ["16日〜月末", secondHalfPay], ["合計", totalPay]].map(([k, v], i) => (
                  <div key={k} style={{ display: "flex", justifyContent: "space-between", marginBottom: 6, ...(i === 2 ? { borderTop: "1px solid #3d2c14", paddingTop: 6 } : {}) }}>
                    <span style={{ color: i === 2 ? "#f0e6d0" : "#8a7050", fontSize: 12, fontWeight: i === 2 ? 700 : 400 }}>{k}</span>
                    <span style={{ color: "#c9952a", fontWeight: i === 2 ? 700 : 400 }}>¥{v.toLocaleString()}</span>
                  </div>
                ))}
              </div>
              <div style={{ background: "#181008", borderRadius: 10, padding: 16, marginBottom: 12 }}>
                <div style={{ fontFamily: "serif", color: "#c9952a", fontSize: 14, marginBottom: 10 }}>🚬 タバコ月間（別）</div>
                {TOBACCO.map(t => (
                  <div key={t.name} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid #3d2c1433" }}>
                    <span style={{ color: "#f0e6d0", fontSize: 12 }}>{t.name}</span>
                    <div>
                      <span style={{ color: "#8a7050", fontSize: 11, marginRight: 8 }}>{tobaccoByItem[t.name]?.count || 0}本</span>
                      <span style={{ color: "#c9952a" }}>¥{(tobaccoByItem[t.name]?.total || 0).toLocaleString()}</span>
                    </div>
                  </div>
                ))}
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, paddingTop: 8, borderTop: "1px solid #6a4d15" }}>
                  <span style={{ color: "#8a7050", fontSize: 12 }}>月計</span>
                  <span style={{ color: "#c9952a", fontWeight: 700 }}>¥{tobaccoTotal.toLocaleString()}</span>
                </div>
              </div>
              <div style={{ background: "#181008", borderRadius: 10, padding: 16 }}>
                <div style={{ fontFamily: "serif", color: "#c9952a", fontSize: 14, marginBottom: 10 }}>日別売上</div>
                {Object.entries(byDate).sort().map(([date, d]) => (
                  <div key={date} style={{ padding: "10px 0", borderBottom: "1px solid #3d2c1433" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                      <span style={{ color: "#f0e6d0", fontSize: 13 }}>{date.split('-')[2]}日</span>
                      <span style={{ color: "#c9952a", fontWeight: 700 }}>¥{d.total.toLocaleString()}</span>
                    </div>
                    <div style={{ display: "flex", gap: 10, fontSize: 11, color: "#8a7050", flexWrap: "wrap" }}>
                      <span>現金¥{d.cash.toLocaleString()}</span>
                      <span>ペイキャス¥{d.pay.toLocaleString()}</span>
                      <span>{d.count}組</span>
                      <span>{d.people}名</span>
                    </div>
                  </div>
                ))}
                {Object.keys(byDate).length === 0 && <div style={{ color: "#3d2c14", fontSize: 13 }}>データなし</div>}
              </div>
            </>
          )}
        </div>
      );
    }

    function PLUTab() {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedMonth, setSelectedMonth] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      });

      useEffect(() => { fetchItems(); }, [selectedMonth]);

      const fetchItems = async () => {
        setLoading(true);
        const [year, month] = selectedMonth.split('-');
        const startDate = `${year}-${month}-01`;
        const endDate = new Date(year, month, 0).toISOString().split('T')[0];
        const { data } = await supabase.from("order_items").select("*").gte("sale_date", startDate).lte("sale_date", endDate);
        setItems(data || []);
        setLoading(false);
      };

      const byItem = {};
      items.forEach(item => {
        if (item.price < 0) return;
        if (!byItem[item.item_name]) byItem[item.item_name] = { qty: 0, total: 0 };
        byItem[item.item_name].qty += item.qty;
        byItem[item.item_name].total += item.price * item.qty;
      });
      const sorted = Object.entries(byItem).sort((a, b) => b[1].total - a[1].total);
      const grandTotal = sorted.reduce((a, [, v]) => a + v.total, 0);
      const grandQty = sorted.reduce((a, [, v]) => a + v.qty, 0);

      const downloadCSV = () => {
        const rows = [["商品名", "販売数", "売上金額"]];
        sorted.forEach(([name, d]) => rows.push([name, d.qty, d.total]));
        rows.push([]);
        rows.push(["合計", grandQty, grandTotal]);
        const csv = rows.map(r => r.join(",")).join("\n");
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `カトレアPLU_${selectedMonth}.csv`;
        a.click();
      };

      return (
        <div>
          <div style={{ display: "flex", gap: 8, marginBottom: 16, alignItems: "center" }}>
            <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)}
              style={{ flex: 1, padding: "10px 12px", background: "#251a0a", border: "1px solid #3d2c14", borderRadius: 8, color: "#f0e6d0", fontSize: 14 }} />
            <button onClick={downloadCSV} style={{ padding: "10px 16px", background: "#2a6a3a", border: "none", borderRadius: 8, color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
              CSV↓
            </button>
          </div>
          {loading ? <div style={{ textAlign: "center", color: "#8a7050", paddingTop: 40 }}>読み込み中...</div> : (
            <>
              <div style={{ background: "#181008", borderRadius: 10, padding: 16, marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                  <span style={{ color: "#8a7050", fontSize: 12 }}>総売上</span>
                  <span style={{ color: "#c9952a", fontFamily: "serif", fontSize: 18, fontWeight: 700 }}>¥{grandTotal.toLocaleString()}</span>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <span style={{ color: "#8a7050", fontSize: 12 }}>総販売数</span>
                  <span style={{ color: "#c9952a" }}>{grandQty}点</span>
                </div>
              </div>
              <div style={{ background: "#181008", borderRadius: 10, padding: 16 }}>
                <div style={{ fontFamily: "serif", color: "#c9952a", fontSize: 14, marginBottom: 10 }}>売上順ランキング</div>
                {sorted.map(([name, d], i) => (
                  <div key={name} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: "1px solid #3d2c1433" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ color: i < 3 ? "#c9952a" : "#3d2c14", fontSize: 14, fontWeight: 700, width: 20 }}>{i + 1}</span>
                      <span style={{ color: "#f0e6d0", fontSize: 12 }}>{name}</span>
                    </div>
                    <div style={{ textAlign: "right" }}>
                      <span style={{ color: "#8a7050", fontSize: 11, marginRight: 8 }}>{d.qty}点</span>
                      <span style={{ color: "#c9952a", fontSize: 12 }}>¥{d.total.toLocaleString()}</span>
                    </div>
                  </div>
                ))}
                {sorted.length === 0 && <div style={{ color: "#3d2c14", fontSize: 13 }}>データなし</div>}
              </div>
            </>
          )}
        </div>
      );
    }

    function TobaccoTab() {
      const [sales, setSales] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedMonth, setSelectedMonth] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      });

      useEffect(() => { fetchSales(); }, [selectedMonth]);

      const fetchSales = async () => {
        setLoading(true);
        const [year, month] = selectedMonth.split('-');
        const startDate = `${year}-${month}-01`;
        const endDate = new Date(year, month, 0).toISOString().split('T')[0];
        const { data } = await supabase.from("tobacco_sales").select("*").gte("sale_date", startDate).lte("sale_date", endDate).order("sale_date");
        setSales(data || []);
        setLoading(false);
      };

      const byItem = {};
      TOBACCO.forEach(t => { byItem[t.name] = { count: 0, total: 0 }; });
      sales.forEach(s => {
        if (byItem[s.item_name]) { byItem[s.item_name].count += 1; byItem[s.item_name].total += s.price; }
      });
      const total = sales.reduce((a, s) => a + s.price, 0);

      const downloadCSV = () => {
        const rows = [["銘柄", "本数", "売上金額"]];
        TOBACCO.forEach(t => rows.push([t.name, byItem[t.name]?.count || 0, byItem[t.name]?.total || 0]));
        rows.push(["合計", sales.length, total]);
        const csv = rows.map(r => r.join(",")).join("\n");
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `カトレアタバコ_${selectedMonth}.csv`;
        a.click();
      };

      return (
        <div>
          <div style={{ display: "flex", gap: 8, marginBottom: 16, alignItems: "center" }}>
            <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)}
              style={{ flex: 1, padding: "10px 12px", background: "#251a0a", border: "1px solid #3d2c14", borderRadius: 8, color: "#f0e6d0", fontSize: 14 }} />
            <button onClick={downloadCSV} style={{ padding: "10px 16px", background: "#2a6a3a", border: "none", borderRadius: 8, color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
              CSV↓
            </button>
          </div>
          {loading ? <div style={{ textAlign: "center", color: "#8a7050", paddingTop: 40 }}>読み込み中...</div> : (
            <div style={{ background: "#181008", borderRadius: 10, padding: 16 }}>
              <div style={{ fontFamily: "serif", color: "#c9952a", fontSize: 14, marginBottom: 10 }}>🚬 タバコ銘柄別集計</div>
              {TOBACCO.map(t => (
                <div key={t.name} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid #3d2c1433" }}>
                  <span style={{ color: "#f0e6d0", fontSize: 13 }}>{t.name}</span>
                  <div>
                    <span style={{ color: "#8a7050", fontSize: 11, marginRight: 8 }}>{byItem[t.name]?.count || 0}本</span>
                    <span style={{ color: "#c9952a" }}>¥{(byItem[t.name]?.total || 0).toLocaleString()}</span>
                  </div>
                </div>
              ))}
              <div style={{ display: "flex", justifyContent: "space-between", marginTop: 12, paddingTop: 12, borderTop: "1px solid #6a4d15" }}>
                <span style={{ color: "#8a7050" }}>合計</span>
                <span style={{ color: "#c9952a", fontFamily: "serif", fontSize: 20, fontWeight: 800 }}>¥{total.toLocaleString()}</span>
              </div>
              {sales.length === 0 && <div style={{ color: "#3d2c14", fontSize: 13, marginTop: 8 }}>データなし</div>}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
